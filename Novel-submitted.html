<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Submitted / Pending | EarnGig</title>
 <link rel="stylesheet" href="styles.css">
 <style>
 .novel-list {
 display: grid;
 gap: 20px;
 margin-top: 25px;
 }
 .novel-card {
 background: #ffffff;
 color: #17204a;
 border-radius: 18px;
 padding: 22px;
 border: 1px solid rgba(20, 27, 72, .12);
 box-shadow: 0 10px 30px rgba(0,0,0,.08);
 }
 .novel-card-top {
 display: flex;
 gap: 18px;
 align-items: flex-start;
 }
 .novel-card img {
 width: 100px;
 height: 140px;
 object-fit: cover;
 border-radius: 12px;
 flex-shrink: 0;
 }
 .novel-card h3 {
 margin: 0 0 8px;
 }
 .novel-meta {
 display: grid;
 grid-template-columns: repeat(2, minmax(0,1fr));
 gap: 12px;
 margin-top: 18px;
 }
 .novel-meta-item {
 background: #f5f6fa;
 padding: 13px;
 border-radius: 10px;
 }
 .novel-meta-item small {
 display: block;
 opacity: .65;
 margin-bottom: 4px;
 }
 .status-badge {
 display: inline-block;
 padding: 6px 11px;
 border-radius: 999px;
 background: #eee8ff;
 color: #5f3fc4;
 font-size: 13px;
 margin-bottom: 10px;
 }
 .empty-state {
 text-align: center;
 padding: 45px 20px;
 background: rgba(255,255,255,.08);
 border-radius: 18px;
 }
 @media (max-width: 650px) {
 .novel-card-top {
 flex-direction: column;
 }
 .novel-meta {
 grid-template-columns: 1fr;
 }
 }
 </style>
</head>
<body>
<header>
 <div class="container nav">
 <a class="logo" href="index.html">
 <span class="logo-mark">E</span>
 Earn<span>Gig</span>
 </a>
 <a class="btn outline" href="create-and-earn.html">
   Create & Earn
 </a>
 </div>
</header>
<main class="dashboard-page">
 <div class="container">
 <div class="dashboard-heading">
 <div>
 <span class="eyebrow">MY NOVELS</span>
 <h1>Submitted / Pending</h1>
 <p>
 These novels have been submitted and are waiting for admin review.
 </p>
 </div>
 </div>
 <section class="dashboard-section">
 <div class="section-title">
 <div>
 <span class="eyebrow">SUBMISSIONS</span>
 <h2>Novels awaiting review</h2>
 </div>
 </div>
 <div id="novel-list" class="novel-list">
 <div class="empty-state">
 <h3>Loading your novels...</h3>
 <p>Please wait.</p>
 </div>
 </div>
 </section>
 </div>
</main>
<footer>
 <div class="container copy">
 © 2026 EarnGig. All rights reserved.
 </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
function escapeHtml(value) {
 return String(value || "")
 .replace(/&/g, "&amp;")
 .replace(/</g, "&lt;")
 .replace(/>/g, "&gt;")
 .replace(/"/g, "&quot;")
 .replace(/'/g, "&#039;");
}
function formatDate(value) {
 if (!value) return "";
 return new Date(value).toLocaleDateString(
 "en-NG",
 {
 year: "numeric",
 month: "short",
 day: "numeric"
 }
 );
}
async function loadSubmittedNovels() {
 const list =
 document.getElementById("novel-list");
 const {
 data: { user },
 error: userError
 } = await supabaseClient.auth.getUser();
 if (userError || !user) {
 window.location.href = "login.html";
 return;
 }
 const {
 data: novels,
 error
 } = await supabaseClient
 .from("novels")
 .select(`
 id,
 title,
 author_name,
 description,
 cover_url,
 genre,
 requested_reader_count,
 submission_status,
 created_at
 `)
 .eq("submitted_by", user.id)
   .in("submission_status", [
 "pending",
 "submitted"
 ])
 .order("created_at", {
 ascending: false
 });
 if (error) {
 console.error(
 "Unable to load submitted novels:",
 error
 );
 list.innerHTML = `
 <div class="empty-state">
 <h3>Unable to load novels</h3>
 <p>${escapeHtml(error.message)}</p>
 </div>
 `;
 return;
 }
 if (!novels || novels.length === 0) {
 list.innerHTML = `
 <div class="empty-state">
 <div style="font-size:40px;">■</div>
 <h3>No pending novels</h3>
 <p>
 You do not currently have any novels waiting for review.
 </p>
 <a
 href="create-and-earn.html"
 class="btn primary"
 >
 Submit a Novel
 </a>
 </div>
 `;
 return;
 }
 list.innerHTML =
 novels.map(function(novel) {
 return `
 <article class="novel-card">
 <div class="novel-card-top">
 ${
 novel.cover_url
 ? `
 <img
 src="${escapeHtml(novel.cover_url)}"
 alt="${escapeHtml(novel.title)}"
 >
 `
 : `
 <div
 style="
 width:100px;
 height:140px;
 border-radius:12px;
 background:#eee;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 "
 >
 ■
 </div>
 `
 }
 <div>
 <span class="status-badge">
 ${escapeHtml(
 novel.submission_status || "pending"
 )}
 </span>
 <h3>
 ${escapeHtml(novel.title)}
 </h3>
 <p>
 ${escapeHtml(
 novel.description ||
 "No description provided."
 )}
 </p>
 </div>
 </div>
 <div class="novel-meta">
 <div class="novel-meta-item">
 <small>Author</small>
 <strong>
 ${escapeHtml(novel.author_name)}
 </strong>
 </div>
 <div class="novel-meta-item">
 <small>Genre</small>
 <strong>
 ${escapeHtml(novel.genre)}
 </strong>
 </div>
 <div class="novel-meta-item">
 <small>Reader target</small>
 <strong>
 ${Number(
 novel.requested_reader_count || 0
 ).toLocaleString("en-NG")}
 readers
 </strong>
 </div>
 <div class="novel-meta-item">
 <small>Submitted</small>
 <strong>
 ${formatDate(novel.created_at)}
 </strong>
 </div>
 </div>
 <div
 class="assessment-notice"
 style="margin-top:18px;"
 >
 <strong>Awaiting admin review</strong>
 <p>
 Your novel is not yet available to readers.
 Once approved, it will move to
 <strong>Approved / Awaiting Payment</strong>.
 </p>
 </div>
 </article>
 `;
 }).join("");
}
loadSubmittedNovels();
</script>
</body>
</html>
