<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Marketplace | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <span class="admin-badge">ADMIN</span>

    <a class="btn outline" href="admin-dashboard.html">
      ← Admin Dashboard
    </a>

  </div>
</header>


<main class="dashboard-page">

  <div class="container">

    <div class="dashboard-heading">

      <div>

        <span class="eyebrow">MARKETPLACE ADMIN</span>

        <h1>Marketplace Listings</h1>

        <p>
          Review seller listings and approve or reject
          products and services.
        </p>

      </div>

    </div>


    <div class="dashboard-stats">

      <div class="dashboard-stat">
        <small>Pending</small>
        <strong id="pending-count">0</strong>
      </div>

      <div class="dashboard-stat">
        <small>Active</small>
        <strong id="active-count">0</strong>
      </div>

      <div class="dashboard-stat">
        <small>Rejected</small>
        <strong id="rejected-count">0</strong>
      </div>

      <div class="dashboard-stat">
        <small>Total Listings</small>
        <strong id="total-count">0</strong>
      </div>

    </div>


    <!-- PENDING -->

    <section class="dashboard-section">

      <div class="section-title">

        <div>
          <span class="eyebrow">REVIEW</span>
          <h2>Pending approval</h2>
        </div>

      </div>


      <div id="pending-listings">

        <div class="empty-state">
          <h3>Loading...</h3>
        </div>

      </div>

    </section>


    <!-- ALL LISTINGS -->

    <section class="dashboard-section">

      <div class="section-title">

        <div>
          <span class="eyebrow">MARKETPLACE</span>
          <h2>All listings</h2>
        </div>

      </div>


      <div id="all-listings">

        <div class="empty-state">
          <h3>Loading...</h3>
        </div>

      </div>

    </section>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig Administration.
  </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function loadListings() {

  const pendingContainer =
    document.getElementById("pending-listings");

  const allContainer =
    document.getElementById("all-listings");


  const {
    data: listings,
    error
  } = await supabaseClient
    .from("marketplace_listings")
    .select(`
      id,
      seller_id,
      title,
      category,
      description,
      price,
      delivery_type,
      status,
      created_at
    `)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(
      "Marketplace error:",
      error
    );

    const errorHTML = `
      <div class="empty-state">

        <h3>Unable to load listings</h3>

        <p>
          ${escapeHtml(error.message)}
        </p>

      </div>
    `;

    pendingContainer.innerHTML = errorHTML;
    allContainer.innerHTML = "";

    return;
  }


  const items = listings || [];


  const pending =
    items.filter(function(item) {
      return item.status === "pending";
    });


  const active =
    items.filter(function(item) {
      return item.status === "active";
    });


  const rejected =
    items.filter(function(item) {
      return item.status === "rejected";
    });


  document.getElementById(
    "pending-count"
  ).textContent = pending.length;


  document.getElementById(
    "active-count"
  ).textContent = active.length;


  document.getElementById(
    "rejected-count"
  ).textContent = rejected.length;


  document.getElementById(
    "total-count"
  ).textContent = items.length;


  renderPending(pending);
  renderAll(items);

}


function renderPending(listings) {

  const container =
    document.getElementById("pending-listings");


  if (!listings.length) {

    container.innerHTML = `
      <div class="empty-state">

        <div class="empty-icon">✓</div>

        <h3>No pending listings</h3>

        <p>
          There are no marketplace listings waiting
          for approval.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML =
    listings.map(function(listing) {

      return listingCard(
        listing,
        true
      );

    }).join("");

}


function renderAll(listings) {

  const container =
    document.getElementById("all-listings");


  if (!listings.length) {

    container.innerHTML = `
      <div class="empty-state">

        <h3>No listings yet</h3>

        <p>
          Seller listings will appear here.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML =
    listings.map(function(listing) {

      return listingCard(
        listing,
        false
      );

    }).join("");

}


function listingCard(
  listing,
  showActions
) {

  let statusText =
    String(
      listing.status || "pending"
    ).toUpperCase();


  return `

    <article
      class="marketplace-card"
      style="margin-bottom:20px;"
    >

      <div class="marketplace-card-body">

        <span class="product-category">
          ${escapeHtml(
            listing.category || "MARKETPLACE"
          )}
        </span>


        <h3>
          ${escapeHtml(listing.title)}
        </h3>


        <p>
          ${escapeHtml(
            listing.description || ""
          )}
        </p>


        <p>
          <strong>Price:</strong>

          <span
            style="
              color:#159661;
              font-size:20px;
              font-weight:800;
            "
          >
            ₦${Number(
              listing.price || 0
            ).toLocaleString("en-NG")}
          </span>
        </p>


        <p>
          <strong>Delivery:</strong>
          ${escapeHtml(
            listing.delivery_type ||
            "Not specified"
          )}
        </p>


        <p>
          <strong>Status:</strong>
          ${statusText}
        </p>


        ${
          showActions
            ? `

              <div
                style="
                  display:flex;
                  gap:10px;
                  flex-wrap:wrap;
                  margin-top:20px;
                "
              >

                <button
                  type="button"
                  class="btn primary"
                  onclick="approveListing('${listing.id}')"
                >
                  Approve
                </button>


                <button
                  type="button"
                  class="btn outline"
                  onclick="rejectListing('${listing.id}')"
                >
                  Reject
                </button>

              </div>

            `
            : ""
        }

      </div>

    </article>

  `;

}


async function approveListing(id) {

  const confirmed =
    confirm(
      "Approve this listing?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await supabaseClient
    .from("marketplace_listings")
    .update({
      status: "active"
    })
    .eq("id", id);


  if (error) {

    console.error(
      "Approve error:",
      error
    );

    alert(
      "Unable to approve listing:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Listing approved successfully."
  );


  await loadListings();

}


async function rejectListing(id) {

  const confirmed =
    confirm(
      "Reject this listing?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await supabaseClient
    .from("marketplace_listings")
    .update({
      status: "rejected"
    })
    .eq("id", id);


  if (error) {

    console.error(
      "Reject error:",
      error
    );

    alert(
      "Unable to reject listing:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Listing rejected."
  );


  await loadListings();

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadListings();

</script>

</body>
</html>
