<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novel Submissions | EarnGig Admin</title>

<link rel="stylesheet" href="styles.css">

<style>
.submission-list {
    display: grid;
    gap: 12px;
    margin-top: 25px;
}

.submission-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: center;
    gap: 20px;

    padding: 20px 22px;

    background: #ffffff;
    border: 1px solid #e4e5ec;
    border-radius: 14px;

    text-decoration: none;
    color: #17203a;

    transition: transform .2s ease, box-shadow .2s ease;
}

.submission-row:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,.08);
}

.submission-title {
    font-weight: 700;
    font-size: 17px;
}

.submission-writer {
    color: #666;
}

.submission-status {
    padding: 7px 12px;
    border-radius: 999px;
    background: #fff2d8;
    color: #9a6700;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.submission-arrow {
    font-size: 22px;
    color: #6f4b8b;
}

.empty-review {
    text-align: center;
    padding: 50px 20px;
    background: #ffffff;
    border-radius: 18px;
}

@media(max-width:700px) {

    .submission-row {
        grid-template-columns: 1fr auto;
    }

    .submission-writer {
        grid-column: 1;
    }

    .submission-status {
        grid-column: 2;
        grid-row: 1;
    }

    .submission-arrow {
        display: none;
    }
}
</style>

</head>

<body>

<header>

<div class="container nav">

<a class="logo" href="index.html">
<span class="logo-mark">E</span>
Earn<span>Gig</span>
</a>

<span class="admin-badge">ADMIN</span>

</div>

</header>


<main class="dashboard-page">

<div class="container">

<div class="dashboard-heading">

<div>

<span class="eyebrow">NOVEL ASSESSMENT</span>

<h1>Novel Submissions</h1>

<p>
Review novels submitted by writers and waiting for approval.
</p>

</div>

<a class="btn outline" href="admin-dashboard.html">
Admin Dashboard
</a>

</div>


<div id="submission-list" class="submission-list">

<div class="empty-review">

<h3>Loading submissions...</h3>

<p>Please wait.</p>

</div>

</div>

</div>

</main>


<footer>

<div class="container copy">
© 2026 EarnGig Administration.
</div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const list = document.getElementById("submission-list");


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function checkAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.href = "login.html";

        return null;

    }


    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("is_admin")
        .eq("id", user.id)
        .single();


    if (!profile?.is_admin) {

        alert("Admin access required.");

        window.location.href = "dashboard.html";

        return null;

    }


    return user;

}


async function loadSubmissions() {

    const { data, error } = await supabaseClient

        .from("novels")

        .select(`
            id,
            title,
            author_name,
            submission_status,
            created_at
        `)

        .eq("submission_status", "pending")

        .order("created_at", {
            ascending: true
        });


    if (error) {

        list.innerHTML = `
            <div class="empty-review">

                <h3>Unable to load submissions</h3>

                <p>${escapeHtml(error.message)}</p>

            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="empty-review">

                <h3>No pending submissions</h3>

                <p>
                    There are currently no novels waiting for admin review.
                </p>

            </div>
        `;

        return;

    }


    list.innerHTML = data.map(novel => {

        return `

        <a
            href="novel-review-detail.html?id=${encodeURIComponent(novel.id)}"
            class="submission-row"
        >

            <div>

                <div class="submission-title">
                    ${escapeHtml(novel.title)}
                </div>

            </div>


            <div class="submission-writer">

                ${escapeHtml(novel.author_name)}

            </div>


            <div class="submission-status">

                Pending Review

            </div>


            <div class="submission-arrow">

                →

            </div>

        </a>

        `;

    }).join("");

}


(async function() {

    const user = await checkAdmin();

    if (!user) return;

    await loadSubmissions();

})();

</script>

</body>
</html>
