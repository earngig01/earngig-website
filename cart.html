<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Cart | EarnGig Marketplace</title>


  <link
    rel="stylesheet"
    href="styles.css"
  >


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d1f;
      color: #ffffff;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input {
      font: inherit;
    }


    .page {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }


    /* ======================================================
       HEADER
    ====================================================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-bottom: 16px;
      border-bottom: 1px solid #202944;
      margin-bottom: 25px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
    }


    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );
      font-size: 21px;
      font-weight: 900;
    }


    .brand-text span {
      color: #8b5cf6;
    }


    .continue-btn {
      border: 1px solid #354064;
      background: #111a39;
      color: #dfe4f5;
      padding: 11px 18px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }


    .continue-btn:hover {
      background: #19244a;
      border-color: #6d4bd2;
    }


    /* ======================================================
       PAGE HEADER
    ====================================================== */

    .eyebrow {
      color: #9f83ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }


    .page-title {
      margin: 0 0 7px;
      font-size: 30px;
      font-weight: 800;
    }


    .page-subtitle {
      margin: 0 0 24px;
      color: #9ea8c3;
      font-size: 14px;
    }


    /* ======================================================
       LAYOUT
    ====================================================== */

    .cart-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        330px;
      gap: 18px;
      align-items: start;
    }


    /* ======================================================
       STORE GROUP
    ====================================================== */

    .store-group {
      background: #11182e;
      border: 1px solid #222b47;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
    }


    .store-header {
      padding: 14px 16px;
      background: #151d37;
      border-bottom: 1px solid #252e4c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }


    .store-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }


    .store-logo {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      object-fit: cover;
      background: #090d31;
      border: 1px solid #343963;
      flex-shrink: 0;
    }


    .store-name {
      font-size: 14px;
      font-weight: 800;
      word-break: break-word;
    }


    .store-label {
      color: #8994b1;
      font-size: 11px;
      margin-top: 3px;
    }


    .store-link {
      color: #a99cff;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }


    .store-link:hover {
      color: #c9c1ff;
    }


    .store-products {
      padding: 0 15px;
    }


    /* ======================================================
       CART ITEM
    ====================================================== */

    .cart-item {
      display: grid;
      grid-template-columns:
        82px
        minmax(0, 1fr)
        auto;
      gap: 13px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #202943;
    }


    .cart-item:last-child {
      border-bottom: 0;
    }


    .item-image-link {
      display: block;
    }


    .item-image {
      width: 82px;
      height: 82px;
      border-radius: 11px;
      object-fit: cover;
      background: #181f37;
      display: block;
    }


    .item-title {
      display: block;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
    }


    .item-title:hover {
      color: #c4b8ff;
    }


    .item-category {
      display: inline-block;
      font-size: 10px;
      color: #b9a2ff;
      background: rgba(
        124,
        58,
        237,
        0.13
      );
      padding: 4px 7px;
      border-radius: 6px;
      margin-bottom: 7px;
    }


    .item-price {
      color: #a78bfa;
      font-size: 14px;
      font-weight: 800;
    }


    .item-stock {
      color: #7f8aa8;
      font-size: 11px;
      margin-top: 5px;
    }


    .item-stock.warning {
      color: #f5c77a;
    }


    .item-stock.error {
      color: #f0aaaa;
    }


    .item-right {
      text-align: right;
      min-width: 110px;
    }


    .line-total {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 9px;
    }


    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid #303957;
      background: #0d1428;
      border-radius: 8px;
      overflow: hidden;
    }


    .quantity-btn {
      width: 29px;
      height: 29px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }


    .quantity-btn:hover {
      background: #202943;
    }


    .quantity-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }


    .quantity-value {
      min-width: 29px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }


    .remove-btn {
      display: block;
      margin: 7px 0 0 auto;
      border: 0;
      background: transparent;
      color: #ef6b78;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }


    .remove-btn:hover {
      color: #ff9ba5;
    }


    /* ======================================================
       SUMMARY
    ====================================================== */

    .summary {
      position: sticky;
      top: 15px;
      background: #11182e;
      border: 1px solid #292f50;
      border-radius: 16px;
      padding: 18px;
    }


    .summary-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 18px;
    }


    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #aeb7ce;
      font-size: 13px;
      margin-bottom: 11px;
    }


    .summary-row strong {
      color: #fff;
    }


    .summary-divider {
      height: 1px;
      background: #292f4c;
      margin: 16px 0;
    }


    .summary-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }


    .summary-total span {
      font-size: 14px;
      color: #c5ccdd;
    }


    .summary-total strong {
      font-size: 21px;
      color: #a78bfa;
    }


    .checkout-btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #9333ea
        );
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }


    .checkout-btn:hover {
      opacity: 0.93;
    }


    .checkout-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }


    .checkout-note {
      color: #7f8aa8;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      margin-top: 10px;
    }


    .validation-note {
      margin-top: 12px;
      padding: 10px 11px;
      border-radius: 9px;
      background: rgba(
        190,
        60,
        70,
        0.08
      );
      border: 1px solid rgba(
        210,
        70,
        80,
        0.25
      );
      color: #f0aaaa;
      font-size: 11px;
      line-height: 1.5;
      display: none;
    }


    .validation-note.visible {
      display: block;
    }


    /* ======================================================
       STATES
    ====================================================== */

    .state-box {
      background: #11182e;
      border: 1px solid #222b47;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
    }


    .state-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }


    .state-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }


    .state-text {
      color: #929db8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }


    .state-btn {
      display: inline-block;
      background: #1b2440;
      border: 1px solid #30395b;
      border-radius: 9px;
      padding: 10px 15px;
      color: #dce1ef;
      font-size: 12px;
      font-weight: 700;
    }


    .error-box {
      border-color: rgba(
        239,
        68,
        68,
        0.35
      );
    }


    .error-text {
      color: #f3a0a7;
    }


    /* ======================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      .cart-layout {
        grid-template-columns: 1fr;
      }


      .summary {
        position: static;
      }

    }


    @media (max-width: 600px) {

      .page {
        padding: 12px;
      }


      .topbar {
        margin-bottom: 20px;
      }


      .brand {
        font-size: 20px;
      }


      .brand-icon {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }


      .continue-btn {
        padding: 10px 12px;
        font-size: 11px;
      }


      .page-title {
        font-size: 25px;
      }


      .cart-item {
        grid-template-columns:
          65px
          minmax(0, 1fr);
        gap: 10px;
      }


      .item-image {
        width: 65px;
        height: 65px;
      }


      .item-right {
        grid-column: 2;
        text-align: left;
        min-width: 0;
      }


      .remove-btn {
        margin-left: 0;
      }


      .line-total {
        margin-bottom: 7px;
      }


      .store-header {
        align-items: flex-start;
      }


      .store-link {
        align-self: center;
      }

    }

  </style>

</head>


<body>


<div class="page">


  <!-- HEADER -->

  <div class="topbar">

    <a
      href="index.html"
      class="brand"
    >

      <div class="brand-icon">
        E
      </div>

      <div class="brand-text">
        Earn <span>Gig</span>
      </div>

    </a>


    <button
      type="button"
      class="continue-btn"
      onclick="window.location.href='marketplace.html'"
    >
      Continue Shopping
    </button>

  </div>


  <!-- TITLE -->

  <div class="eyebrow">
    EarnGig Marketplace
  </div>


  <h1 class="page-title">
    My Cart
  </h1>


  <p class="page-subtitle">
    Review your products before checkout.
  </p>


  <!-- CONTENT -->

  <div
    id="mainContent"
    class="cart-layout"
  >


    <div id="cartProducts">

      <div class="state-box">

        <div class="state-icon">
          🛒
        </div>

        <div class="state-title">
          Loading your cart
        </div>

        <div class="state-text">
          Please wait while we load your products.
        </div>

      </div>

    </div>


    <!-- SUMMARY -->

    <aside
      id="summary"
      class="summary"
      style="display:none;"
    >

      <div class="summary-title">
        Cart Summary
      </div>


      <div class="summary-row">

        <span>
          Items
        </span>

        <strong id="summaryItems">
          0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Vendors
        </span>

        <strong id="summaryVendors">
          0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Product total
        </span>

        <strong id="summarySubtotal">
          ₦0
        </strong>

      </div>


      <div class="summary-divider"></div>


      <div class="summary-total">

        <span>
          Subtotal
        </span>

        <strong id="summaryTotal">
          ₦0
        </strong>

      </div>


      <button
        id="checkoutButton"
        type="button"
        class="checkout-btn"
        disabled
      >
        Proceed to Checkout
      </button>


      <div class="checkout-note">
        Delivery details and payment method will
        be collected securely at checkout.
      </div>


      <div
        id="validationNote"
        class="validation-note"
      ></div>


    </aside>


  </div>

</div>


<script>


let currentUser = null;

let currentCart = null;

let cartItems = [];

let productsById = {};

let storesById = {};

let imagesByProduct = {};


/* ==========================================================
   DOM
========================================================== */


const cartProducts =
  document.getElementById(
    "cartProducts"
  );


const summary =
  document.getElementById(
    "summary"
  );


const summaryItems =
  document.getElementById(
    "summaryItems"
  );


const summaryVendors =
  document.getElementById(
    "summaryVendors"
  );


const summarySubtotal =
  document.getElementById(
    "summarySubtotal"
  );


const summaryTotal =
  document.getElementById(
    "summaryTotal"
  );


const checkoutButton =
  document.getElementById(
    "checkoutButton"
  );


const validationNote =
  document.getElementById(
    "validationNote"
  );


/* ==========================================================
   HELPERS
========================================================== */


function formatNaira(
  amount
) {

  return "₦" +
    Number(
      amount || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================================
   LOAD USER
========================================================== */


async function loadUser() {

  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient
      .auth
      .getUser();


  if (error) {

    throw error;

  }


  if (!user) {

    cartProducts.innerHTML = `

      <div class="state-box">

        <div class="state-icon">
          🔐
        </div>

        <div class="state-title">
          Please log in
        </div>

        <div class="state-text">
          You need to be logged in to view
          your marketplace cart.
        </div>

        <a
          href="login.html?redirect=${encodeURIComponent(
            window.location.href
          )}"
          class="state-btn"
        >
          Log In
        </a>

      </div>

    `;


    summary.style.display =
      "none";


    return false;

  }


  currentUser =
    user;


  return true;

}


/* ==========================================================
   LOAD / CREATE CART
========================================================== */


async function loadCart() {

  /*
   * New schema:
   *
   * marketplace_carts
   * user_id
   *
   * NOT buyer_id.
   */

  const {
    data: cart,
    error
  } =
    await supabaseClient
      .from(
        "marketplace_carts"
      )
      .select(`
        id,
        user_id,
        created_at,
        updated_at
      `)
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    throw error;

  }


  if (cart) {

    currentCart =
      cart;

    return;

  }


  const {
    data: newCart,
    error: createError
  } =
    await supabaseClient
      .from(
        "marketplace_carts"
      )
      .insert({
        user_id:
          currentUser.id
      })
      .select(`
        id,
        user_id,
        created_at,
        updated_at
      `)
      .single();


  if (createError) {

    throw createError;

  }


  currentCart =
    newCart;

}


/* ==========================================================
   LOAD CART ITEMS
========================================================== */


async function loadCartItems() {

  const {
    data: items,
    error
  } =
    await supabaseClient
      .from(
        "marketplace_cart_items"
      )
      .select(`
        id,
        cart_id,
        product_id,
        quantity,
        created_at
      `)
      .eq(
        "cart_id",
        currentCart.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    throw error;

  }


  cartItems =
    items || [];

}


/* ==========================================================
   LOAD PRODUCTS
========================================================== */


async function loadProducts() {

  productsById = {};


  const productIds =
    [
      ...new Set(
        cartItems
          .map(
            item =>
              item.product_id
          )
          .filter(Boolean)
      )
    ];


  if (!productIds.length) {

    return;

  }


  const {
    data: products,
    error
  } =
    await supabaseClient
      .from(
        "marketplace_products"
      )
      .select(`
        id,
        store_id,
        vendor_id,
        title,
        category,
        description,
        price,
        stock_quantity,
        delivery_type,
        status
      `)
      .in(
        "id",
        productIds
      );


  if (error) {

    throw error;

  }


  (
    products || []
  ).forEach(
    function(product) {

      productsById[
        product.id
      ] =
        product;

    }
  );

}


/* ==========================================================
   LOAD BRANDED IMAGES
========================================================== */


async function loadProductImages() {

  imagesByProduct = {};


  const productIds =
    Object.keys(
      productsById
    );


  if (!productIds.length) {

    return;

  }


  /*
   * Only branded images are allowed
   * in the buyer-facing marketplace.
   */

  const {
    data: images,
    error
  } =
    await supabaseClient
      .from(
        "marketplace_product_images"
      )
      .select(`
        product_id,
        image_url,
        is_primary,
        sort_order,
        watermark_applied
      `)
      .in(
        "product_id",
        productIds
      )
      .eq(
        "watermark_applied",
        true
      )
      .order(
        "is_primary",
        {
          ascending: false
        }
      )
      .order(
        "sort_order",
        {
          ascending: true
        }
      );


  if (error) {

    throw error;

  }


  (
    images || []
  ).forEach(
    function(image) {

      /*
       * First image wins because the
       * query is ordered primary first.
       */

      if (
        !imagesByProduct[
          image.product_id
        ]
      ) {

        imagesByProduct[
          image.product_id
        ] =
          image.image_url;

      }

    }
  );

}


/* ==========================================================
   LOAD STORES
========================================================== */


async function loadStores() {

  storesById = {};


  const storeIds =
    [
      ...new Set(
        Object.values(
          productsById
        )
          .map(
            product =>
              product.store_id
          )
          .filter(Boolean)
      )
    ];


  if (!storeIds.length) {

    return;

  }


  const {
    data: stores,
    error
  } =
    await supabaseClient
      .from(
        "marketplace_stores"
      )
      .select(`
        id,
        vendor_id,
        store_name,
        store_slug,
        store_logo_url,
        status,
        accepts_delivery,
        accepts_pickup
      `)
      .in(
        "id",
        storeIds
      );


  if (error) {

    throw error;

  }


  (
    stores || []
  ).forEach(
    function(store) {

      storesById[
        store.id
      ] =
        store;

    }
  );

}


/* ==========================================================
   GROUP CART BY STORE
========================================================== */


function getGroupedItems() {

  const groups = {};


  cartItems.forEach(
    function(item) {

      const product =
        productsById[
          item.product_id
        ];


      /*
       * Product was deleted or is no
       * longer accessible.
       */

      if (!product) {

        return;

      }


      const storeId =
        product.store_id;


      if (!storeId) {

        return;

      }


      if (!groups[storeId]) {

        groups[storeId] = {

          store:
            storesById[
              storeId
            ] || null,

          items: []

        };

      }


      groups[
        storeId
      ].items.push({

        ...item,

        product

      });

    }
  );


  return Object.values(
    groups
  );

}


/* ==========================================================
   VALIDATE CART
========================================================== */


function validateCart() {

  const problems = [];


  cartItems.forEach(
    function(item) {

      const product =
        productsById[
          item.product_id
        ];


      if (!product) {

        problems.push(
          "One or more products in your cart are no longer available."
        );

        return;

      }


      const status =
        String(
          product.status || ""
        ).toLowerCase();


      if (
        status !== "approved"
      ) {

        problems.push(
          `"${product.title}" is no longer available.`
        );

        return;

      }


      const stock =
        Number(
          product.stock_quantity || 0
        );


      const quantity =
        Number(
          item.quantity || 0
        );


      if (
        stock <= 0
      ) {

        problems.push(
          `"${product.title}" is out of stock.`
        );

        return;

      }


      if (
        quantity > stock
      ) {

        problems.push(
          `"${product.title}" only has ${stock} available.`
        );

      }


      if (
        !imagesByProduct[
          product.id
        ]
      ) {

        problems.push(
          `"${product.title}" no longer has a valid marketplace image.`
        );

      }


      const store =
        storesById[
          product.store_id
        ];


      if (
        !store ||
        String(
          store.status || ""
        ).toLowerCase() !==
        "active"
      ) {

        problems.push(
          `"${product.title}" seller store is no longer active.`
        );

      }

    }
  );


  return [
    ...new Set(
      problems
    )
  ];

}


/* ==========================================================
   UPDATE CHECKOUT STATE
========================================================== */


function updateCheckoutState() {

  const problems =
    validateCart();


  if (
    !cartItems.length
  ) {

    checkoutButton.disabled =
      true;

    validationNote.classList.remove(
      "visible"
    );

    return;

  }


  if (
    problems.length
  ) {

    checkoutButton.disabled =
      true;


    validationNote.innerHTML =
      problems
        .slice(0, 3)
        .map(
          problem =>
            `• ${escapeHtml(
              problem
            )}`
        )
        .join("<br>");


    if (
      problems.length > 3
    ) {

      validationNote.innerHTML +=
        `<br>• And ${
          problems.length - 3
        } more issue${
          problems.length - 3 === 1
            ? ""
            : "s"
        }.`;

    }


    validationNote.classList.add(
      "visible"
    );


    return;

  }


  checkoutButton.disabled =
    false;


  validationNote.classList.remove(
    "visible"
  );

}


/* ==========================================================
   RENDER CART
========================================================== */


function renderCart() {

  const groups =
    getGroupedItems();


  if (
    !groups.length
  ) {

    summary.style.display =
      "none";


    cartProducts.innerHTML = `

      <div class="state-box">

        <div class="state-icon">
          🛒
        </div>

        <div class="state-title">
          Your cart is empty
        </div>

        <div class="state-text">
          Add products from the marketplace
          and they will appear here.
        </div>

        <a
          href="marketplace.html"
          class="state-btn"
        >
          Start Shopping
        </a>

      </div>

    `;


    return;

  }


  let totalItems =
    0;


  let subtotal =
    0;


  groups.forEach(
    function(group) {

      group.items.forEach(
        function(item) {

          const quantity =
            Number(
              item.quantity || 0
            );


          const price =
            Number(
              item.product.price || 0
            );


          totalItems +=
            quantity;


          subtotal +=
            price *
            quantity;

        }
      );

    }
  );


  summaryItems.textContent =
    totalItems;


  summaryVendors.textContent =
    groups.length;


  summarySubtotal.textContent =
    formatNaira(
      subtotal
    );


  summaryTotal.textContent =
    formatNaira(
      subtotal
    );


  summary.style.display =
    "block";


  cartProducts.innerHTML =
    groups
      .map(
        function(group) {

          const store =
            group.store;


          const storeName =
            store?.store_name ||
            "EarnGig Vendor";


          const storeSlug =
            store?.store_slug ||
            "";


          const storeUrl =
            storeSlug
              ? `store.html?store=${
                  encodeURIComponent(
                    storeSlug
                  )
                }`
              : "marketplace.html";


          const storeLogo =
            store?.store_logo_url ||
            "";


          return `

            <section
              class="store-group"
            >


              <div
                class="store-header"
              >

                <div
                  class="store-header-left"
                >

                  ${
                    storeLogo
                      ? `
                        <img
                          src="${escapeHtml(
                            storeLogo
                          )}"
                          alt="${escapeHtml(
                            storeName
                          )}"
                          class="store-logo"
                        >
                      `
                      : `
                        <div
                          class="store-logo"
                          style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-weight:900;
                            color:#fff;
                            background:linear-gradient(
                              135deg,
                              #6d28d9,
                              #9333ea
                            );
                          "
                        >
                          ${escapeHtml(
                            storeName
                              .charAt(0)
                              .toUpperCase()
                          )}
                        </div>
                      `
                  }


                  <div>

                    <div class="store-name">

                      ${escapeHtml(
                        storeName
                      )}

                    </div>


                    <div class="store-label">
                      Products from this store
                    </div>

                  </div>

                </div>


                <a
                  href="${storeUrl}"
                  class="store-link"
                >
                  Visit Store →
                </a>


              </div>


              <div
                class="store-products"
              >

                ${group.items
                  .map(
                    function(item) {

                      return renderCartItem(
                        item
                      );

                    }
                  )
                  .join("")}

              </div>


            </section>

          `;

        }
      )
      .join("");


  updateCheckoutState();

}


/* ==========================================================
   RENDER CART ITEM
========================================================== */


function renderCartItem(
  item
) {

  const product =
    item.product;


  const quantity =
    Number(
      item.quantity || 1
    );


  const price =
    Number(
      product.price || 0
    );


  const stock =
    Number(
      product.stock_quantity || 0
    );


  const lineTotal =
    price *
    quantity;


  const image =
    imagesByProduct[
      product.id
    ] || "";


  let stockText =
    `${stock.toLocaleString(
      "en-NG"
    )} available`;


  let stockClass =
    "";


  if (
    stock <= 0
  ) {

    stockText =
      "Out of stock";

    stockClass =
      "error";

  } else if (
    stock <= 5
  ) {

    stockText =
      `${stock} available`;

    stockClass =
      "warning";

  }


  const minusDisabled =
    quantity <= 1
      ? ""
      : "";


  const plusDisabled =
    stock <= quantity
      ? "disabled"
      : "";


  return `

    <article
      class="cart-item"
    >


      <a
        href="product.html?id=${
          encodeURIComponent(
            product.id
          )
        }"
        class="item-image-link"
      >

        <img
          src="${escapeHtml(
            image
          )}"
          alt="${escapeHtml(
            product.title
          )}"
          class="item-image"
        >

      </a>


      <div>


        <a
          href="product.html?id=${
            encodeURIComponent(
              product.id
            )
          }"
          class="item-title"
        >
          ${escapeHtml(
            product.title
          )}
        </a>


        <div>

          <span
            class="item-category"
          >
            ${escapeHtml(
              product.category ||
              "Other"
            )}
          </span>

        </div>


        <div class="item-price">
          ${formatNaira(
            price
          )}
        </div>


        <div
          class="item-stock ${stockClass}"
        >
          ${escapeHtml(
            stockText
          )}
        </div>


      </div>


      <div
        class="item-right"
      >


        <div
          class="line-total"
        >
          ${formatNaira(
            lineTotal
          )}
        </div>


        <div
          class="quantity-control"
        >

          <button
            type="button"
            class="quantity-btn"
            onclick="changeQuantity(
              '${item.id}',
              ${quantity - 1}
            )"
            aria-label="Decrease quantity"
          >
            −
          </button>


          <span
            class="quantity-value"
          >
            ${quantity}
          </span>


          <button
            type="button"
            class="quantity-btn"
            ${plusDisabled}
            onclick="changeQuantity(
              '${item.id}',
              ${quantity + 1}
            )"
            aria-label="Increase quantity"
          >
            +
          </button>

        </div>


        <button
          type="button"
          class="remove-btn"
          onclick="removeItem(
            '${item.id}'
          )"
        >
          Remove
        </button>


      </div>


    </article>

  `;

}


/* ==========================================================
   CHANGE QUANTITY
========================================================== */


async function changeQuantity(
  itemId,
  newQuantity
) {

  try {

    const quantity =
      Number(
        newQuantity
      );


    if (
      quantity <= 0
    ) {

      await removeItem(
        itemId
      );

      return;

    }


    const item =
      cartItems.find(
        function(current) {

          return (
            current.id ===
            itemId
          );

        }
      );


    if (!item) {

      return;

    }


    const product =
      productsById[
        item.product_id
      ];


    if (!product) {

      alert(
        "This product is no longer available."
      );

      return;

    }


    const stock =
      Number(
        product.stock_quantity || 0
      );


    if (
      stock <= 0
    ) {

      alert(
        "This product is out of stock."
      );

      return;

    }


    if (
      quantity > stock
    ) {

      alert(
        `Only ${stock} item${
          stock === 1
            ? ""
            : "s"
        } currently available.`
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from(
          "marketplace_cart_items"
        )
        .update({
          quantity:
            quantity
        })
        .eq(
          "id",
          itemId
        )
        .eq(
          "cart_id",
          currentCart.id
        );


    if (error) {

      throw error;

    }


    await refreshCart();

  } catch (error) {

    console.error(
      "Quantity update error:",
      error
    );


    alert(
      "Could not update the quantity. Please try again."
    );

  }

}


/* ==========================================================
   REMOVE ITEM
========================================================== */


async function removeItem(
  itemId
) {

  try {

    const {
      error
    } =
      await supabaseClient
        .from(
          "marketplace_cart_items"
        )
        .delete()
        .eq(
          "id",
          itemId
        )
        .eq(
          "cart_id",
          currentCart.id
        );


    if (error) {

      throw error;

    }


    await refreshCart();

  } catch (error) {

    console.error(
      "Remove cart item error:",
      error
    );


    alert(
      "Could not remove this item. Please try again."
    );

  }

}


/* ==========================================================
   REFRESH
========================================================== */


async function refreshCart() {

  await loadCart();

  await loadCartItems();

  await loadProducts();

  await loadProductImages();

  await loadStores();

  renderCart();

}


/* ==========================================================
   CHECKOUT
========================================================== */


checkoutButton.addEventListener(
  "click",
  function() {

    const problems =
      validateCart();


    if (
      problems.length
    ) {

      updateCheckoutState();

      return;

    }


    if (
      !cartItems.length
    ) {

      return;

    }


    window.location.href =
      "checkout.html";

  }
);


/* ==========================================================
   INITIALIZE
========================================================== */


async function initializeCart() {

  try {

    const loggedIn =
      await loadUser();


    if (!loggedIn) {

      return;

    }


    await loadCart();

    await loadCartItems();

    await loadProducts();

    await loadProductImages();

    await loadStores();

    renderCart();

  } catch (error) {

    console.error(
      "Cart loading error:",
      error
    );


    summary.style.display =
      "none";


    cartProducts.innerHTML = `

      <div
        class="state-box error-box"
      >

        <div class="state-icon">
          ⚠️
        </div>

        <div class="state-title">
          Cart could not be loaded
        </div>

        <div
          class="state-text error-text"
        >
          ${escapeHtml(
            error.message ||
            "Please refresh the page and try again."
          )}
        </div>

      </div>

    `;

  }

}


initializeCart();

</script>
