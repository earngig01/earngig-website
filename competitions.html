<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitions & Awards - EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d2d;
      color: #fff;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 20px 0 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #9b7cff;
    }

    .back {
      background: #171d4a;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 9px;
      border: 1px solid #363c6d;
    }

    .hero {
      background: linear-gradient(135deg, #171d4c, #21164d);
      border: 1px solid #343a70;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 8px;
    }

    .muted {
      color: #979fc4;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
    }

    .tab {
      white-space: nowrap;
      background: #11173a;
      color: #b8bedf;
      border: 1px solid #30366a;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab.active {
      background: #7148df;
      color: #fff;
      border-color: #8d6af0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .competition {
      background: #10163b;
      border: 1px solid #292f62;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .competition h3 {
      margin: 0 0 7px;
    }

    .type {
      display: inline-block;
      background: #20275a;
      color: #c2b4ff;
      padding: 4px 8px;
      border-radius: 15px;
      font-size: 11px;
      margin-bottom: 9px;
    }

    .prizes {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prize {
      background: #151b44;
      border: 1px solid #2b3265;
      border-radius: 8px;
      padding: 9px 11px;
    }

    .actions {
      margin-top: 14px;
    }

    button,
    .button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
    }

    .primary {
      background: #7448e8;
      color: white;
    }

    .primary:hover {
      background: #855cf0;
    }

    .email {
      background: #159a6d;
      color: white;
    }

    .winner {
      background: #10163b;
      border: 1px solid #343b71;
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .winner h3 {
      margin: 0 0 8px;
    }

    .winner-amount {
      font-size: 22px;
      font-weight: 800;
      color: #bca6ff;
      margin: 8px 0;
    }

    .status {
      display: inline-block;
      background: #183c31;
      color: #6feab8;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 700;
    }

    .school-note {
      background: #171e49;
      border: 1px solid #383f75;
      border-radius: 9px;
      padding: 10px;
      margin: 10px 0;
      color: #c8cdef;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #8d95bb;
      background: #10163b;
      border: 1px solid #292f62;
      border-radius: 13px;
    }

    .quiz-box {
      background: #0e1435;
      border: 1px solid #30366c;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .timer {
      font-size: 27px;
      font-weight: 800;
      color: #ffdc72;
      margin-bottom: 15px;
      font-family: monospace;
    }

    .question {
      background: #151b44;
      border: 1px solid #2c3265;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .question-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    label.option {
      display: block;
      background: #10163a;
      border: 1px solid #30366b;
      border-radius: 8px;
      padding: 9px;
      margin-top: 7px;
      cursor: pointer;
    }

    label.option:hover {
      background: #1a2050;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 15px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #451d2a;
      color: #ff9dad;
    }

    .message.success {
      background: #103d2e;
      color: #72efbb;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">EarnGig</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </header>

  <div id="message" class="message"></div>

  <section class="hero">
    <h1>🏆 Competitions & Awards</h1>
    <div class="muted">
      Enter competitions, complete challenges and see your awards.
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" onclick="showTab('new', this)">
      🆕 New Competitions
    </button>

    <button class="tab" onclick="showTab('participated', this)">
      📋 Participated
    </button>

    <button class="tab" onclick="showTab('won', this)">
      🏆 Won
    </button>
  </div>

  <section id="new" class="section active">
    <div id="newList"></div>
  </section>

  <section id="participated" class="section">
    <div id="participatedList"></div>
  </section>

  <section id="won" class="section">
    <div id="wonList"></div>
  </section>

  <section id="quizArea" style="display:none;">
    <div class="quiz-box">
      <div id="quizTitle"></div>
      <div id="timer" class="timer">00:00</div>
      <div id="quizQuestions"></div>

      <button
        class="primary"
        onclick="submitQuiz()"
      >
        Submit Quiz
      </button>
    </div>
  </section>

</div>

<script>
let currentUser = null;
let competitions = [];
let entries = [];
let winners = [];
let prizes = [];

let activeQuizEntry = null;
let activeQuiz = null;
let quizTimer = null;
let quizSubmitting = false;

function showMessage(text, type = "success") {
  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message show " + type;

  setTimeout(() => {
    box.className = "message";
  }, 5000);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatMoney(amount) {
  if (amount === null || amount === undefined || amount === "") {
    return "";
  }

  return "₦" + Number(amount).toLocaleString("en-NG");
}

function formatDate(value) {
  if (!value) return "-";

  return new Date(value).toLocaleDateString(
    "en-NG",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );
}

function showTab(tab, button) {
  document.querySelectorAll(".section").forEach(section => {
    section.classList.remove("active");
  });

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.remove("active");
  });

  document.getElementById(tab).classList.add("active");

  if (button) {
    button.classList.add("active");
  }
}

async function verifyUser() {
  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "index.html";
    return false;
  }

  currentUser = user;
  return true;
}

async function loadCompetitions() {
  const { data, error } = await supabaseClient
    .from("competitions")
    .select("*")
    .in("status", [
      "published",
      "closed",
      "winners_announced",
      "completed"
    ])
    .order("start_at", { ascending: true });

  if (error) throw error;

  competitions = data || [];
}

async function loadEntries() {
  const { data, error } = await supabaseClient
    .from("competition_entries")
    .select("*")
    .eq("user_id", currentUser.id);

  if (error) throw error;

  entries = data || [];
}

async function loadWinners() {
  const { data, error } = await supabaseClient
    .from("competition_winners")
    .select("*")
    .eq("user_id", currentUser.id);

  if (error) throw error;

  winners = data || [];
}

async function loadPrizes() {
  const ids = competitions.map(c => c.id);

  if (!ids.length) {
    prizes = [];
    return;
  }

  const { data, error } = await supabaseClient
    .from("competition_prizes")
    .select("*")
    .in("competition_id", ids)
    .order("prize_order", { ascending: true });

  if (error) throw error;

  prizes = data || [];
}

function getPrizes(competitionId) {
  return prizes.filter(
    p => p.competition_id === competitionId
  );
}

function getEntry(competitionId) {
  return entries.find(
    e => e.competition_id === competitionId
  );
}

function getWinner(competitionId) {
  return winners.find(
    w => w.competition_id === competitionId
  );
}

function prizeText(prize) {
  if (!prize) return "Prize";

  let text = prize.prize_name || prize.prize_type;

  if (
    prize.amount !== null &&
    prize.amount !== undefined
  ) {
    text += " — " + formatMoney(prize.amount);
  }

  return text;
}

function renderPrizes(competitionId) {
  const list = getPrizes(competitionId);

  if (!list.length) {
    return `<div class="muted">Prize details will be announced.</div>`;
  }

  return `
    <div class="prizes">
      ${list.map((prize, index) => `
        <div class="prize">
          <strong>
            ${escapeHtml(
              prize.prize_name ||
              `${index + 1}${index === 0 ? "st" : index === 1 ? "nd" : index === 2 ? "rd" : "th"} Place`
            )}
          </strong>

          ${
            prize.amount !== null &&
            prize.amount !== undefined
              ? " — " + escapeHtml(formatMoney(prize.amount))
              : ""
          }

          ${
            prize.item_description
              ? `<div class="muted">${escapeHtml(prize.item_description)}</div>`
              : ""
          }
        </div>
      `).join("")}
    </div>
  `;
}

function renderNew() {
  const box = document.getElementById("newList");

  const list = competitions.filter(
    competition => !getEntry(competition.id)
  );

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        No new competitions available right now.
      </div>
    `;
    return;
  }

  box.innerHTML = list.map(renderCompetitionCard).join("");
}

function renderParticipated() {
  const box = document.getElementById("participatedList");

  const list = competitions.filter(
    competition => {
      const entry = getEntry(competition.id);
      const winner = getWinner(competition.id);

      return entry && !winner;
    }
  );

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        You have no competitions in this section.
      </div>
    `;
    return;
  }

  box.innerHTML = list.map(renderCompetitionCard).join("");
}

function renderCompetitionCard(competition) {
  const entry = getEntry(competition.id);
  const isQuiz = competition.competition_type === "quiz";

  return `
    <div class="competition">

      <span class="type">
        ${escapeHtml(competition.competition_type || "competition")}
      </span>

      <h3>${escapeHtml(competition.title)}</h3>

      <div class="muted">
        ${escapeHtml(competition.description || "")}
      </div>

      ${
        competition.end_at
          ? `<div class="muted" style="margin-top:7px;">
               Ends: ${escapeHtml(formatDate(competition.end_at))}
             </div>`
          : ""
      }

      ${renderPrizes(competition.id)}

      ${
        isQuiz && competition.quiz_time_limit_minutes
          ? `<div class="school-note">
               ⏱️ Timed Quiz:
               ${escapeHtml(competition.quiz_time_limit_minutes)}
               minutes
             </div>`
          : ""
      }

      <div class="actions">

        ${
          entry
            ? `
              <span class="status">
                ${escapeHtml(
                  entry.entry_status || "Submitted"
                )}
              </span>
            `
            : `
              <button
                class="primary"
                onclick="enterCompetition('${competition.id}')"
              >
                ${isQuiz ? "▶️ Start Quiz" : "Enter Competition"}
              </button>
            `
        }

      </div>
    </div>
  `;
}

function renderWon() {
  const box = document.getElementById("wonList");

  if (!winners.length) {
    box.innerHTML = `
      <div class="empty">
        You have not been selected as a winner yet.
      </div>
    `;
    return;
  }

  box.innerHTML = winners.map(winner => {
    const competition = competitions.find(
      c => c.id === winner.competition_id
    );

    const prize = prizes.find(
      p => p.id === winner.prize_id
    );

    if (!competition) {
      return "";
    }

    const isSchoolFees =
      prize?.prize_type === "school_fees";

    const isCash =
      prize?.prize_type === "cash";

    let action = "";

    if (isSchoolFees) {
      const subject =
        "EarnGig School Fees Award - " +
        competition.title;

      const body =
`Hello EarnGig,

I have been selected for a School Fees Award.

Competition: ${competition.title}
Award: ${prize?.amount ? formatMoney(prize.amount) : "School Fees Award"}
Winner Position: ${winner.winner_position}

I would like to proceed with the school fees award.

Thank you.`;

      const mailto =
        "mailto:ahruhenterprises@gmail.com" +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      action = `
        <div class="school-note">
          🏫 This school-fees award is handled directly by EarnGig.
          The award amount will <strong>not</strong> be added to your wallet.
        </div>

        <a
          class="button email"
          href="${mailto}"
        >
          📧 Contact EarnGig for School Fees
        </a>
      `;
    } else if (isCash) {
      action = `
        <div class="school-note">
          💰 Cash prize awards are credited to your EarnGig wallet
          after admin fulfilment.
        </div>
      `;
    } else {
      action = `
        <div class="school-note">
          🎁 This award is fulfilled manually by EarnGig.
        </div>
      `;
    }

    return `
      <div class="winner">

        <span class="status">
          🏆 ${escapeHtml(
            winner.winner_status || "Selected"
          )}
        </span>

        <h3>
          ${escapeHtml(competition.title)}
        </h3>

        <div class="muted">
          Position #${escapeHtml(winner.winner_position)}
        </div>

        <div class="winner-amount">
          ${escapeHtml(prizeText(prize))}
        </div>

        ${action}

      </div>
    `;
  }).join("");
}

async function enterCompetition(competitionId) {
  const competition = competitions.find(
    c => c.id === competitionId
  );

  if (!competition) {
    return;
  }

  if (competition.competition_type === "quiz") {
    await startQuiz(competitionId);
    return;
  }

  const existing = getEntry(competitionId);

  if (existing) {
    showMessage(
      "You have already entered this competition.",
      "error"
    );
    return;
  }

  const { error } = await supabaseClient
    .from("competition_entries")
    .insert({
      competition_id: competitionId,
      user_id: currentUser.id,
      entry_status: "submitted",
      submitted_at: new Date().toISOString()
    });

  if (error) {
    showMessage(error.message, "error");
    return;
  }

  showMessage("Your entry has been submitted.");

  await reload();
}

async function startQuiz(competitionId) {
  const { data, error } =
    await supabaseClient.rpc(
      "start_competition_quiz",
      {
        p_competition_id: competitionId
      }
    );

  if (error) {
    showMessage(error.message, "error");
    return;
  }

  if (!data?.entry_id) {
    showMessage(
      data?.message || "Unable to start quiz.",
      "error"
    );
    return;
  }

  activeQuizEntry = data.entry_id;
  activeQuiz = data;

  document.getElementById("quizArea").style.display = "block";
  document.getElementById("quizTitle").innerHTML =
    `<h2>${escapeHtml(data.title || "Quiz")}</h2>`;

  renderQuestions(data.questions || []);

  startCountdown(data.expires_at);

  window.scrollTo({
    top: document.getElementById("quizArea").offsetTop,
    behavior: "smooth"
  });
}

function renderQuestions(questions) {
  const box = document.getElementById("quizQuestions");

  if (!questions.length) {
    box.innerHTML = `
      <div class="empty">
        No quiz questions were returned.
      </div>
    `;
    return;
  }

  box.innerHTML = questions.map((question, index) => `
    <div class="question">

      <div class="question-title">
        ${index + 1}. ${escapeHtml(question.question_text)}
      </div>

      ${["A","B","C","D"].map(letter => {
        const key = "option_" + letter.toLowerCase();
        const value =
          question[key] ??
          question["option" + letter] ??
          "";

        return `
          <label class="option">
            <input
              type="radio"
              name="question-${question.id}"
              value="${letter}"
            >
            ${letter}. ${escapeHtml(value)}
          </label>
        `;
      }).join("")}

    </div>
  `).join("");
}

function startCountdown(expiresAt) {
  clearInterval(quizTimer);

  function update() {
    const remaining =
      new Date(expiresAt).getTime() -
      Date.now();

    if (remaining <= 0) {
      document.getElementById("timer").textContent =
        "00:00";

      clearInterval(quizTimer);

      if (!quizSubmitting) {
        submitQuiz(true);
      }

      return;
    }

    const totalSeconds =
      Math.floor(remaining / 1000);

    const minutes =
      Math.floor(totalSeconds / 60);

    const seconds =
      totalSeconds % 60;

    document.getElementById("timer").textContent =
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");
  }

  update();
  quizTimer = setInterval(update, 1000);
}

async function submitQuiz(autoSubmit = false) {
  if (!activeQuizEntry || quizSubmitting) {
    return;
  }

  quizSubmitting = true;

  clearInterval(quizTimer);

  const answers = {};

  document.querySelectorAll(
    "#quizQuestions input[type=radio]:checked"
  ).forEach(input => {
    const questionId =
      input.name.replace("question-", "");

    answers[questionId] = input.value;
  });

  const { data, error } =
    await supabaseClient.rpc(
      "submit_competition_quiz",
      {
        p_entry_id: activeQuizEntry,
        p_answers: answers
      }
    );

  if (error) {
    quizSubmitting = false;
    showMessage(error.message, "error");
    return;
  }

  document.getElementById("quizArea").style.display =
    "none";

  activeQuizEntry = null;
  activeQuiz = null;
  quizSubmitting = false;

  if (autoSubmit) {
    showMessage(
      "Time expired. Your quiz was automatically submitted."
    );
  } else {
    showMessage(
      `Quiz submitted. Score: ${data?.score ?? 0}`
    );
  }

  await reload();
}

async function reload() {
  await loadCompetitions();
  await loadEntries();
  await loadWinners();
  await loadPrizes();

  renderNew();
  renderParticipated();
  renderWon();
}

async function init() {
  const allowed = await verifyUser();

  if (!allowed) {
    return;
  }

  try {
    await reload();
  } catch (error) {
    console.error(error);

    showMessage(
      error.message || "Unable to load competitions.",
      "error"
    );
  }
}

init();
</script>

</body>
</html>
