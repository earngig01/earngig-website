<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitions & Awards - EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d2d;
      color: #fff;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 20px 0 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #9b7cff;
    }

    .back {
      background: #171d4a;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 9px;
      border: 1px solid #363c6d;
    }

    .back:hover {
      background: #22285d;
    }

    .hero {
      background: linear-gradient(135deg, #171d4c, #21164d);
      border: 1px solid #343a70;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .muted {
      color: #979fc4;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 2px;
    }

    .tab {
      white-space: nowrap;
      background: #11173a;
      color: #b8bedf;
      border: 1px solid #30366a;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .tab:hover {
      background: #1b2150;
    }

    .tab.active {
      background: #7148df;
      color: #fff;
      border-color: #8d6af0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .competition {
      background: #10163b;
      border: 1px solid #292f62;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .competition:hover {
      border-color: #3c4380;
    }

    .competition h3 {
      margin: 0 0 7px;
      font-size: 19px;
    }

    .type {
      display: inline-block;
      background: #20275a;
      color: #c2b4ff;
      padding: 4px 8px;
      border-radius: 15px;
      font-size: 11px;
      margin-bottom: 9px;
      text-transform: capitalize;
    }

    .competition-description {
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .competition-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .meta {
      background: #151b44;
      border: 1px solid #2b3265;
      border-radius: 8px;
      padding: 7px 9px;
      color: #abb3d7;
      font-size: 12px;
    }

    .prizes {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prize {
      background: #151b44;
      border: 1px solid #2b3265;
      border-radius: 8px;
      padding: 9px 11px;
    }

    .prize-name {
      font-weight: 800;
      color: #fff;
    }

    .prize-amount {
      color: #bca6ff;
      font-weight: 800;
    }

    .prize-description {
      color: #949cbe;
      font-size: 12px;
      margin-top: 3px;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    .button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
    }

    .primary {
      background: #7448e8;
      color: white;
    }

    .primary:hover {
      background: #855cf0;
    }

    .email {
      background: #159a6d;
      color: white;
    }

    .email:hover {
      background: #18ad7b;
    }

    .winner {
      background: #10163b;
      border: 1px solid #343b71;
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .winner h3 {
      margin: 9px 0 6px;
      font-size: 19px;
    }

    .winner-amount {
      font-size: 22px;
      font-weight: 800;
      color: #bca6ff;
      margin: 8px 0;
    }

    .winner-position {
      color: #a8afd0;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      background: #183c31;
      color: #6feab8;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 700;
    }

    .school-note {
      background: #171e49;
      border: 1px solid #383f75;
      border-radius: 9px;
      padding: 10px;
      margin: 10px 0;
      color: #c8cdef;
      font-size: 13px;
      line-height: 1.5;
    }

    .participated-note {
      background: #141a42;
      border: 1px solid #2d3467;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 12px;
      color: #aab2d4;
      font-size: 13px;
    }

    .entry-status {
      display: inline-block;
      background: #252b56;
      color: #dce1ff;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .entry-result {
      margin-top: 10px;
      background: #151b44;
      border: 1px solid #2b3265;
      border-radius: 9px;
      padding: 10px;
      font-size: 13px;
      color: #b7bedc;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #8d95bb;
      background: #10163b;
      border: 1px solid #292f62;
      border-radius: 13px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9ba3c7;
    }

    .quiz-box {
      background: #0e1435;
      border: 1px solid #30366c;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .quiz-box h2 {
      margin-top: 0;
    }

    .timer {
      font-size: 27px;
      font-weight: 800;
      color: #ffdc72;
      margin-bottom: 15px;
      font-family: monospace;
      text-align: center;
      background: #171d45;
      border: 1px solid #383f73;
      border-radius: 10px;
      padding: 10px;
    }

    .question {
      background: #151b44;
      border: 1px solid #2c3265;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .question-title {
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    label.option {
      display: block;
      background: #10163a;
      border: 1px solid #30366b;
      border-radius: 8px;
      padding: 10px;
      margin-top: 7px;
      cursor: pointer;
    }

    label.option:hover {
      background: #1a2050;
    }

    label.option input {
      margin-right: 7px;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #451d2a;
      color: #ff9dad;
      border: 1px solid #7b3047;
    }

    .message.success {
      background: #103d2e;
      color: #72efbb;
      border: 1px solid #1a7356;
    }

    @media (max-width: 600px) {
      .container {
        width: 96%;
        padding-top: 12px;
      }

      .hero {
        padding: 16px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .logo {
        font-size: 21px;
      }

      .competition {
        padding: 14px;
      }

      .winner {
        padding: 14px;
      }

      .actions button,
      .actions .button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">EarnGig</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </header>

  <div id="message" class="message"></div>

  <section class="hero">
    <h1>🏆 Competitions & Awards</h1>
    <div class="muted">
      Enter competitions, complete challenges and see your awards.
    </div>
  </section>

  <div class="tabs">

    <button
      class="tab active"
      onclick="showTab('new', this)"
    >
      🆕 New Competitions
    </button>

    <button
      class="tab"
      onclick="showTab('participated', this)"
    >
      📋 Participated
    </button>

    <button
      class="tab"
      onclick="showTab('won', this)"
    >
      🏆 Won
    </button>

  </div>

  <section id="new" class="section active">
    <div id="newList">
      <div class="loading">Loading competitions...</div>
    </div>
  </section>

  <section id="participated" class="section">

    <div class="participated-note">
      📋 This section shows competitions you have already entered
      but have not won.
    </div>

    <div id="participatedList">
      <div class="loading">Loading participation history...</div>
    </div>

  </section>

  <section id="won" class="section">

    <div id="wonList">
      <div class="loading">Loading your awards...</div>
    </div>

  </section>

  <section id="quizArea" style="display:none;">

    <div class="quiz-box">

      <div id="quizTitle"></div>

      <div id="timer" class="timer">
        00:00
      </div>

      <div
        id="quizQuestions"
      ></div>

      <button
        id="submitQuizButton"
        class="primary"
        onclick="submitQuiz(false)"
      >
        Submit Quiz
      </button>

    </div>

  </section>

</div>

<script>
let currentUser = null;

let competitions = [];
let entries = [];
let winners = [];
let prizes = [];

let activeQuizEntry = null;
let activeQuiz = null;
let quizTimer = null;
let quizSubmitting = false;


/* =========================
   GENERAL HELPERS
========================= */

function showMessage(text, type = "success") {
  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message show " + type;

  setTimeout(() => {
    box.className = "message";
  }, 5000);
}


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatMoney(amount) {
  if (
    amount === null ||
    amount === undefined ||
    amount === ""
  ) {
    return "";
  }

  const number = Number(amount);

  if (!Number.isFinite(number)) {
    return "";
  }

  return "₦" + number.toLocaleString("en-NG");
}


function formatDate(value) {
  if (!value) {
    return "-";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "-";
  }

  return date.toLocaleDateString(
    "en-NG",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );
}


function formatDuration(seconds) {
  if (
    seconds === null ||
    seconds === undefined ||
    seconds === ""
  ) {
    return "-";
  }

  const value = Number(seconds);

  if (!Number.isFinite(value)) {
    return "-";
  }

  const minutes = Math.floor(value / 60);
  const secs = value % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


/* =========================
   TABS
========================= */

function showTab(tab, button) {
  document
    .querySelectorAll(".section")
    .forEach(section => {
      section.classList.remove("active");
    });

  document
    .querySelectorAll(".tab")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  const section = document.getElementById(tab);

  if (section) {
    section.classList.add("active");
  }

  if (button) {
    button.classList.add("active");
  }
}


/* =========================
   AUTH
========================= */

async function verifyUser() {
  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "index.html";
    return false;
  }

  currentUser = user;

  return true;
}


/* =========================
   LOAD DATA
========================= */

async function loadCompetitions() {
  const { data, error } = await supabaseClient
    .from("competitions")
    .select("*")
    .in("status", [
      "published",
      "closed",
      "winners_announced",
      "completed"
    ])
    .order("start_at", {
      ascending: true
    });

  if (error) {
    throw error;
  }

  competitions = data || [];
}


async function loadEntries() {
  /*
    IMPORTANT:

    This loads ALL competition entries belonging
    to the currently logged-in member.

    Participated is based on these entries,
    not merely on which competition cards are
    currently displayed as "new".
  */

  const { data, error } = await supabaseClient
    .from("competition_entries")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending: false
    });

  if (error) {
    throw error;
  }

  entries = data || [];
}


async function loadWinners() {
  /*
    Winners are loaded separately.

    This allows us to distinguish:

    entered + not winner
          ↓
      Participated

    entered + winner
          ↓
         Won
  */

  const { data, error } = await supabaseClient
    .from("competition_winners")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending: false
    });

  if (error) {
    throw error;
  }

  winners = data || [];
}


async function loadPrizes() {
  const competitionIds = competitions
    .map(c => c.id)
    .filter(Boolean);

  if (!competitionIds.length) {
    prizes = [];
    return;
  }

  const { data, error } = await supabaseClient
    .from("competition_prizes")
    .select("*")
    .in("competition_id", competitionIds)
    .order("prize_order", {
      ascending: true
    });

  if (error) {
    throw error;
  }

  prizes = data || [];
}


/* =========================
   LOOKUPS
========================= */

function getPrizes(competitionId) {
  return prizes.filter(
    prize =>
      prize.competition_id === competitionId
  );
}


function getEntry(competitionId) {
  return entries.find(
    entry =>
      entry.competition_id === competitionId
  );
}


function getWinner(competitionId) {
  return winners.find(
    winner =>
      winner.competition_id === competitionId
  );
}


/*
  Returns competitions the member has
  actually participated in.

  This is the key fix.

  We start from the user's competition_entries,
  then match those IDs against competitions.

  We do NOT use:
      competition.status === "published"

  to decide whether someone participated.

  A competition can be closed/completed and still
  remain in the member's Participated history.
*/
function getParticipatedCompetitions() {
  const participatedIds = new Set(
    entries
      .map(entry => entry.competition_id)
      .filter(Boolean)
  );

  return competitions.filter(
    competition =>
      participatedIds.has(competition.id)
  );
}


function getNewCompetitions() {
  return competitions.filter(
    competition =>
      !getEntry(competition.id)
  );
}


function getWonCompetitions() {
  const winnerIds = new Set(
    winners
      .map(winner => winner.competition_id)
      .filter(Boolean)
  );

  return competitions.filter(
    competition =>
      winnerIds.has(competition.id)
  );
}


function prizeText(prize) {
  if (!prize) {
    return "Prize";
  }

  let text =
    prize.prize_name ||
    prize.prize_type ||
    "Prize";

  if (
    prize.amount !== null &&
    prize.amount !== undefined
  ) {
    text +=
      " — " +
      formatMoney(prize.amount);
  }

  return text;
}


/* =========================
   PRIZE DISPLAY
========================= */

function renderPrizes(competitionId) {
  const list = getPrizes(competitionId);

  if (!list.length) {
    return `
      <div class="muted">
        Prize details will be announced.
      </div>
    `;
  }

  return `
    <div class="prizes">

      ${list.map((prize, index) => {

        let defaultName =
          `${index + 1}`;

        if (index === 0) {
          defaultName = "1st";
        } else if (index === 1) {
          defaultName = "2nd";
        } else if (index === 2) {
          defaultName = "3rd";
        } else {
          defaultName = `${index + 1}th`;
        }

        return `
          <div class="prize">

            <div class="prize-name">
              ${escapeHtml(
                prize.prize_name ||
                `${defaultName} Place`
              )}

              ${
                prize.amount !== null &&
                prize.amount !== undefined
                  ? `
                    —
                    <span class="prize-amount">
                      ${escapeHtml(
                        formatMoney(prize.amount)
                      )}
                    </span>
                  `
                  : ""
              }
            </div>

            ${
              prize.item_description
                ? `
                  <div class="prize-description">
                    ${escapeHtml(
                      prize.item_description
                    )}
                  </div>
                `
                : ""
            }

          </div>
        `;
      }).join("")}

    </div>
  `;
}


/* =========================
   COMPETITION CARD
========================= */

function renderCompetitionCard(competition) {
  const entry =
    getEntry(competition.id);

  const isQuiz =
    competition.competition_type === "quiz";

  const entryStatus =
    entry?.entry_status || null;

  let resultHtml = "";

  if (entry) {

    if (isQuiz) {

      const score =
        Number(entry.score ?? 0);

      const correct =
        Number(entry.correct_answers ?? 0);

      const total =
        Number(entry.total_questions ?? 0);

      resultHtml = `
        <div class="entry-result">

          <strong>Your result:</strong>

          ${score} point${score === 1 ? "" : "s"}

          ${
            total > 0
              ? ` · ${correct}/${total} correct`
              : ""
          }

          ${
            entry.time_taken_seconds !== null &&
            entry.time_taken_seconds !== undefined
              ? `
                · Time:
                ${formatDuration(
                  entry.time_taken_seconds
                )}
              `
              : ""
          }

        </div>
      `;
    }

  }

  return `
    <div class="competition">

      <span class="type">
        ${escapeHtml(
          competition.competition_type ||
          "competition"
        )}
      </span>

      <h3>
        ${escapeHtml(
          competition.title
        )}
      </h3>

      <div class="competition-description muted">
        ${escapeHtml(
          competition.description || ""
        )}
      </div>

      <div class="competition-meta">

        ${
          competition.start_at
            ? `
              <div class="meta">
                Starts:
                ${escapeHtml(
                  formatDate(
                    competition.start_at
                  )
                )}
              </div>
            `
            : ""
        }

        ${
          competition.end_at
            ? `
              <div class="meta">
                Ends:
                ${escapeHtml(
                  formatDate(
                    competition.end_at
                  )
                )}
              </div>
            `
            : ""
        }

        ${
          competition.max_participants
            ? `
              <div class="meta">
                Max participants:
                ${escapeHtml(
                  competition.max_participants
                )}
              </div>
            `
            : ""
        }

      </div>

      ${renderPrizes(competition.id)}

      ${
        isQuiz &&
        competition.quiz_time_limit_minutes
          ? `
            <div class="school-note">
              ⏱️ Timed Quiz:
              <strong>
                ${escapeHtml(
                  competition.quiz_time_limit_minutes
                )} minutes
              </strong>
            </div>
          `
          : ""
      }

      ${
        entry
          ? `
            <div class="actions">

              <span class="entry-status">
                ${escapeHtml(
                  String(
                    entryStatus ||
                    "Submitted"
                  ).replace(
                    /_/g,
                    " "
                  )
                )}
              </span>

            </div>

            ${resultHtml}
          `
          : `
            <div class="actions">

              <button
                class="primary"
                onclick="enterCompetition(
                  '${competition.id}'
                )"
              >
                ${
                  isQuiz
                    ? "▶️ Start Quiz"
                    : "Enter Competition"
                }
              </button>

            </div>
          `
      }

    </div>
  `;
}


/* =========================
   NEW COMPETITIONS
========================= */

function renderNew() {
  const box =
    document.getElementById(
      "newList"
    );

  const list =
    getNewCompetitions();

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        No new competitions available right now.
      </div>
    `;

    return;
  }

  box.innerHTML =
    list
      .map(
        competition =>
          renderCompetitionCard(
            competition
          )
      )
      .join("");
}


/* =========================
   PARTICIPATED
========================= */

function renderParticipated() {
  const box =
    document.getElementById(
      "participatedList"
    );

  /*
    IMPORTANT:

    This list is based on competition_entries.

    Therefore, if the member entered:

      "Back to School Quiz"

    and did not win it, that competition appears
    here even if the competition is already closed
    or completed.
  */

  const participated =
    getParticipatedCompetitions();

  /*
    Remove winners from this section.

    A winner belongs exclusively in Won.
  */
  const list =
    participated.filter(
      competition =>
        !getWinner(
          competition.id
        )
    );

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        You have not participated in any
        competition yet.
      </div>
    `;

    return;
  }

  box.innerHTML =
    list
      .map(
        competition =>
          renderCompetitionCard(
            competition
          )
      )
      .join("");
}


/* =========================
   WON
========================= */

function renderWon() {
  const box =
    document.getElementById(
      "wonList"
    );

  if (!winners.length) {
    box.innerHTML = `
      <div class="empty">
        You have not been selected as a
        winner yet.
      </div>
    `;

    return;
  }

  /*
    Use winner records directly.

    This is important because the competition
    may be closed or completed.
  */

  box.innerHTML =
    winners
      .map(winner => {

        const competition =
          competitions.find(
            competition =>
              competition.id ===
              winner.competition_id
          );

        const prize =
          prizes.find(
            prize =>
              prize.id ===
              winner.prize_id
          );

        /*
          If a competition is not currently
          visible to members, we still don't
          crash the Won section.
        */
        const competitionTitle =
          competition?.title ||
          "Competition Award";

        const isSchoolFees =
          prize?.prize_type ===
          "school_fees";

        const isCash =
          prize?.prize_type ===
          "cash";

        let actionHtml = "";

        if (isSchoolFees) {

          const subject =
            "EarnGig School Fees Award - " +
            competitionTitle;

          const body =
`Hello EarnGig,

I have been selected for a School Fees Award.

Competition: ${competitionTitle}
Award: ${
  prize?.amount
    ? formatMoney(prize.amount)
    : "School Fees Award"
}
Winner Position: ${
  winner.winner_position || ""
}

I would like to proceed with the school fees award.

Thank you.`;

          const mailto =
            "mailto:ahruhenterprises@gmail.com" +
            "?subject=" +
            encodeURIComponent(subject) +
            "&body=" +
            encodeURIComponent(body);

          actionHtml = `
            <div class="school-note">

              🏫 <strong>School Fees Award</strong>

              <br><br>

              This award is handled directly
              by EarnGig.

              <br>

              The award amount will
              <strong>
                NOT be added to your wallet.
              </strong>

            </div>

            <div class="actions">

              <a
                class="button email"
                href="${mailto}"
              >
                📧 Contact EarnGig for School Fees
              </a>

            </div>
          `;

        } else if (isCash) {

          if (
            winner.winner_status ===
            "fulfilled"
          ) {

            actionHtml = `
              <div class="school-note">

                💰 Your cash prize has been
                fulfilled and credited to your
                EarnGig wallet.

              </div>
            `;

          } else {

            actionHtml = `
              <div class="school-note">

                💰 Cash prize selected.

                <br>

                The prize will be credited to
                your EarnGig wallet after
                admin fulfilment.

              </div>
            `;
          }

        } else {

          if (
            winner.winner_status ===
            "fulfilled"
          ) {

            actionHtml = `
              <div class="school-note">

                🎁 Your award has been fulfilled.

              </div>
            `;

          } else {

            actionHtml = `
              <div class="school-note">

                🎁 This award is fulfilled
                manually by EarnGig.

              </div>
            `;
          }
        }

        return `
          <div class="winner">

            <span class="status">
              🏆 ${
                escapeHtml(
                  winner.winner_status ||
                  "Selected"
                )
              }
            </span>

            <h3>
              ${escapeHtml(
                competitionTitle
              )}
            </h3>

            <div class="winner-position">
              Winner Position:
              <strong>
                #${escapeHtml(
                  winner.winner_position
                )}
              </strong>
            </div>

            <div class="winner-amount">

              ${escapeHtml(
                prizeText(prize)
              )}

            </div>

            ${actionHtml}

          </div>
        `;
      })
      .join("");
}


/* =========================
   ENTER COMPETITION
========================= */

async function enterCompetition(
  competitionId
) {
  const competition =
    competitions.find(
      competition =>
        competition.id ===
        competitionId
    );

  if (!competition) {
    showMessage(
      "Competition could not be found.",
      "error"
    );

    return;
  }

  /*
    Quiz competitions use the secure
    server-side start function.
  */
  if (
    competition.competition_type ===
    "quiz"
  ) {
    await startQuiz(
      competitionId
    );

    return;
  }

  /*
    Prevent duplicate entries.
  */
  const existing =
    getEntry(competitionId);

  if (existing) {
    showMessage(
      "You have already entered this competition.",
      "error"
    );

    return;
  }

  /*
    Regular competition entry.
  */
  const { error } =
    await supabaseClient
      .from("competition_entries")
      .insert({
        competition_id:
          competitionId,

        user_id:
          currentUser.id,

        entry_status:
          "submitted",

        submitted_at:
          new Date().toISOString()
      });

  if (error) {
    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Your entry has been submitted."
  );

  await reloadData();

  /*
    Automatically show Participated after
    entering a normal competition.
  */
  const participatedTab =
    document.querySelector(
      ".tab:nth-child(2)"
    );

  showTab(
    "participated",
    participatedTab
  );
}


/* =========================
   START QUIZ
========================= */

async function startQuiz(
  competitionId
) {
  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "start_competition_quiz",
      {
        p_competition_id:
          competitionId
      }
    );

  if (error) {
    showMessage(
      error.message,
      "error"
    );

    return;
  }

  if (
    !data ||
    !data.entry_id
  ) {
    showMessage(
      data?.message ||
      "Unable to start quiz.",
      "error"
    );

    return;
  }

  activeQuizEntry =
    data.entry_id;

  activeQuiz =
    data;

  document.getElementById(
    "quizArea"
  ).style.display = "block";

  document.getElementById(
    "quizTitle"
  ).innerHTML = `
    <h2>
      ${escapeHtml(
        data.title ||
        "Quiz Competition"
      )}
    </h2>

    <div class="muted" style="margin-bottom:12px;">
      Answer the questions before the
      countdown reaches zero.
    </div>
  `;

  renderQuestions(
    data.questions || []
  );

  startCountdown(
    data.expires_at
  );

  window.scrollTo({
    top:
      document.getElementById(
        "quizArea"
      ).offsetTop,
    behavior: "smooth"
  });
}


/* =========================
   QUIZ QUESTIONS
========================= */

function renderQuestions(
  questions
) {
  const box =
    document.getElementById(
      "quizQuestions"
    );

  if (!questions.length) {
    box.innerHTML = `
      <div class="empty">
        No quiz questions were returned.
      </div>
    `;

    return;
  }

  box.innerHTML =
    questions
      .map(
        (question, index) => {

          const optionA =
            question.option_a ??
            question.optionA ??
            "";

          const optionB =
            question.option_b ??
            question.optionB ??
            "";

          const optionC =
            question.option_c ??
            question.optionC ??
            "";

          const optionD =
            question.option_d ??
            question.optionD ??
            "";

          return `
            <div class="question">

              <div class="question-title">
                ${index + 1}.
                ${escapeHtml(
                  question.question_text
                )}
              </div>

              <label class="option">

                <input
                  type="radio"
                  name="question-${question.id}"
                  value="A"
                >

                A.
                ${escapeHtml(
                  optionA
                )}

              </label>

              <label class="option">

                <input
                  type="radio"
                  name="question-${question.id}"
                  value="B"
                >

                B.
                ${escapeHtml(
                  optionB
                )}

              </label>

              <label class="option">

                <input
                  type="radio"
                  name="question-${question.id}"
                  value="C"
                >

                C.
                ${escapeHtml(
                  optionC
                )}

              </label>

              <label class="option">

                <input
                  type="radio"
                  name="question-${question.id}"
                  value="D"
                >

                D.
                ${escapeHtml(
                  optionD
                )}

              </label>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================
   QUIZ TIMER
========================= */

function startCountdown(
  expiresAt
) {
  clearInterval(
    quizTimer
  );

  function updateTimer() {

    const remaining =
      new Date(
        expiresAt
      ).getTime() -
      Date.now();

    if (
      remaining <= 0
    ) {

      document.getElementById(
        "timer"
      ).textContent = "00:00";

      clearInterval(
        quizTimer
      );

      if (
        !quizSubmitting
      ) {
        submitQuiz(true);
      }

      return;
    }

    const totalSeconds =
      Math.floor(
        remaining / 1000
      );

    const minutes =
      Math.floor(
        totalSeconds / 60
      );

    const seconds =
      totalSeconds % 60;

    document.getElementById(
      "timer"
    ).textContent =
      String(
        minutes
      ).padStart(2, "0") +
      ":" +
      String(
        seconds
      ).padStart(2, "0");
  }

  updateTimer();

  quizTimer =
    setInterval(
      updateTimer,
      1000
    );
}


/* =========================
   SUBMIT QUIZ
========================= */

async function submitQuiz(
  autoSubmit = false
) {
  if (
    !activeQuizEntry ||
    quizSubmitting
  ) {
    return;
  }

  quizSubmitting = true;

  clearInterval(
    quizTimer
  );

  const answers = {};

  document
    .querySelectorAll(
      "#quizQuestions input[type=radio]:checked"
    )
    .forEach(input => {

      const questionId =
        input.name.replace(
          "question-",
          ""
        );

      answers[
        questionId
      ] = input.value;

    });

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "submit_competition_quiz",
      {
        p_entry_id:
          activeQuizEntry,

        p_answers:
          answers
      }
    );

  if (error) {

    /*
      If the server rejects the submission because
      the deadline has already passed, refresh the
      member's participation data.
    */
    quizSubmitting = false;

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  document.getElementById(
    "quizArea"
  ).style.display = "none";

  activeQuizEntry = null;
  activeQuiz = null;
  quizSubmitting = false;

  if (autoSubmit) {

    showMessage(
      "Time expired. Your quiz was automatically submitted."
    );

  } else {

    const score =
      data?.score ?? 0;

    const correct =
      data?.correct_answers;

    let resultText =
      `Quiz submitted. Score: ${score}`;

    if (
      correct !== undefined &&
      correct !== null
    ) {
      resultText +=
        ` · ${correct} correct`;
    }

    showMessage(
      resultText
    );
  }

  await reloadData();

  /*
    After submitting a quiz, show Participated.
  */
  const participatedTab =
    document.querySelector(
      ".tab:nth-child(2)"
    );

  showTab(
    "participated",
    participatedTab
  );
}


/* =========================
   RELOAD EVERYTHING
========================= */

async function reloadData() {
  await loadCompetitions();

  /*
    Entries are loaded independently of competition
    cards, so participation history is always based
    on the member's actual entries.
  */
  await loadEntries();

  /*
    Winners are loaded separately so that a winning
    competition can be moved from Participated to Won.
  */
  await loadWinners();

  await loadPrizes();

  renderNew();
  renderParticipated();
  renderWon();
}


/* =========================
   INITIALIZE
========================= */

async function init() {

  const allowed =
    await verifyUser();

  if (!allowed) {
    return;
  }

  try {

    await reloadData();

  } catch (error) {

    console.error(
      "Competitions loading error:",
      error
    );

    showMessage(
      error.message ||
      "Unable to load competitions.",
      "error"
    );
  }
}

init();
</script>
