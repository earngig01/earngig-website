<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Verification - EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #24134d 0%, #0b0920 45%, #060713 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(20, 17, 45, 0.96);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #b9b4d0;
      line-height: 1.6;
      font-size: 14px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 26px auto 18px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-icon,
    .error-icon {
      width: 58px;
      height: 58px;
      margin: 8px auto 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .success-icon {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .error-icon {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    .button {
      display: none;
      margin-top: 24px;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .reference {
      margin-top: 18px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      color: #d8d2ea;
      font-size: 12px;
      word-break: break-all;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">E</div>

    <div id="loadingIcon" class="spinner"></div>

    <div id="successIcon" class="success-icon">✓</div>

    <div id="errorIcon" class="error-icon">!</div>

    <h1 id="title">Verifying Payment</h1>

    <p id="message">
      Please wait while we securely verify your Flutterwave payment.
    </p>

    <div id="reference" class="reference"></div>

    <a
      id="dashboardButton"
      class="button"
      href="dashboard.html"
    >
      Continue to EarnGig
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ytvtdelwefykeqwztcyo.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CLTeqgEB6JSQ7Kqq6rQARw_RV31Ccg3";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const FLUTTERWAVE_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/flutterwave-payment`;

    const loadingIcon =
      document.getElementById("loadingIcon");

    const successIcon =
      document.getElementById("successIcon");

    const errorIcon =
      document.getElementById("errorIcon");

    const title =
      document.getElementById("title");

    const message =
      document.getElementById("message");

    const reference =
      document.getElementById("reference");

    const dashboardButton =
      document.getElementById("dashboardButton");


    function showSuccess(paymentReference) {

      loadingIcon.style.display = "none";
      errorIcon.style.display = "none";

      successIcon.style.display = "flex";

      title.textContent =
        "Payment Successful";

      message.textContent =
        "Your EarnGig membership payment has been verified successfully.";

      if (paymentReference) {
        reference.textContent =
          "Payment reference: " + paymentReference;

        reference.style.display = "block";
      }

      dashboardButton.style.display =
        "block";
    }


    function showError(errorMessage) {

      loadingIcon.style.display = "none";
      successIcon.style.display = "none";

      errorIcon.style.display = "flex";

      title.textContent =
        "Payment Verification Failed";

      message.textContent =
        errorMessage ||
        "We could not verify this payment. Please try again or contact EarnGig support.";

      dashboardButton.textContent =
        "Return to EarnGig";

      dashboardButton.style.display =
        "block";
    }


    async function verifyPayment() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const status =
          params.get("status");

        const txRef =
          params.get("tx_ref");

        const transactionId =
          params.get("transaction_id");


        /*
         * No successful transaction information
         * was returned by Flutterwave.
         */
        if (!txRef || !transactionId) {

          if (status === "cancelled") {
            showError(
              "The payment was cancelled."
            );
          } else {
            showError(
              "No valid Flutterwave transaction was returned."
            );
          }

          return;
        }


        /*
         * Get the currently signed-in
         * EarnGig user.
         */
        const {
          data: {
            session
          },
          error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {
          throw new Error(
            "Unable to check your EarnGig session."
          );
        }


        if (!session) {

          showError(
            "Your EarnGig session has expired. Please sign in again before verifying this payment."
          );

          return;
        }


        /*
         * Ask our secure Edge Function
         * to verify the transaction.
         */
        const response =
          await fetch(
            FLUTTERWAVE_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  `Bearer ${session.access_token}`
              },

              body: JSON.stringify({
                action: "verify",

                tx_ref: txRef,

                transaction_id:
                  transactionId
              })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result?.error ||
            "Payment verification failed."
          );
        }


        if (!result?.success) {

          if (
            result?.status === "cancelled"
          ) {

            showError(
              "The payment was cancelled."
            );

            return;
          }

          if (
            result?.status === "failed"
          ) {

            showError(
              "Flutterwave reported that this payment was not successful."
            );

            return;
          }

          throw new Error(
            result?.error ||
            "Payment could not be verified."
          );
        }


        showSuccess(
          result.payment_reference ||
          txRef
        );

      } catch (error) {

        console.error(
          "Flutterwave callback error:",
          error
        );

        showError(
          error?.message ||
          "Something went wrong while verifying your payment."
        );
      }
    }


    verifyPayment();
  </script>

</body>
</html>
