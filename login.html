<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | EarnGig</title>

  <link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

  <div class="container nav">

    <a class="logo" href="index.html">

      <span class="logo-mark">E</span>

      Earn<span>Gig</span>

    </a>


    <a
      class="btn outline"
      href="index.html"
    >
      Back to Home
    </a>

  </div>

</header>



<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">

      <span class="logo-mark">
        E
      </span>

    </div>


    <span class="eyebrow">
      WELCOME BACK
    </span>


    <h1>
      Login to EarnGig
    </h1>


    <p class="auth-subtitle">
      Access your account, activities and earnings.
    </p>



    <form id="login-form">


      <label for="email">
        Email Address
      </label>


      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >



      <label for="password">
        Password
      </label>


      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      >



      <div class="login-options">


        <label class="remember">

          <input type="checkbox">

          Remember me

        </label>


        <a href="#">
          Forgot password?
        </a>


      </div>



      <button
        type="submit"
        id="login-button"
        class="btn primary auth-button"
      >
        Login
      </button>


    </form>



    <div class="auth-divider">

      <span>
        OR
      </span>

    </div>



    <p class="signup-text">

      Don't have an EarnGig account?

      <a href="register.html">
        Create an account
      </a>

    </p>


  </div>

</main>



<footer>

  <div class="container copy">

    © 2026 EarnGig.
    All rights reserved.

  </div>

</footer>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


const loginForm =
  document.getElementById(
    "login-form"
  );


const loginButton =
  document.getElementById(
    "login-button"
  );


let loggedInUser = null;



/*
 * ==================================================
 * OPEN FLUTTERWAVE MEMBERSHIP PAYMENT
 * ==================================================
 */

async function openMembershipPayment() {


  if (!loggedInUser) {

    alert(
      "Please log in first."
    );

    return;

  }


  loginButton.disabled =
    true;


  loginButton.type =
    "button";


  loginButton.textContent =
    "Opening Flutterwave...";


  try {


    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          "flutterwave-payment",
          {
            body: {
              action:
                "initialize",

              payment_type:
                "membership",

              membership_stage:
                "initial"
            }
          }
        );


    console.log(
      "Flutterwave initialization:",
      data,
      error
    );


    if (error) {

      console.error(
        "Flutterwave initialization error:",
        error
      );


      throw new Error(
        error.message ||
        "Unable to start Flutterwave payment."
      );

    }


    if (
      !data ||
      !data.success ||
      !data.payment_url
    ) {

      console.error(
        "Invalid Flutterwave response:",
        data
      );


      throw new Error(
        data?.error ||
        "Flutterwave payment link was not returned."
      );

    }


    window.location.href =
      data.payment_url;


  } catch (error) {


    console.error(
      "Flutterwave payment error:",
      error
    );


    alert(
      error?.message ||
      "Unable to open Flutterwave payment. Please try again."
    );


    loginButton.disabled =
      false;


    loginButton.type =
      "button";


    loginButton.textContent =
      "Pay ₦9,000 to Continue";


    loginButton.onclick =
      openMembershipPayment;

  }

}



/*
 * ==================================================
 * CLAIM DAILY LOGIN REWARD
 * ==================================================
 *
 * The database function controls the reward.
 *
 * One reward per Nigeria calendar day.
 *
 * Reward:
 * ₦50
 *
 * The function also updates:
 *
 * wallets.balance
 * wallets.total_earned
 * transactions
 *
 * The client cannot choose the amount.
 * ==================================================
 */

async function claimDailyLoginReward() {


  try {


    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "claim_daily_login_reward"
        );


    console.log(
      "Daily login reward:",
      data,
      error
    );


    if (error) {

      console.error(
        "Daily login reward error:",
        error
      );


      return;

    }


    if (
      !data
    ) {

      return;

    }


    if (
      data.already_claimed
    ) {

      return;

    }


    if (
      data.success &&
      Number(data.amount || 0) > 0
    ) {


      alert(
        "🎉 Daily Login Reward!\n\n" +
        "₦" +
        Number(
          data.amount
        ).toLocaleString(
          "en-NG"
        ) +
        " has been credited to your wallet."
      );


    }


  } catch (error) {


    /*
     * A daily reward failure must not prevent
     * a member from logging into EarnGig.
     */

    console.error(
      "Daily login reward exception:",
      error
    );

  }

}



/*
 * ==================================================
 * LOGIN
 * ==================================================
 */

loginForm.addEventListener(
  "submit",
  async function(event) {


    event.preventDefault();


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "password"
        )
        .value;


    if (
      !email ||
      !password
    ) {

      alert(
        "Please enter your email and password."
      );

      return;

    }


    loginButton.disabled =
      true;


    loginButton.type =
      "submit";


    loginButton.textContent =
      "Checking...";



    /*
     * --------------------------------------------------
     * SIGN IN
     * --------------------------------------------------
     */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {


      console.error(
        "Login error:",
        error
      );


      alert(
        error.message
      );


      loginButton.disabled =
        false;


      loginButton.type =
        "submit";


      loginButton.textContent =
        "Login";


      return;

    }


    loggedInUser =
      data?.user;


    if (!loggedInUser) {


      alert(
        "Unable to verify your account."
      );


      loginButton.disabled =
        false;


      loginButton.type =
        "submit";


      loginButton.textContent =
        "Login";


      return;

    }



    /*
     * --------------------------------------------------
     * CHECK MEMBERSHIP
     * --------------------------------------------------
     */

    loginButton.textContent =
      "Checking membership...";


    const {
      data: membership,
      error: membershipError
    } =
      await supabaseClient
        .from("memberships")
        .select(`
          status,
          current_period_start,
          current_period_end,
          next_payment_at
        `)
        .eq(
          "user_id",
          loggedInUser.id
        )
        .maybeSingle();


    if (membershipError) {


      console.error(
        "Membership check error:",
        membershipError
      );


      alert(
        "Unable to verify your membership. Please try again."
      );


      loginButton.disabled =
        false;


      loginButton.type =
        "submit";


      loginButton.textContent =
        "Login";


      return;

    }



    /*
     * --------------------------------------------------
     * NO MEMBERSHIP
     *
     * First-time membership payment = ₦9,000
     *
     * No daily reward is given here.
     * --------------------------------------------------
     */

    if (!membership) {


      loginButton.disabled =
        false;


      loginButton.type =
        "button";


      loginButton.textContent =
        "Pay ₦9,000 to Continue";


      loginButton.onclick =
        openMembershipPayment;


      return;

    }



    /*
     * --------------------------------------------------
     * CHECK CURRENT MEMBERSHIP PERIOD
     * --------------------------------------------------
     */

    const periodEnd =
      membership.current_period_end
        ? new Date(
            membership.current_period_end
          )
        : null;


    const membershipIsActive =
      membership.status === "active" &&
      periodEnd &&
      periodEnd.getTime() >
        Date.now();



    /*
     * --------------------------------------------------
     * ACTIVE MEMBERSHIP
     * --------------------------------------------------
     */

    if (membershipIsActive) {


      /*
       * Claim today's ₦50 reward.
       *
       * This happens before entering the dashboard.
       *
       * If the reward was already claimed today,
       * the function simply returns without paying again.
       */

      loginButton.textContent =
        "Claiming daily reward...";


      await claimDailyLoginReward();


      /*
       * Go to dashboard.
       */

      window.location.href =
        "dashboard.html";


      return;

    }



    /*
     * --------------------------------------------------
     * EXPIRED / INACTIVE MEMBERSHIP
     *
     * Renewal amount = ₦5,000
     *
     * No daily reward is given while membership
     * is inactive.
     * --------------------------------------------------
     */

    loginButton.disabled =
      false;


    loginButton.type =
      "button";


    loginButton.textContent =
      "Renew for ₦5,000";


    loginButton.onclick =
      function() {

        window.location.href =
          "membership.html";

      };


  }
);


</script>


</body>

</html>
