<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | EarnGig</title>

  <link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

  <div class="container nav">

    <a class="logo" href="index.html">

      <span class="logo-mark">E</span>

      Earn<span>Gig</span>

    </a>


    <a
      class="btn outline"
      href="index.html"
    >
      Back to Home
    </a>

  </div>

</header>



<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">

      <span class="logo-mark">
        E
      </span>

    </div>


    <span class="eyebrow">
      WELCOME BACK
    </span>


    <h1>
      Login to EarnGig
    </h1>


    <p class="auth-subtitle">
      Access your account, activities and earnings.
    </p>



    <form id="login-form">


      <label for="email">
        Email Address
      </label>


      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >



      <label for="password">
        Password
      </label>


      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >



      <div class="login-options">

        <label class="remember">

          <input
            type="checkbox"
            id="remember-me"
          >

          Remember me

        </label>


        <a href="#">
          Forgot password?
        </a>

      </div>



      <button
        type="submit"
        id="login-button"
        class="btn primary auth-button"
      >
        Login
      </button>


    </form>



    <div class="auth-divider">

      <span>
        OR
      </span>

    </div>



    <p class="signup-text">

      Don't have an EarnGig account?

      <a href="register.html">
        Create an account
      </a>

    </p>


  </div>

</main>



<footer>

  <div class="container copy">

    © 2026 EarnGig.
    All rights reserved.

  </div>

</footer>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>

/*
 * =====================================================
 * ELEMENTS
 * =====================================================
 */

const loginForm =
  document.getElementById(
    "login-form"
  );


const loginButton =
  document.getElementById(
    "login-button"
  );



/*
 * =====================================================
 * CHECK EXISTING SESSION
 * =====================================================
 *
 * If the user is already logged in and opens
 * login.html, send them to the correct page.
 * =====================================================
 */

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (error) {

      console.error(
        "Session check error:",
        error
      );

      return;

    }


    const user =
      data?.session?.user;


    if (!user) {

      return;

    }


    await routeAuthenticatedUser(
      user
    );

  } catch (error) {

    console.error(
      "Existing session error:",
      error
    );

  }

}



/*
 * =====================================================
 * ROUTE AUTHENTICATED USER
 * =====================================================
 */

async function routeAuthenticatedUser(
  user
) {

  /*
   * ---------------------------------------------------
   * LOAD MEMBERSHIP
   * ---------------------------------------------------
   */

  const {
    data: membership,
    error: membershipError
  } =
    await supabaseClient
      .from("memberships")
      .select(`
        status,
        plan_code,
        current_period_start,
        current_period_end,
        next_payment_at,
        payment_count
      `)
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (membershipError) {

    console.error(
      "Membership check error:",
      membershipError
    );


    alert(
      "Unable to verify your membership. Please try again."
    );


    loginButton.disabled =
      false;


    loginButton.textContent =
      "Login";


    return;

  }



  /*
   * ---------------------------------------------------
   * NO MEMBERSHIP
   * ---------------------------------------------------
   *
   * Send the user to membership selection.
   */

  if (!membership) {

    window.location.href =
      "membership.html";

    return;

  }



  /*
   * ---------------------------------------------------
   * CHECK CURRENT MEMBERSHIP PERIOD
   * ---------------------------------------------------
   */

  const periodEnd =
    membership.current_period_end
      ? new Date(
          membership.current_period_end
        )
      : null;


  const membershipIsActive =
    membership.status === "active" &&
    periodEnd &&
    periodEnd.getTime() > Date.now();



  /*
   * ---------------------------------------------------
   * ACTIVE MEMBERSHIP
   * ---------------------------------------------------
   *
   * No daily login reward.
   *
   * Simply enter the dashboard.
   */

  if (membershipIsActive) {

    window.location.href =
      "dashboard.html";

    return;

  }



  /*
   * ---------------------------------------------------
   * EXPIRED / INACTIVE MEMBERSHIP
   * ---------------------------------------------------
   *
   * Membership page controls:
   *
   * - Renewal
   * - Upgrade
   * - Plan selection
   * - Flutterwave payment
   */

  window.location.href =
    "membership.html";

}



/*
 * =====================================================
 * LOGIN
 * =====================================================
 */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "password"
        )
        .value;


    if (
      !email ||
      !password
    ) {

      alert(
        "Please enter your email and password."
      );

      return;

    }


    loginButton.disabled =
      true;


    loginButton.textContent =
      "Checking...";


    /*
     * ---------------------------------------------------
     * SIGN IN
     * ---------------------------------------------------
     */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      console.error(
        "Login error:",
        error
      );


      alert(
        error.message ||
        "Unable to log in. Please check your details and try again."
      );


      loginButton.disabled =
        false;


      loginButton.textContent =
        "Login";


      return;

    }


    const user =
      data?.user;


    if (!user) {

      alert(
        "Unable to verify your account."
      );


      loginButton.disabled =
        false;


      loginButton.textContent =
        "Login";


      return;

    }


    /*
     * ---------------------------------------------------
     * CHECK MEMBERSHIP
     * ---------------------------------------------------
     */

    loginButton.textContent =
      "Checking membership...";


    await routeAuthenticatedUser(
      user
    );

  }
);



/*
 * =====================================================
 * START
 * =====================================================
 */

checkExistingSession();

</script>


</body>

</html>
