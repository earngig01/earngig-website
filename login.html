<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <a class="btn outline" href="index.html">
      Back to Home
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">E</span>
    </div>

    <span class="eyebrow">WELCOME BACK</span>

    <h1>Login to EarnGig</h1>

    <p class="auth-subtitle">
      Access your account, activities and earnings.
    </p>


    <form id="login-form">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      >


      <div class="login-options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        id="login-button"
        class="btn primary auth-button"
      >
        Login
      </button>

    </form>


    <div class="auth-divider">
      <span>OR</span>
    </div>


    <p class="signup-text">
      Don't have an EarnGig account?
      <a href="register.html">Create an account</a>
    </p>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig. All rights reserved.
  </div>

</footer>
