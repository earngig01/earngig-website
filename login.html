<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <a class="btn outline" href="index.html">
      Back to Home
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">E</span>
    </div>

    <span class="eyebrow">WELCOME BACK</span>

    <h1>Login to EarnGig</h1>

    <p class="auth-subtitle">
      Access your account, activities and earnings.
    </p>


    <form id="login-form">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      >


      <div class="login-options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        id="login-button"
        class="btn primary auth-button"
      >
        Login
      </button>

    </form>


    <div class="auth-divider">
      <span>OR</span>
    </div>


    <p class="signup-text">
      Don't have an EarnGig account?
      <a href="register.html">Create an account</a>
    </p>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig. All rights reserved.
  </div>

</footer>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const loginForm =
  document.getElementById("login-form");

const loginButton =
  document.getElementById("login-button");

let loggedInUser = null;


/*
 * Open the ₦9,000 Paystack checkout.
 *
 * This runs directly from the user's button click,
 * which is important for mobile browsers.
 */
function openMembershipPayment() {

  if (!loggedInUser) {

    alert(
      "Please log in first."
    );

    return;
  }


  if (
    typeof PaystackPop ===
    "undefined"
  ) {

    alert(
      "Paystack could not load. Please refresh the page and try again."
    );

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Opening Payment...";


  try {

  const handler =
    PaystackPop.setup({

      key:
        "pk_test_aca5cbbbfb6574c4712453be151178c139c74512",

      email:
        loggedInUser.email,

      amount:
        900000,

      currency:
        "NGN",

      ref:
        "EG-MEMBER-" +
        loggedInUser.id.substring(0, 8) +
        "-" +
        Date.now(),

      callback:
        async function(response) {

          loginButton.textContent =
            "Verifying payment...";

          const {
            data: verification,
            error: verificationError
          } =
            await supabaseClient.functions.invoke(
              "paystack-payment",
              {
                body: {
                  reference:
                    response.reference,

                  user_id:
                    loggedInUser.id
                }
              }
            );

          if (
            verificationError ||
            !verification?.success
          ) {

            console.error(
              "Payment verification error:",
              verificationError,
              verification
            );

            alert(
              "Payment could not be verified. Your dashboard remains locked."
            );

            loginButton.disabled = false;

            loginButton.textContent =
              "Pay ₦9,000 to Continue";

            return;
          }

          alert(
            "Payment successful! Your EarnGig membership is now active."
          );

          window.location.href =
            "dashboard.html";
        },

      onClose:
        function() {

          loginButton.disabled = false;

          loginButton.textContent =
            "Pay ₦9,000 to Continue";
        }

    });

  console.log(
    "Paystack handler created:",
    handler
  );

  handler.openIframe();

} catch (error) {

  console.error(
    "Paystack failed to open:",
    error
  );

  alert(
  "Paystack error: " +
  (error?.message || error)
);

  loginButton.disabled = false;

  loginButton.textContent =
    "Pay ₦9,000 to Continue";
  }

}


/*
 * LOGIN
 */
loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      alert(
        "Please enter your email and password."
      );

      return;
    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Checking...";


    /*
     * Sign in with Supabase.
     */
    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      console.error(
        "Login error:",
        error
      );

      alert(
        error.message
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

      return;
    }


    loggedInUser =
      data?.user;


    if (!loggedInUser) {

      alert(
        "Unable to verify your account."
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

      return;
    }


    /*
     * Check whether the initial ₦9,000
     * membership payment has already
     * been confirmed.
     */
    const {
      data: payment,
      error: paymentError
    } =
      await supabaseClient
        .from("membership_payments")
        .select("id")
        .eq(
          "user_id",
          loggedInUser.id
        )
        .eq(
          "payment_type",
          "first_payment"
        )
        .eq(
          "status",
          "confirmed"
        )
        .eq(
          "amount",
          9000
        )
        .limit(1)
        .maybeSingle();


    if (paymentError) {

      console.error(
        "Membership check error:",
        paymentError
      );

      alert(
        "Unable to verify your membership. Please try again."
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

      return;
    }


    /*
     * ALREADY PAID
     *
     * Go directly to dashboard.
     */
    if (payment) {

      window.location.href =
        "dashboard.html";

      return;
    }


    /*
     * NOT PAID
     *
     * Do NOT open Paystack here.
     *
     * Instead, give the user a fresh
     * button click that will open it.
     */
    loginButton.disabled =
      false;

    loginButton.textContent =
      "Pay ₦9,000 to Continue";

    loginButton.type =
      "button";

    loginButton.onclick =
      openMembershipPayment;

  }
);

</script>
                    

</body>

</html>
