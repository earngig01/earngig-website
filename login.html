<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <a class="btn outline" href="index.html">
      Back to Home
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">E</span>
    </div>

    <span class="eyebrow">WELCOME BACK</span>

    <h1>Login to EarnGig</h1>

    <p class="auth-subtitle">
      Access your account, activities and earnings.
    </p>


    <form id="login-form">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      >


      <div class="login-options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        id="login-button"
        class="btn primary auth-button"
      >
        Login
      </button>

    </form>


    <div class="auth-divider">
      <span>OR</span>
    </div>


    <p class="signup-text">
      Don't have an EarnGig account?
      <a href="register.html">Create an account</a>
    </p>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig. All rights reserved.
  </div>

</footer>


<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

const loginForm =
  document.getElementById("login-form");

const loginButton =
  document.getElementById("login-button");

let loggedInUser = null;


/*
 * --------------------------------------------------
 * VERIFY A PAYSTACK PAYMENT
 * --------------------------------------------------
 */

async function verifyMembershipPayment(reference) {

  loginButton.disabled = true;

  loginButton.textContent =
    "Verifying payment...";


  const {
    data: verification,
    error: verificationError
  } =
    await supabaseClient.functions.invoke(
      "paystack-payment",
      {
        body: {
          reference: reference,
          user_id: loggedInUser.id
        }
      }
    );


  if (
    verificationError ||
    !verification?.success
  ) {

    console.error(
      "Payment verification error:",
      verificationError,
      verification
    );

    alert(
      "Payment could not be verified. Your dashboard remains locked."
    );

    loginButton.disabled = false;

    loginButton.type = "button";

    loginButton.textContent =
      "Pay ₦9,000 to Continue";

    loginButton.onclick =
      openMembershipPayment;

    return;
  }


  alert(
    "Payment successful! Your EarnGig membership is now active."
  );


  window.location.href =
    "dashboard.html";
}


/*
 * --------------------------------------------------
 * OPEN ₦9,000 FIRST PAYMENT
 * --------------------------------------------------
 */

function openMembershipPayment() {

  if (!loggedInUser) {

    alert(
      "Please log in first."
    );

    return;
  }


  if (
    typeof PaystackPop ===
    "undefined"
  ) {

    alert(
      "Paystack could not load. Please refresh the page and try again."
    );

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Opening Payment...";


  try {

    const handler =
      PaystackPop.setup({

        key:
          "pk_test_aca5cbbbfb6574c4712453be151178c139c74512",

        email:
          loggedInUser.email,

        amount:
          900000,

        currency:
          "NGN",

        ref:
          "EG-MEMBER-" +
          loggedInUser.id.substring(0, 8) +
          "-" +
          Date.now(),


        callback:
          function(response) {

            verifyMembershipPayment(
              response.reference
            );

          },


        onClose:
          function() {

            loginButton.disabled =
              false;

            loginButton.type =
              "button";

            loginButton.textContent =
              "Pay ₦9,000 to Continue";

            loginButton.onclick =
              openMembershipPayment;

          }

      });


    handler.openIframe();


  } catch (error) {

    console.error(
      "Paystack failed to open:",
      error
    );

    alert(
      "Paystack error: " +
      (error?.message || error)
    );

    loginButton.disabled = false;

    loginButton.type = "button";

    loginButton.textContent =
      "Pay ₦9,000 to Continue";

    loginButton.onclick =
      openMembershipPayment;
  }

}


/*
 * --------------------------------------------------
 * LOGIN
 * --------------------------------------------------
 */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      alert(
        "Please enter your email and password."
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.type = "submit";

    loginButton.textContent =
      "Checking...";


    /*
     * SIGN IN
     */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      console.error(
        "Login error:",
        error
      );

      alert(
        error.message
      );

      loginButton.disabled =
        false;

      loginButton.type =
        "submit";

      loginButton.textContent =
        "Login";

      return;
    }


    loggedInUser =
      data?.user;


    if (!loggedInUser) {

      alert(
        "Unable to verify your account."
      );

      loginButton.disabled =
        false;

      loginButton.type =
        "submit";

      loginButton.textContent =
        "Login";

      return;
    }


    /*
     * --------------------------------------------------
     * CHECK MEMBERSHIP
     *
     * IMPORTANT:
     * We now check the membership PERIOD,
     * NOT the old ₦9,000 payment record.
     * --------------------------------------------------
     */

    loginButton.textContent =
      "Checking membership...";


    const {
      data: membership,
      error: membershipError
    } =
      await supabaseClient
        .from("memberships")
        .select(`
          status,
          current_period_start,
          current_period_end,
          next_payment_at
        `)
        .eq(
          "user_id",
          loggedInUser.id
        )
        .maybeSingle();


    if (membershipError) {

      console.error(
        "Membership check error:",
        membershipError
      );

      alert(
        "Unable to verify your membership. Please try again."
      );

      loginButton.disabled =
        false;

      loginButton.type =
        "submit";

      loginButton.textContent =
        "Login";

      return;
    }


    /*
     * --------------------------------------------------
     * NO MEMBERSHIP
     *
     * User has never completed the ₦9,000
     * initial membership payment.
     * --------------------------------------------------
     */

    if (!membership) {

      loginButton.disabled =
        false;

      loginButton.type =
        "button";

      loginButton.textContent =
        "Pay ₦9,000 to Continue";

      loginButton.onclick =
        openMembershipPayment;

      return;
    }


    /*
     * --------------------------------------------------
     * CHECK CURRENT MEMBERSHIP PERIOD
     * --------------------------------------------------
     */

    const periodEnd =
      membership.current_period_end
        ? new Date(
            membership.current_period_end
          )
        : null;


    const membershipIsActive =
      membership.status === "active" &&
      periodEnd &&
      periodEnd.getTime() > Date.now();


    /*
     * --------------------------------------------------
     * ACTIVE MEMBERSHIP
     *
     * DO NOT ASK FOR ₦9,000 AGAIN.
     *
     * Send user directly to dashboard.
     * --------------------------------------------------
     */

    if (membershipIsActive) {

      window.location.href =
        "dashboard.html";

      return;
    }


    /*
     * --------------------------------------------------
     * MEMBERSHIP EXPIRED
     *
     * The first ₦9,000 payment is NOT requested again.
     *
     * The user needs the ₦5,000 monthly renewal.
     * --------------------------------------------------
     */

    loginButton.disabled =
      false;

    loginButton.type =
      "button";

    loginButton.textContent =
      "Renew for ₦5,000";

    loginButton.onclick =
      function() {

        window.location.href =
          "membership.html";

      };

  }
);

</script>

</body>

</html>
