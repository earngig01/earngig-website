<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Marketplace | EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d1f;
      color: #ffffff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }

    /* HEADER */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .brand span {
      color: #8b5cf6;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-btn,
    .sell-btn {
      border: 0;
      color: #fff;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .cart-btn {
      position: relative;
      background: #171e35;
      border: 1px solid #30395c;
      padding: 10px 13px;
      min-width: 52px;
    }

    .cart-btn:hover {
      background: #222b47;
      border-color: #6543c5;
    }

    .cart-icon {
      font-size: 18px;
      vertical-align: middle;
    }

    .cart-count {
      position: absolute;
      top: -7px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 50px;
      background: #9333ea;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #080d1f;
    }

    .sell-btn {
      background: linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
      );
      padding: 10px 14px;
    }

    .sell-btn:hover {
      opacity: 0.92;
    }

    /* HERO */

    .hero {
      background: linear-gradient(
        135deg,
        rgba(124, 58, 237, 0.18),
        rgba(37, 99, 235, 0.10)
      );
      border: 1px solid rgba(139, 92, 246, 0.18);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .hero p {
      margin: 0;
      color: #aeb6ce;
      font-size: 14px;
      line-height: 1.5;
    }

    /* SEARCH */

    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input,
    .category-select {
      width: 100%;
      height: 46px;
      border-radius: 11px;
      border: 1px solid #252d49;
      background: #11182e;
      color: #fff;
      outline: none;
      padding: 0 14px;
      font-size: 14px;
    }

    .search-box input:focus,
    .category-select:focus {
      border-color: #7c3aed;
    }

    .category-wrap {
      width: 230px;
    }

    .category-select option {
      background: #11182e;
      color: #fff;
    }

    /* RESULTS */

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .results-title {
      font-size: 17px;
      font-weight: 700;
    }

    .result-count {
      color: #8791ad;
      font-size: 13px;
    }

    /* PRODUCTS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(
        4,
        minmax(0, 1fr)
      );
      gap: 15px;
    }

    .product-card {
      background: #11182e;
      border: 1px solid #222b47;
      border-radius: 15px;
      overflow: hidden;
      transition:
        transform 0.18s ease,
        border-color 0.18s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      border-color: #6543c5;
    }

    .product-image-link {
      display: block;
      background: #171e35;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .product-content {
      padding: 13px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 17px;
      font-weight: 800;
      color: #a78bfa;
      margin-bottom: 9px;
    }

    .product-category {
      display: inline-block;
      background: rgba(
        124,
        58,
        237,
        0.13
      );
      color: #b9a2ff;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .store-link {
      display: block;
      color: #c7cede;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .store-link:hover {
      color: #a78bfa;
    }

    .view-product {
      display: block;
      margin-top: 11px;
      text-align: center;
      background: #1b2440;
      border-radius: 9px;
      padding: 9px;
      color: #d8dced;
      font-size: 12px;
      font-weight: 700;
    }

    .view-product:hover {
      background: #263154;
    }

    /* EMPTY / LOADING */

    .state-box {
      background: #11182e;
      border: 1px solid #222b47;
      border-radius: 15px;
      padding: 35px 20px;
      text-align: center;
      color: #9da7c0;
      grid-column: 1 / -1;
    }

    .state-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .state-title {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .state-text {
      font-size: 13px;
      line-height: 1.5;
    }

    .error-box {
      border-color: rgba(
        239,
        68,
        68,
        0.35
      );
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .products-grid {
        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );
      }

    }

    @media (max-width: 650px) {

      .page {
        padding: 12px;
      }

      .topbar {
        margin-bottom: 16px;
      }

      .brand {
        font-size: 20px;
      }

      .header-actions {
        gap: 6px;
      }

      .cart-btn {
        padding: 9px 11px;
      }

      .sell-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      .hero {
        padding: 16px;
        border-radius: 15px;
      }

      .hero h1 {
        font-size: 21px;
      }

      .search-area {
        flex-direction: column;
      }

      .category-wrap {
        width: 100%;
      }

      .products-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
        gap: 10px;
      }

      .product-content {
        padding: 10px;
      }

      .product-title {
        font-size: 13px;
      }

      .product-price {
        font-size: 15px;
      }

    }

    @media (max-width: 430px) {

      .brand {
        font-size: 17px;
      }

      .sell-btn {
        font-size: 11px;
        padding: 9px 8px;
      }

      .cart-btn {
        min-width: 46px;
        padding: 9px 8px;
      }

    }

    @media (max-width: 380px) {

      .products-grid {
        grid-template-columns:
          1fr 1fr;
      }

      .brand {
        font-size: 16px;
      }

    }

  </style>
</head>

<body>

  <div class="page">

    <!-- HEADER -->

    <div class="topbar">

      <a
        href="index.html"
        class="brand"
      >
        Earn<span>Gig</span> Marketplace
      </a>


      <div class="header-actions">

        <!-- CART -->

        <button
          class="cart-btn"
          type="button"
          onclick="window.location.href='cart.html'"
          aria-label="Open shopping cart"
          title="Shopping Cart"
        >

          <span class="cart-icon">
            🛒
          </span>

          <span
            id="cartCount"
            class="cart-count"
            style="display:none;"
          >
            0
          </span>

        </button>


        <!-- SELL -->

        <button
          class="sell-btn"
          type="button"
          onclick="window.location.href='vendor-application.html'"
        >
          Sell on EarnGig
        </button>

      </div>

    </div>


    <!-- HERO -->

    <section class="hero">

      <h1>
        Shop from EarnGig vendors
      </h1>

      <p>
        Discover physical products from different
        vendors and stores on EarnGig.
      </p>

    </section>


    <!-- SEARCH + CATEGORY -->

    <div class="search-area">

      <div class="search-box">

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          autocomplete="off"
        />

      </div>


      <div class="category-wrap">

        <select
          id="categorySelect"
          class="category-select"
        >

          <option value="">
            All categories
          </option>

          <option value="Fashion & Clothing">
            Fashion & Clothing
          </option>

          <option value="Beauty & Cosmetics">
            Beauty & Cosmetics
          </option>

          <option value="Nails & Nail Accessories">
            Nails & Nail Accessories
          </option>

          <option value="Bags & Accessories">
            Bags & Accessories
          </option>

          <option value="Shoes & Footwear">
            Shoes & Footwear
          </option>

          <option value="Phones & Tablets">
            Phones & Tablets
          </option>

          <option value="Computers & Laptops">
            Computers & Laptops
          </option>

          <option value="Electronics & Gadgets">
            Electronics & Gadgets
          </option>

          <option value="Home & Kitchen">
            Home & Kitchen
          </option>

          <option value="Furniture">
            Furniture
          </option>

          <option value="Baby & Kids">
            Baby & Kids
          </option>

          <option value="Health & Personal Care">
            Health & Personal Care
          </option>

          <option value="Food & Drinks">
            Food & Drinks
          </option>

          <option value="Groceries">
            Groceries
          </option>

          <option value="Auto & Accessories">
            Auto & Accessories
          </option>

          <option value="Tools & Hardware">
            Tools & Hardware
          </option>

          <option value="Gifts & Accessories">
            Gifts & Accessories
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>

    </div>


    <!-- RESULTS HEADER -->

    <div class="results-header">

      <div class="results-title">
        Products
      </div>

      <div
        class="result-count"
        id="resultCount"
      >
        Loading...
      </div>

    </div>


    <!-- PRODUCTS -->

    <div
      class="products-grid"
      id="productsGrid"
    >

      <div class="state-box">

        <div class="state-icon">
          🛍️
        </div>

        <div class="state-title">
          Loading marketplace
        </div>

        <div class="state-text">
          Please wait while we load available products.
        </div>

      </div>

    </div>

  </div>


  <script>

    const productsGrid =
      document.getElementById(
        "productsGrid"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const categorySelect =
      document.getElementById(
        "categorySelect"
      );

    const resultCount =
      document.getElementById(
        "resultCount"
      );

    const cartCount =
      document.getElementById(
        "cartCount"
      );


    let allProducts = [];

    let storesById = {};


    /* ======================================================
       HELPERS
    ====================================================== */

    function formatNaira(amount) {

      const value =
        Number(amount || 0);

      return "₦" +
        value.toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          }
        );

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function getStore(product) {

      return storesById[
        product.store_id
      ] || null;

    }


    /* ======================================================
       CART COUNT
    ====================================================== */

    async function loadCartCount() {

      try {

        /*
         * We only need the current user's cart.
         * If the buyer is not logged in, the cart button
         * still works and opens cart.html.
         */

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          cartCount.style.display =
            "none";

          return;

        }


        const {
          data: cart,
          error: cartError
        } =
          await supabaseClient
            .from("marketplace_carts")
            .select("id")
            .eq(
              "user_id",
              user.id
            )
            .limit(1)
            .maybeSingle();


        if (cartError) {

          console.warn(
            "Cart loading error:",
            cartError
          );

          cartCount.style.display =
            "none";

          return;

        }


        if (!cart) {

          cartCount.style.display =
            "none";

          return;

        }


        const {
          data: items,
          error: itemsError
        } =
          await supabaseClient
            .from(
              "marketplace_cart_items"
            )
            .select(`
              quantity
            `)
            .eq(
              "cart_id",
              cart.id
            );


        if (itemsError) {

          console.warn(
            "Cart item count error:",
            itemsError
          );

          cartCount.style.display =
            "none";

          return;

        }


        const totalQuantity =
          (items || []).reduce(
            (
              total,
              item
            ) => {

              return total +
                Number(
                  item.quantity || 0
                );

            },
            0
          );


        if (
          totalQuantity > 0
        ) {

          cartCount.textContent =
            totalQuantity > 99
              ? "99+"
              : String(
                  totalQuantity
                );

          cartCount.style.display =
            "flex";

        } else {

          cartCount.style.display =
            "none";

        }

      } catch (error) {

        console.warn(
          "Unable to load cart count:",
          error
        );

        cartCount.style.display =
          "none";

      }

    }


    /* ======================================================
       RENDER PRODUCTS
    ====================================================== */

    function renderProducts() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const category =
        categorySelect.value;


      const filtered =
        allProducts.filter(
          product => {

            const title =
              String(
                product.title || ""
              ).toLowerCase();

            const description =
              String(
                product.description || ""
              ).toLowerCase();

            const productCategory =
              String(
                product.category || ""
              );


            const store =
              getStore(product);


            const storeName =
              String(
                store?.store_name || ""
              ).toLowerCase();


            const matchesSearch =
              !search ||
              title.includes(search) ||
              description.includes(search) ||
              productCategory
                .toLowerCase()
                .includes(search) ||
              storeName.includes(search);


            const matchesCategory =
              !category ||
              productCategory ===
                category;


            return (
              matchesSearch &&
              matchesCategory
            );

          }
        );


      resultCount.textContent =
        filtered.length +
        (
          filtered.length === 1
            ? " product"
            : " products"
        );


      if (!filtered.length) {

        productsGrid.innerHTML = `

          <div class="state-box">

            <div class="state-icon">
              🔎
            </div>

            <div class="state-title">
              No products found
            </div>

            <div class="state-text">
              Try another search term or category.
            </div>

          </div>

        `;

        return;

      }


      productsGrid.innerHTML =
        filtered.map(
          product => {

            const store =
              getStore(product);


            const storeName =
              store?.store_name ||
              "EarnGig Vendor";


            const storeSlug =
              store?.store_slug ||
              "";


            const storeUrl =
              storeSlug
                ? `store.html?store=${
                    encodeURIComponent(
                      storeSlug
                    )
                  }`
                : "#";


            const productUrl =
              `product.html?id=${
                encodeURIComponent(
                  product.id
                )
              }`;


            return `

              <article class="product-card">

                <a
                  href="${productUrl}"
                  class="product-image-link"
                  aria-label="View ${escapeHtml(
                    product.title
                  )}"
                >

                  <img
                    src="${escapeHtml(
                      product.image_url
                    )}"
                    alt="${escapeHtml(
                      product.title
                    )}"
                    class="product-image"
                    loading="lazy"
                  />

                </a>


                <div class="product-content">

                  <a
                    href="${productUrl}"
                    class="product-title"
                  >
                    ${escapeHtml(
                      product.title
                    )}
                  </a>


                  <div class="product-price">
                    ${formatNaira(
                      product.price
                    )}
                  </div>


                  <span class="product-category">
                    ${escapeHtml(
                      product.category ||
                      "Other"
                    )}
                  </span>


                  ${
                    store
                      ? `

                        <a
                          href="${storeUrl}"
                          class="store-link"
                          title="Visit ${escapeHtml(
                            storeName
                          )}"
                        >

                          🏪
                          ${escapeHtml(
                            storeName
                          )}

                        </a>

                      `
                      : `

                        <span class="store-link">

                          🏪
                          ${escapeHtml(
                            storeName
                          )}

                        </span>

                      `
                  }


                  <a
                    href="${productUrl}"
                    class="view-product"
                  >
                    View Product
                  </a>

                </div>

              </article>

            `;

          }
        ).join("");

    }


    /* ======================================================
       LOAD MARKETPLACE
    ====================================================== */

    async function loadMarketplace() {

      try {

        const {
          data: products,
          error: productsError
        } =
          await supabaseClient
            .from(
              "marketplace_products"
            )
            .select(`
              id,
              store_id,
              vendor_id,
              title,
              category,
              description,
              price,
              stock_quantity,
              delivery_type,
              status,
              created_at
            `)
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (productsError) {

          throw productsError;

        }


        const usableProducts =
          (
            products || []
          ).filter(
            product => {

              const status =
                String(
                  product.status || ""
                ).toLowerCase();


              if (
                status &&
                ![
                  "active",
                  "approved",
                  "published",
                  "available"
                ].includes(
                  status
                )
              ) {

                return false;

              }


              if (
                Number(
                  product.stock_quantity
                ) <= 0
              ) {

                return false;

              }


              return true;

            }
          );


        if (
          !usableProducts.length
        ) {

          allProducts = [];

          resultCount.textContent =
            "0 products";


          productsGrid.innerHTML = `

            <div class="state-box">

              <div class="state-icon">
                🛍️
              </div>

              <div class="state-title">
                No products available yet
              </div>

              <div class="state-text">
                New products from approved
                EarnGig vendors will appear here.
              </div>

            </div>

          `;

          return;

        }


        const productIds =
          usableProducts
            .map(
              product =>
                product.id
            )
            .filter(Boolean);


        const {
          data: images,
          error: imagesError
        } =
          await supabaseClient
            .from(
              "marketplace_product_images"
            )
            .select(`
              id,
              product_id,
              image_url,
              is_primary,
              sort_order
            `)
            .in(
              "product_id",
              productIds
            )
            .order(
              "is_primary",
              {
                ascending: false
              }
            )
            .order(
              "sort_order",
              {
                ascending: true
              }
            );


        if (imagesError) {

          throw imagesError;

        }


        const primaryImageByProduct =
          {};


        (
          images || []
        ).forEach(
          image => {

            if (
              !primaryImageByProduct[
                image.product_id
              ]
            ) {

              primaryImageByProduct[
                image.product_id
              ] =
                image.image_url;

            }

          }
        );


        allProducts =
          usableProducts
            .map(
              product => {

                return {
                  ...product,

                  image_url:
                    primaryImageByProduct[
                      product.id
                    ] || ""

                };

              }
            )
            .filter(
              product => {

                return String(
                  product.image_url || ""
                ).trim() !== "";

              }
            );


        const storeIds =
          [
            ...new Set(
              allProducts
                .map(
                  product =>
                    product.store_id
                )
                .filter(Boolean)
            )
          ];


        storesById = {};


        if (
          storeIds.length
        ) {

          const {
            data: stores,
            error: storesError
          } =
            await supabaseClient
              .from(
                "marketplace_stores"
              )
              .select(`
                id,
                vendor_id,
                store_name,
                store_slug,
                store_logo_url,
                description,
                status
              `)
              .in(
                "id",
                storeIds
              )
              .eq(
                "status",
                "active"
              );


          if (storesError) {

            console.warn(
              "Store information could not be loaded:",
              storesError
            );

          } else {

            (
              stores || []
            ).forEach(
              store => {

                storesById[
                  store.id
                ] = store;

              }
            );

          }

        }


        renderProducts();

      } catch (error) {

        console.error(
          "Marketplace loading error:",
          error
        );


        resultCount.textContent =
          "Error";


        productsGrid.innerHTML = `

          <div class="state-box error-box">

            <div class="state-icon">
              ⚠️
            </div>

            <div class="state-title">
              Marketplace could not be loaded
            </div>

            <div class="state-text">
              Please refresh the page and try again.
            </div>

          </div>

        `;

      }

    }


    /* ======================================================
       EVENTS
    ====================================================== */
