<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Novel | EarnGig Admin</title>

<link rel="stylesheet" href="styles.css">

<style>

.review-detail {
    display: grid;
    gap: 24px;
}

.review-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

.novel-header {
    display: flex;
    gap: 25px;
    align-items: flex-start;
}

.novel-cover {
    width: 150px;
    height: 210px;
    object-fit: cover;
    border-radius: 14px;
}

.novel-header-info {
    flex: 1;
}

.novel-header-info h2 {
    margin: 8px 0 10px;
}

.novel-details {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 14px;
    margin-top: 25px;
}

.detail-box {
    padding: 16px;
    border-radius: 12px;
    background: #f5f6fa;
}

.detail-box small {
    display: block;
    opacity: .65;
    margin-bottom: 6px;
}

.detail-box strong {
    font-size: 18px;
}

.description-box {
    margin-top: 22px;
    padding: 20px;
    border-radius: 14px;
    background: #f5f6fa;
}

.assessment-form {
    margin-top: 10px;
}

.assessment-form label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: 600;
}

.assessment-form input,
.assessment-form select,
.assessment-form textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #d6d8e0;
}

.money-input {
    display: flex;
    align-items: center;
    gap: 8px;
}

.money-input span {
    font-weight: 700;
}

.decision-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 25px;
}

.message {
    margin-top: 20px;
}

.loading-box,
.error-box {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
}

@media(max-width:700px) {

    .novel-header {
        flex-direction: column;
    }

    .novel-details {
        grid-template-columns: 1fr;
    }

    .novel-cover {
        width: 130px;
        height: 180px;
    }
}

</style>

</head>

<body>

<header>

<div class="container nav">

<a class="logo" href="index.html">
<span class="logo-mark">E</span>
Earn<span>Gig</span>
</a>

<span class="admin-badge">ADMIN</span>

</div>

</header>


<main class="dashboard-page">

<div class="container">

<div class="dashboard-heading">

<div>

<span class="eyebrow">NOVEL ASSESSMENT</span>

<h1>Review Submission</h1>

<p>
Review the writer's submission and determine the approved
earning rate and listing fee.
</p>

</div>

<a class="btn outline" href="novel-review.html">
← Back to Submissions
</a>

</div>


<div id="content">

<div class="loading-box">

<h3>Loading submission...</h3>

<p>Please wait.</p>

</div>

</div>

</div>

</main>


<footer>

<div class="container copy">
© 2026 EarnGig Administration.
</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="supabase.js"></script>


<script>

const content = document.getElementById("content");

const params = new URLSearchParams(window.location.search);

const novelId = params.get("id");
let currentNovel = null;

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function checkAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.href = "login.html";

        return null;

    }


    const { data: profile, error: profileError } =
        await supabaseClient

        .from("profiles")

        .select("is_admin")

        .eq("id", user.id)

        .single();


    if (profileError || !profile?.is_admin) {

        alert("Admin access required.");

        window.location.href = "dashboard.html";

        return null;

    }


    return user;

}


async function loadNovel() {

    if (!novelId) {

        content.innerHTML = `
            <div class="error-box">
                <h3>Submission not found</h3>
                <p>No novel ID was provided.</p>
            </div>
        `;

        return;

    }


    const { data: novel, error } = await supabaseClient

        .from("novels")

        .select(`
            id,
            title,
            author_name,
            description,
            cover_url,
            genre,
            page_count,
            requested_reader_count,
            submission_status,
            manuscript_url,
            created_at
        `)

        .eq("id", novelId)

        .eq("submission_status", "pending")

        .single();

currentNovel = novel;
    if (error || !novel) {

        content.innerHTML = `
            <div class="error-box">
                <h3>Submission not available</h3>
                <p>
                    This novel may have already been approved,
                    rejected, or removed from the pending queue.
                </p>

                <a
                    href="novel-review.html"
                    class="btn primary"
                >
                    Back to Submissions
                </a>

            </div>
        `;

        return;

    }


    content.innerHTML = `

    <div class="review-detail">


        <section class="review-card">

            <div class="novel-header">

                ${
                    novel.cover_url
                    ?
                    `
                    <img
                        src="${escapeHtml(novel.cover_url)}"
                        class="novel-cover"
                        alt="${escapeHtml(novel.title)}"
                    >
                    `
                    :
                    ""
                }


                <div class="novel-header-info">

                    <span class="status-badge">
                        Pending Review
                    </span>

                    <h2>
                        ${escapeHtml(novel.title)}
                    </h2>

                    <p>
                        Submitted
                        ${new Date(novel.created_at).toLocaleString()}
                    </p>

                </div>

            </div>


            <div class="novel-details">

                <div class="detail-box">

                    <small>Writer</small>

                    <strong>
                        ${escapeHtml(novel.author_name)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Genre</small>

                    <strong>
                        ${escapeHtml(novel.genre)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Pages</small>

                    <strong>
                        ${Number(novel.page_count || 0)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Requested readers</small>

                    <strong>
                        ${Number(novel.requested_reader_count || 0)}
                    </strong>

                </div>

            </div>


            <div class="description-box">

                <span class="eyebrow">
                    WRITER DESCRIPTION
                </span>

                <p>
                    ${escapeHtml(novel.description)}
                </p>

            </div>


    <div style="margin-top:20px">

    <span class="eyebrow">
        MANUSCRIPT
    </span>

    <p>
        The writer has submitted a manuscript
        for assessment.
    </p>

    <button
        type="button"
        class="btn primary"
        onclick="viewManuscript()"
    >
        View Manuscript
    </button>

    <div id="manuscript-message" style="margin-top:12px"></div>

</div>

        </section>



        <section class="review-card">

            <span class="eyebrow">
                ADMIN DECISION
            </span>

            <h2>Assessment & Pricing</h2>


            <div class="assessment-form">


                <label>
                    Quality assessment
                </label>

                <select id="quality">

                    <option value="">
                        Select assessment
                    </option>

                    <option value="Excellent">
                        Excellent
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Average">
                        Average
                    </option>

                    <option value="Needs Revision">
                        Needs Revision
                    </option>

                </select>



                <label>
                    Approved page count
                </label>

                <input
                    type="number"
                    id="pages"
                    value="${Number(novel.page_count || 0)}"
                    min="1"
                >



                <label>
                    Reader reward
                </label>

                <div class="money-input">

                    <span>₦</span>

                    <input
                        type="number"
                        id="reward"
                        placeholder="Example: 100"
                        min="0"
                    >

                </div>



                <label>
                    Writer listing fee
                </label>

                <div class="money-input">

                    <span>₦</span>

                    <input
                        type="number"
                        id="fee"
                        placeholder="Example: 1000"
                        min="0"
                    >

                </div>



                <label>
                    Approved reader count
                </label>

                <select id="readers">

                    <option value="50"
                        ${novel.requested_reader_count == 50 ? "selected" : ""}>
                        50 readers
                    </option>

                    <option value="100"
                        ${novel.requested_reader_count == 100 ? "selected" : ""}>
                        100 readers
                    </option>

                    <option value="200"
                        ${novel.requested_reader_count == 200 ? "selected" : ""}>
                        200 readers
                    </option>

                    <option value="300"
                        ${novel.requested_reader_count == 300 ? "selected" : ""}>
                        300 readers
                    </option>

                    <option value="500"
                        ${novel.requested_reader_count == 500 ? "selected" : ""}>
                        500 readers
                    </option>

                </select>



                <label>
                    Assessment notes
                </label>

                <textarea
                    id="notes"
                    rows="5"
                    placeholder="Write notes for the writer..."
                ></textarea>



    <div class="decision-actions">

    <button
        type="button"
        class="btn danger"
        onclick="rejectNovel()"
    >
        Reject
    </button>

    <button
        type="button"
        class="btn warning"
        onclick="requestRevision()"
    >
        Request Revision
    </button>

    <button
        type="button"
        class="btn light"
        onclick="processNovelManuscript()"
    >
        Process Manuscript
    </button>

    <button
        type="button"
        class="btn primary"
        onclick="approveNovel()"
    >
        Approve & Set Pricing
    </button>

</div>            

 async function approveNovel() {
  if (!currentNovel) {
    alert("Novel not loaded.");
    return;
  }

  const quality = document.getElementById("quality").value;
  const pages = Number(document.getElementById("pages").value);
  const reward = Number(document.getElementById("reward").value);
  const fee = Number(document.getElementById("fee").value);
  const readers = Number(document.getElementById("readers").value);
  const notes = document.getElementById("notes").value.trim();

  if (!pages || pages <= 0) {
    alert("Please enter a valid page count.");
    return;
  }

  if (!reward || reward <= 0) {
    alert("Please enter a valid reader reward.");
    return;
  }

  if (!fee || fee < 0) {
    alert("Please enter a valid listing fee.");
    return;
  }

  if (!readers || readers <= 0) {
    alert("Please enter a valid reader target.");
    return;
  }

  if (!currentNovel.manuscript_url) {
    alert("This novel has no manuscript uploaded.");
    return;
  }

  if (!confirm(
    "Approve this novel?\n\n" +
    "The manuscript will be processed first. " +
    "If processing fails, the novel will NOT be approved."
  )) {
    return;
  }

  const processButton = document.querySelector(
    'button[onclick="approveNovel()"]'
  );

  if (processButton) {
    processButton.disabled = true;
    processButton.textContent = "Processing manuscript...";
  }

  try {
    // 1. Process uploaded manuscript into novel_pages
    const processed = await processNovelManuscript();

    if (!processed) {
      if (processButton) {
        processButton.disabled = false;
        processButton.textContent = "Approve Novel";
      }
      return;
    }

    // 2. Only approve AFTER manuscript processing succeeds
    const { error } = await supabaseClient
      .from("novels")
      .update({
        submission_status: "approved",
        status: "approved",
        page_count: pages,
        approved_reader_count: readers,
        approved_reader_reward: reward,
        writer_listing_fee: fee,
        writer_payment_status: "unpaid",
        assessment_notes: notes,
        approved_at: new Date().toISOString(),
        approved_by: user.id
      })
      .eq("id", currentNovel.id);

    if (error) throw error;

    alert("Novel approved successfully.");

    window.location.href = "novel-review.html";

  } catch (error) {
    console.error("Approval error:", error);

    alert(
      "Novel approval failed:\n\n" +
      (error.message || "Unknown error")
    );

    if (processButton) {
      processButton.disabled = false;
      processButton.textContent = "Approve Novel";
    }
  }
 }        


async function rejectNovel() {

    const notes =
        document.getElementById("notes").value.trim();


    if (!confirm("Reject this novel submission?")) {

        return;

    }


    const message =
        document.getElementById("message");


    const { error } = await supabaseClient

        .from("novels")

        .update({

            submission_status: "rejected",

            status: "rejected",

            assessment_notes: notes

        })

        .eq("id", novelId)

        .eq("submission_status", "pending");


    if (error) {

        message.innerHTML = `
            <div class="assessment-notice">

                <strong>
                    Unable to reject novel.
                </strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }


    window.location.href =
        "novel-review.html";

}


async function requestRevision() {

    const notes =
        document.getElementById("notes").value.trim();


    if (!notes) {

        alert("Please write revision notes for the writer.");

        return;

    }


    const message =
        document.getElementById("message");


    const { error } = await supabaseClient

        .from("novels")

        .update({

            submission_status: "revision_requested",

            status: "revision_requested",

            assessment_notes: notes

        })

        .eq("id", novelId)

        .eq("submission_status", "pending");


    if (error) {

        message.innerHTML = `
            <div class="assessment-notice">

                <strong>
                    Unable to request revision.
                </strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }


    window.location.href =
        "novel-review.html";

}
async function viewManuscript() {

    const message = document.getElementById("manuscript-message");

    message.textContent = "Opening manuscript...";

    const { data, error } = await supabaseClient
        .storage
        .from("novel-manuscripts")
        .createSignedUrl(currentNovel.manuscript_url, 3600);

    if (error || !data?.signedUrl) {

        message.innerHTML = `
            <div class="assessment-notice">
                <strong>Unable to open manuscript.</strong>
                <p>${escapeHtml(error?.message || "Manuscript URL could not be created.")}</p>
            </div>
        `;

        return;
    }

    window.open(data.signedUrl, "_blank");

    message.textContent = "Manuscript opened in a new tab.";
}

(async function() {

    const user = await checkAdmin();

    if (!user) return;

    await loadNovel();

})();
async function processNovelManuscript() {
  if (!currentNovel || !currentNovel.manuscript_url) {
    alert("No manuscript was found for this novel.");
    return false;
  }

  try {
    alert("Processing manuscript. Please wait...");

    // Get a temporary URL for the private manuscript
    const { data: signedData, error: signedError } =
      await supabaseClient.storage
        .from("novel-manuscripts")
        .createSignedUrl(currentNovel.manuscript_url, 3600);

    if (signedError) throw signedError;

    const fileUrl = signedData.signedUrl;

    // Download manuscript
    const response = await fetch(fileUrl);

    if (!response.ok) {
      throw new Error("Could not download the manuscript.");
    }

    const arrayBuffer = await response.arrayBuffer();

    const fileName = currentNovel.manuscript_url.toLowerCase();

    let pages = [];

    /*
     * PDF
     */
    if (fileName.endsWith(".pdf")) {
      const pdf = await pdfjsLib.getDocument({
        data: arrayBuffer
      }).promise;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);

        const textContent = await page.getTextContent();

        const text = textContent.items
          .map(item => item.str || "")
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();

        if (!text) {
          throw new Error(
            `Page ${i} contains no readable text. This PDF may be scanned/image-only.`
          );
        }

        const safeText = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

        pages.push({
          id: crypto.randomUUID(),
          novel_id: currentNovel.id,
          page_number: i,
          chapter: "",
          title: `Page ${i}`,
          content: `<p>${safeText}</p>`
        });
      }
    }

    /*
     * DOCX
     */
    else if (fileName.endsWith(".docx")) {
      const result = await mammoth.convertToHtml({
        arrayBuffer: arrayBuffer
      });

      const html = result.value;

      const temp = document.createElement("div");
      temp.innerHTML = html;

      const paragraphs = Array.from(
        temp.querySelectorAll("p")
      )
        .map(p => p.innerText.trim())
        .filter(Boolean);

      if (!paragraphs.length) {
        throw new Error("The DOCX manuscript contains no readable text.");
      }

      /*
       * DOCX does not reliably expose physical pages in the browser.
       * We therefore create logical reading pages.
       */
      const chunkSize = 12;

      for (let i = 0; i < paragraphs.length; i += chunkSize) {
        const chunk = paragraphs.slice(i, i + chunkSize);

        const content = chunk
          .map(text => {
            const safe = text
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");

            return `<p>${safe}</p>`;
          })
          .join("");

        pages.push({
          id: crypto.randomUUID(),
          novel_id: currentNovel.id,
          page_number: pages.length + 1,
          chapter: "",
          title: `Page ${pages.length + 1}`,
          content
        });
      }
    }

    else {
      throw new Error(
        "Unsupported manuscript format. Please upload PDF or DOCX."
      );
    }

    if (!pages.length) {
      throw new Error("No readable pages were created.");
    }

    /*
     * Delete old processed pages only AFTER
     * successful extraction.
     */
    const { error: deleteError } = await supabaseClient
      .from("novel_pages")
      .delete()
      .eq("novel_id", currentNovel.id);

    if (deleteError) throw deleteError;

    /*
     * Insert processed pages.
     */
    const { error: insertError } = await supabaseClient
      .from("novel_pages")
      .insert(pages);

    if (insertError) throw insertError;

    /*
     * Keep the database page count synchronized
     * with the actual processed manuscript.
     */
    const { error: updateError } = await supabaseClient
      .from("novels")
      .update({
        page_count: pages.length
      })
      .eq("id", currentNovel.id);

    if (updateError) throw updateError;

    alert(
      `Manuscript processed successfully.\n\n${pages.length} reading pages created.`
    );

    return true;

  } catch (error) {
    console.error("Manuscript processing error:", error);

    alert(
      "Manuscript processing failed:\n\n" +
      (error.message || "Unknown error")
    );

    return false;
  }
    }
</script>
