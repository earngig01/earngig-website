<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Novel | EarnGig Admin</title>

<link rel="stylesheet" href="styles.css">

<style>

.review-detail {
    display: grid;
    gap: 24px;
}

.review-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

.novel-header {
    display: flex;
    gap: 25px;
    align-items: flex-start;
}

.novel-cover {
    width: 150px;
    height: 210px;
    object-fit: cover;
    border-radius: 14px;
}

.novel-header-info {
    flex: 1;
}

.novel-header-info h2 {
    margin: 8px 0 10px;
}

.novel-details {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 14px;
    margin-top: 25px;
}

.detail-box {
    padding: 16px;
    border-radius: 12px;
    background: #f5f6fa;
}

.detail-box small {
    display: block;
    opacity: .65;
    margin-bottom: 6px;
}

.detail-box strong {
    font-size: 18px;
}

.description-box {
    margin-top: 22px;
    padding: 20px;
    border-radius: 14px;
    background: #f5f6fa;
}

.assessment-form {
    margin-top: 10px;
}

.assessment-form label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: 600;
}

.assessment-form input,
.assessment-form select,
.assessment-form textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #d6d8e0;
}

.money-input {
    display: flex;
    align-items: center;
    gap: 8px;
}

.money-input span {
    font-weight: 700;
}

.decision-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 25px;
}

.message {
    margin-top: 20px;
}

.loading-box,
.error-box {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
}

@media(max-width:700px) {

    .novel-header {
        flex-direction: column;
    }

    .novel-details {
        grid-template-columns: 1fr;
    }

    .novel-cover {
        width: 130px;
        height: 180px;
    }
}

</style>

</head>

<body>

<header>

<div class="container nav">

<a class="logo" href="index.html">
<span class="logo-mark">E</span>
Earn<span>Gig</span>
</a>

<span class="admin-badge">ADMIN</span>

</div>

</header>


<main class="dashboard-page">

<div class="container">

<div class="dashboard-heading">

<div>

<span class="eyebrow">NOVEL ASSESSMENT</span>

<h1>Review Submission</h1>

<p>
Review the writer's submission and determine the approved
earning rate and listing fee.
</p>

</div>

<a class="btn outline" href="novel-review.html">
← Back to Submissions
</a>

</div>


<div id="content">

<div class="loading-box">

<h3>Loading submission...</h3>

<p>Please wait.</p>

</div>

</div>

</div>

</main>


<footer>

<div class="container copy">
© 2026 EarnGig Administration.
</div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const content = document.getElementById("content");

const params = new URLSearchParams(window.location.search);

const novelId = params.get("id");
let currentNovel = null;

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function checkAdmin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.href = "login.html";

        return null;

    }


    const { data: profile, error: profileError } =
        await supabaseClient

        .from("profiles")

        .select("is_admin")

        .eq("id", user.id)

        .single();


    if (profileError || !profile?.is_admin) {

        alert("Admin access required.");

        window.location.href = "dashboard.html";

        return null;

    }


    return user;

}


async function loadNovel() {

    if (!novelId) {

        content.innerHTML = `
            <div class="error-box">
                <h3>Submission not found</h3>
                <p>No novel ID was provided.</p>
            </div>
        `;

        return;

    }


    const { data: novel, error } = await supabaseClient

        .from("novels")

        .select(`
            id,
            title,
            author_name,
            description,
            cover_url,
            genre,
            page_count,
            requested_reader_count,
            submission_status,
            manuscript_url,
            created_at
        `)

        .eq("id", novelId)

        .eq("submission_status", "pending")

        .single();

currentNovel = novel;
    if (error || !novel) {

        content.innerHTML = `
            <div class="error-box">
                <h3>Submission not available</h3>
                <p>
                    This novel may have already been approved,
                    rejected, or removed from the pending queue.
                </p>

                <a
                    href="novel-review.html"
                    class="btn primary"
                >
                    Back to Submissions
                </a>

            </div>
        `;

        return;

    }


    content.innerHTML = `

    <div class="review-detail">


        <section class="review-card">

            <div class="novel-header">

                ${
                    novel.cover_url
                    ?
                    `
                    <img
                        src="${escapeHtml(novel.cover_url)}"
                        class="novel-cover"
                        alt="${escapeHtml(novel.title)}"
                    >
                    `
                    :
                    ""
                }


                <div class="novel-header-info">

                    <span class="status-badge">
                        Pending Review
                    </span>

                    <h2>
                        ${escapeHtml(novel.title)}
                    </h2>

                    <p>
                        Submitted
                        ${new Date(novel.created_at).toLocaleString()}
                    </p>

                </div>

            </div>


            <div class="novel-details">

                <div class="detail-box">

                    <small>Writer</small>

                    <strong>
                        ${escapeHtml(novel.author_name)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Genre</small>

                    <strong>
                        ${escapeHtml(novel.genre)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Pages</small>

                    <strong>
                        ${Number(novel.page_count || 0)}
                    </strong>

                </div>


                <div class="detail-box">

                    <small>Requested readers</small>

                    <strong>
                        ${Number(novel.requested_reader_count || 0)}
                    </strong>

                </div>

            </div>


            <div class="description-box">

                <span class="eyebrow">
                    WRITER DESCRIPTION
                </span>

                <p>
                    ${escapeHtml(novel.description)}
                </p>

            </div>


    <div style="margin-top:20px">

    <span class="eyebrow">
        MANUSCRIPT
    </span>

    <p>
        The writer has submitted a manuscript
        for assessment.
    </p>

    <button
        type="button"
        class="btn primary"
        onclick="viewManuscript()"
    >
        View Manuscript
    </button>

    <div id="manuscript-message" style="margin-top:12px"></div>

</div>

        </section>



        <section class="review-card">

            <span class="eyebrow">
                ADMIN DECISION
            </span>

            <h2>Assessment & Pricing</h2>


            <div class="assessment-form">


                <label>
                    Quality assessment
                </label>

                <select id="quality">

                    <option value="">
                        Select assessment
                    </option>

                    <option value="Excellent">
                        Excellent
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Average">
                        Average
                    </option>

                    <option value="Needs Revision">
                        Needs Revision
                    </option>

                </select>



                <label>
                    Approved page count
                </label>

                <input
                    type="number"
                    id="pages"
                    value="${Number(novel.page_count || 0)}"
                    min="1"
                >



                <label>
                    Reader reward
                </label>

                <div class="money-input">

                    <span>₦</span>

                    <input
                        type="number"
                        id="reward"
                        placeholder="Example: 100"
                        min="0"
                    >

                </div>



                <label>
                    Writer listing fee
                </label>

                <div class="money-input">

                    <span>₦</span>

                    <input
                        type="number"
                        id="fee"
                        placeholder="Example: 1000"
                        min="0"
                    >

                </div>



                <label>
                    Approved reader count
                </label>

                <select id="readers">

                    <option value="50"
                        ${novel.requested_reader_count == 50 ? "selected" : ""}>
                        50 readers
                    </option>

                    <option value="100"
                        ${novel.requested_reader_count == 100 ? "selected" : ""}>
                        100 readers
                    </option>

                    <option value="200"
                        ${novel.requested_reader_count == 200 ? "selected" : ""}>
                        200 readers
                    </option>

                    <option value="300"
                        ${novel.requested_reader_count == 300 ? "selected" : ""}>
                        300 readers
                    </option>

                    <option value="500"
                        ${novel.requested_reader_count == 500 ? "selected" : ""}>
                        500 readers
                    </option>

                </select>



                <label>
                    Assessment notes
                </label>

                <textarea
                    id="notes"
                    rows="5"
                    placeholder="Write notes for the writer..."
                ></textarea>



                <div class="decision-actions">

                    <button
                        type="button"
                        class="btn danger"
                        onclick="rejectNovel()"
                    >
                        Reject
                    </button>


                    <button
                        type="button"
                        class="btn warning"
                        onclick="requestRevision()"
                    >
                        Request Revision
                    </button>


                    <button
                        type="button"
                        class="btn primary"
                        onclick="approveNovel()"
                    >
                        Approve & Set Pricing
                    </button>

                </div>


                <div
                    id="message"
                    class="message"
                ></div>

            </div>

        </section>

    </div>

    `;

}


async function approveNovel() {

    const quality =
        document.getElementById("quality").value;

    const pages =
        Number(document.getElementById("pages").value);

    const reward =
        Number(document.getElementById("reward").value);

    const fee =
        Number(document.getElementById("fee").value);

    const readers =
        Number(document.getElementById("readers").value);

    const notes =
        document.getElementById("notes").value.trim();

    const message =
        document.getElementById("message");


    if (!quality) {

        alert("Please select a quality assessment.");

        return;

    }


    if (!reward || reward <= 0) {

        alert("Please enter the reader reward.");

        return;

    }


    if (fee < 0) {

        alert("Please enter a valid listing fee.");

        return;

    }


    if (!pages || pages <= 0) {

        alert("Please enter the approved page count.");

        return;

    }


    message.innerHTML = "Approving novel...";


    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    const { error } = await supabaseClient

        .from("novels")

        .update({

            submission_status: "approved",

            status: "approved",

            page_count: pages,

            approved_reader_count: readers,

            approved_reader_reward: reward,

            writer_listing_fee: fee,

            writer_payment_status: "unpaid",

            assessment_notes: notes,

            approved_at: new Date().toISOString(),

            approved_by: user.id

        })

        .eq("id", novelId)

        .eq("submission_status", "pending");


    if (error) {

        message.innerHTML = `
            <div class="assessment-notice">

                <strong>
                    Unable to approve novel.
                </strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }


    message.innerHTML = `
        <div class="assessment-notice">

            <strong>
                Novel approved successfully.
            </strong>

            <p>
                The novel has moved to
                Approved / Awaiting Payment.
            </p>

        </div>
    `;


    setTimeout(() => {

        window.location.href =
            "novel-approved.html";

    }, 1200);

}


async function rejectNovel() {

    const notes =
        document.getElementById("notes").value.trim();


    if (!confirm("Reject this novel submission?")) {

        return;

    }


    const message =
        document.getElementById("message");


    const { error } = await supabaseClient

        .from("novels")

        .update({

            submission_status: "rejected",

            status: "rejected",

            assessment_notes: notes

        })

        .eq("id", novelId)

        .eq("submission_status", "pending");


    if (error) {

        message.innerHTML = `
            <div class="assessment-notice">

                <strong>
                    Unable to reject novel.
                </strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }


    window.location.href =
        "novel-review.html";

}


async function requestRevision() {

    const notes =
        document.getElementById("notes").value.trim();


    if (!notes) {

        alert("Please write revision notes for the writer.");

        return;

    }


    const message =
        document.getElementById("message");


    const { error } = await supabaseClient

        .from("novels")

        .update({

            submission_status: "revision_requested",

            status: "revision_requested",

            assessment_notes: notes

        })

        .eq("id", novelId)

        .eq("submission_status", "pending");


    if (error) {

        message.innerHTML = `
            <div class="assessment-notice">

                <strong>
                    Unable to request revision.
                </strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>
        `;

        return;

    }


    window.location.href =
        "novel-review.html";

}
async function viewManuscript() {

    const message = document.getElementById("manuscript-message");

    message.textContent = "Opening manuscript...";

    const { data, error } = await supabaseClient
        .storage
        .from("novel-manuscripts")
        .createSignedUrl(currentNovel.manuscript_url, 3600);

    if (error || !data?.signedUrl) {

        message.innerHTML = `
            <div class="assessment-notice">
                <strong>Unable to open manuscript.</strong>
                <p>${escapeHtml(error?.message || "Manuscript URL could not be created.")}</p>
            </div>
        `;

        return;
    }

    window.open(data.signedUrl, "_blank");

    message.textContent = "Manuscript opened in a new tab.";
}

(async function() {

    const user = await checkAdmin();

    if (!user) return;

    await loadNovel();

})();

</script>

</body>
</html>
