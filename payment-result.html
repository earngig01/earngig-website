<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment | EarnGig</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    .payment-result-page {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .payment-result-card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 42px 28px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .payment-result-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 40px;
      font-weight: 800;
    }

    .payment-result-icon.success {
      color: #4ade80;
      background: rgba(34, 197, 94, 0.12);
    }

    .payment-result-icon.failed {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
    }

    .payment-result-card h1 {
      margin: 0 0 14px;
      font-size: 30px;
    }

    .payment-result-message {
      margin: 0 auto 26px;
      max-width: 430px;
      line-height: 1.7;
      opacity: 0.85;
    }

    .payment-result-plan {
      margin-bottom: 26px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .payment-result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

  </style>

</head>


<body>


<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >

      <span class="logo-mark">
        E
      </span>

      Earn<span>Gig</span>

    </a>


    <nav>

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="tasks.html">
        Tasks
      </a>

      <a href="read-and-earn.html">
        Read & Earn
      </a>

    </nav>


    <a
      class="btn outline"
      href="profile.html"
    >
      My Profile
    </a>

  </div>

</header>



<main class="payment-result-page">

  <div class="payment-result-card">

    <div
      id="result-icon"
      class="payment-result-icon"
    >
      ✓
    </div>


    <h1 id="result-title">
      Payment Successful
    </h1>


    <p
      id="result-message"
      class="payment-result-message"
    >
      Your membership payment has been confirmed.
    </p>


    <div
      id="result-plan"
      class="payment-result-plan"
      style="display:none;"
    ></div>


    <div class="payment-result-actions">

      <a
        id="primary-button"
        class="btn primary"
        href="dashboard.html"
      >
        Go to Dashboard
      </a>


      <a
        id="secondary-button"
        class="btn outline"
        href="membership.html"
      >
        Membership
      </a>

    </div>

  </div>

</main>



<footer>

  <div class="container copy">

    © 2026 EarnGig.
    All rights reserved.

  </div>

</footer>



<script>

(function () {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const status =
    params.get("status");


  const message =
    params.get("message");


  const plan =
    params.get("plan");


  const icon =
    document.getElementById(
      "result-icon"
    );


  const title =
    document.getElementById(
      "result-title"
    );


  const messageElement =
    document.getElementById(
      "result-message"
    );


  const planElement =
    document.getElementById(
      "result-plan"
    );


  const primaryButton =
    document.getElementById(
      "primary-button"
    );


  const secondaryButton =
    document.getElementById(
      "secondary-button"
    );


  const successful =
    status === "success";


  if (successful) {

    icon.className =
      "payment-result-icon success";

    icon.textContent =
      "✓";


    title.textContent =
      "Payment Successful";


    messageElement.textContent =
      message ||
      "Your membership payment has been confirmed and your membership is now active.";


    primaryButton.textContent =
      "Go to Dashboard";

    primaryButton.href =
      "dashboard.html";


    secondaryButton.textContent =
      "View Membership";

    secondaryButton.href =
      "membership.html";


    if (plan) {

      planElement.textContent =
        "Membership plan: " +
        plan;

      planElement.style.display =
        "block";

    }

  } else {

    icon.className =
      "payment-result-icon failed";

    icon.textContent =
      "!";


    title.textContent =
      "Payment Not Completed";


    messageElement.textContent =
      message ||
      "Your membership payment could not be confirmed. Please try again.";


    primaryButton.textContent =
      "Try Again";

    primaryButton.href =
      "membership.html";


    secondaryButton.textContent =
      "Go to Dashboard";

    secondaryButton.href =
      "dashboard.html";

  }

})();

</script>


</body>

</html>
