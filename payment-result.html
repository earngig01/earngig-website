<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Result | EarnGig</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    .payment-result-page {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .payment-result-card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      border-radius: 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .payment-result-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 42px;
      font-weight: 800;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
    }

    .payment-result-icon.failed {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }

    .payment-result-card h1 {
      margin: 0 0 14px;
      font-size: 30px;
    }

    .payment-result-card p {
      margin: 0 auto 24px;
      max-width: 430px;
      line-height: 1.7;
      opacity: 0.82;
    }

    .payment-result-plan {
      margin: 18px 0 28px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 14px;
    }

    .payment-result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .payment-result-actions a {
      width: 100%;
    }

    .payment-result-loading {
      opacity: 0.75;
    }

  </style>

</head>


<body>


<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >

      <span class="logo-mark">
        E
      </span>

      Earn<span>Gig</span>

    </a>


    <nav>

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="tasks.html">
        Tasks
      </a>

      <a href="read-and-earn.html">
        Read & Earn
      </a>

    </nav>


    <a
      class="btn outline"
      href="profile.html"
    >
      My Profile
    </a>

  </div>

</header>



<main class="payment-result-page">

  <div
    id="payment-result-card"
    class="payment-result-card"
  >

    <div
      id="payment-result-icon"
      class="payment-result-icon"
    >
      ✓
    </div>


    <h1 id="payment-result-title">
      Payment Successful
    </h1>


    <p id="payment-result-message">
      Your membership payment has been confirmed.
    </p>


    <div
      id="payment-result-plan"
      class="payment-result-plan"
    >
      Your membership is now active.
    </div>


    <div class="payment-result-actions">

      <a
        id="dashboard-button"
        class="btn primary"
        href="dashboard.html"
      >
        Go to Dashboard
      </a>


      <a
        class="btn outline"
        href="membership.html"
      >
        View Membership
      </a>

    </div>

  </div>

</main>



<footer>

  <div class="container copy">

    © 2026 EarnGig.
    All rights reserved.

  </div>

</footer>



<script>

  const params =
    new URLSearchParams(
      window.location.search
    );


  const result =
    params.get("status");


  const plan =
    params.get("plan");


  const message =
    params.get("message");


  const card =
    document.getElementById(
      "payment-result-card"
    );


  const icon =
    document.getElementById(
      "payment-result-icon"
    );


  const title =
    document.getElementById(
      "payment-result-title"
    );


  const resultMessage =
    document.getElementById(
      "payment-result-message"
    );


  const planBox =
    document.getElementById(
      "payment-result-plan"
    );


  if (
    result ===
    "failed"
  ) {

    icon.textContent =
      "!";

    icon.classList.add(
      "failed"
    );

    title.textContent =
      "Payment Failed";

    resultMessage.textContent =
      message ||
      "We could not confirm your membership payment.";

    planBox.textContent =
      "Please return to the membership page and try again.";

  }


  else {

    icon.textContent =
      "✓";

    title.textContent =
      "Payment Successful";

    resultMessage.textContent =
      "Your payment has been confirmed successfully.";

    if (plan) {

      const planName =
        plan.charAt(0).toUpperCase() +
        plan.slice(1);

      planBox.textContent =
        `Your ${planName} membership is now active.`;

    } else {

      planBox.textContent =
        "Your membership is now active.";

    }

  }

</script>


</body>

</html>
