<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <a class="btn outline" href="index.html">
      Back to Home
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">E</span>
    </div>

    <span class="eyebrow">JOIN EARNGIG</span>

    <h1>Create your account</h1>

    <p class="auth-subtitle">
      Create your account and start exploring EarnGig.
    </p>


    <form>

      <label for="fullname">
        Full Name
      </label>

      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        required
      >


      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="08012345678"
        required
      >


      <label for="referral">
        Referral Code
        <span style="font-weight:400;color:#78909d;">
          (Optional)
        </span>
      </label>

      <input
        type="text"
        id="referral"
        name="referral"
        placeholder="Enter referral code"
      >


      <label for="password">
        Create Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a strong password"
        required
      >


      <label for="confirm-password">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirm-password"
        name="confirm-password"
        placeholder="Confirm your password"
        required
      >


      <label class="remember">

        <input
          type="checkbox"
          required
        >

        I agree to the EarnGig
        <a href="#">Terms</a>
        and
        <a href="#">Privacy Policy</a>.

      </label>


      <button
        type="submit"
        class="btn primary auth-button"
      >
        Create Account
      </button>

    </form>


    <div class="auth-divider">
      <span>ALREADY A MEMBER?</span>
    </div>


    <p class="signup-text">

      <a href="login.html">
        Login to your account
      </a>

    </p>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig. All rights reserved.
  </div>

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
  <script>
  const registerForm = document.querySelector("form");

  registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullname =
      document.getElementById("fullname").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const referral =
      document.getElementById("referral").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirm-password").value;


    if (password !== confirmPassword) {

      alert("Passwords do not match.");

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullname,
            phone: phone,
            referral_code: referral || null
          }
        }
      });


    if (error) {

      console.error("Registration error:", error);

      alert(error.message);

      return;
    }


    alert(
      "Account created! Please check your email and click the verification link before logging in."
    );

    window.location.href = "login.html";

  });
  </script>
  
</body>
</html>
