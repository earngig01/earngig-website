<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | EarnGig</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="container nav">

    <a class="logo" href="index.html">
      <span class="logo-mark">E</span>
      Earn<span>Gig</span>
    </a>

    <a class="btn outline" href="index.html">
      Back to Home
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">E</span>
    </div>

    <span class="eyebrow">JOIN EARNGIG</span>

    <h1>Create your account</h1>

    <p class="auth-subtitle">
      Create your account and complete your ₦9,000 membership payment.
    </p>


    <form id="registerForm">

      <label for="fullname">
        Full Name
      </label>

      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        required
      >


      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="08012345678"
        required
      >


      <label for="referral">
        Referral Code
        <span style="font-weight:400;color:#78909d;">
          (Optional)
        </span>
      </label>

      <input
        type="text"
        id="referral"
        name="referral"
        placeholder="Enter referral code"
      >


      <label for="password">
        Create Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a strong password"
        required
      >


      <label for="confirm-password">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirm-password"
        name="confirm-password"
        placeholder="Confirm your password"
        required
      >


      <label class="remember">

        <input
          type="checkbox"
          id="terms"
          required
        >

        I agree to the EarnGig
        <a href="#">Terms</a>
        and
        <a href="#">Privacy Policy</a>.

      </label>


      <button
        type="submit"
        class="btn primary auth-button"
        id="registerButton"
      >
        Create Account & Continue to Payment
      </button>

    </form>


    <div
      id="paymentNotice"
      style="
        display:none;
        margin-top:18px;
        padding:14px;
        border-radius:12px;
        background:rgba(124,58,237,0.12);
        border:1px solid rgba(139,92,246,0.25);
        color:#cfc8e8;
        font-size:14px;
        line-height:1.5;
        text-align:center;
      "
    ></div>


    <div class="auth-divider">
      <span>ALREADY A MEMBER?</span>
    </div>


    <p class="signup-text">

      <a href="login.html">
        Login to your account
      </a>

    </p>

  </div>

</main>


<footer>

  <div class="container copy">
    © 2026 EarnGig. All rights reserved.
  </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

  const registerForm =
    document.getElementById("registerForm");

  const registerButton =
    document.getElementById("registerButton");

  const paymentNotice =
    document.getElementById("paymentNotice");

  const referralInput =
    document.getElementById("referral");


  /*
   * Automatically fill referral code
   * when the visitor arrives through
   * a referral link.
   */
  const urlParams =
    new URLSearchParams(window.location.search);

  const referralFromUrl =
    urlParams.get("ref");

  if (referralFromUrl) {
    referralInput.value =
      referralFromUrl.toUpperCase();
  }


  function showNotice(message) {

    paymentNotice.textContent =
      message;

    paymentNotice.style.display =
      "block";
  }


  function hideNotice() {

    paymentNotice.textContent = "";

    paymentNotice.style.display =
      "none";
  }


  async function startMembershipPayment() {

    /*
     * Get the currently authenticated
     * EarnGig session.
     */
    const {
      data: {
        session
      },
      error: sessionError
    } = await supabaseClient.auth.getSession();


    if (sessionError) {

      throw new Error(
        "Unable to confirm your account session."
      );
    }


    /*
     * If email confirmation is enabled
     * in Supabase, signUp may return no
     * active session.
     */
    if (!session) {

      throw new Error(
        "Your account was created, but EarnGig requires email verification before payment. Please check your email, verify your account, then log in to continue with the ₦9,000 membership payment."
      );
    }


    /*
     * Ask our secure Edge Function to
     * create the ₦9,000 Flutterwave
     * checkout.
     */
    const response =
      await fetch(
        "https://ytvtdelwefykeqwztcyo.supabase.co/functions/v1/flutterwave-payment",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${session.access_token}`
          },

          body: JSON.stringify({
            action: "initialize",
            payment_type: "membership",
            membership_stage: "initial"
          })
        }
      );


    const result =
      await response.json();


    if (!response.ok || !result?.success) {

      throw new Error(
        result?.error ||
        "Unable to start Flutterwave payment."
      );
    }


    if (!result.payment_url) {

      throw new Error(
        "Flutterwave did not return a payment link."
      );
    }


    /*
     * Send the customer to Flutterwave.
     */
    window.location.href =
      result.payment_url;
  }


  registerForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      hideNotice();


      const fullname =
        document
          .getElementById("fullname")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const referral =
        document
          .getElementById("referral")
          .value
          .trim()
          .toUpperCase();


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirm-password")
          .value;


      if (password !== confirmPassword) {

        alert(
          "Passwords do not match."
        );

        return;
      }


      if (password.length < 6) {

        alert(
          "Password must be at least 6 characters."
        );

        return;
      }


      /*
       * Prevent double submission.
       */
      registerButton.disabled =
        true;

      registerButton.textContent =
        "Creating Account...";


      try {

        /*
         * Create the Supabase account.
         */
        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              emailRedirectTo:
                "https://earngig01.github.io/earngig-website/login.html",

              data: {
                full_name: fullname,
                phone: phone,
                referral_code:
                  referral || null
              }

            }

          });


        if (error) {

          console.error(
            "Registration error:",
            error
          );

          throw new Error(
            error.message
          );
        }


        /*
         * Supabase may return an existing
         * session when email confirmation
         * is disabled.
         */
        if (data?.session) {

          registerButton.textContent =
            "Starting Payment...";

          showNotice(
            "Account created. Redirecting you to the secure ₦9,000 Flutterwave membership payment..."
          );


          await startMembershipPayment();

          return;
        }


        /*
         * If email confirmation is enabled,
         * Supabase normally returns a user
         * but no session.
         */
        registerButton.disabled =
          false;

        registerButton.textContent =
          "Create Account & Continue to Payment";


        showNotice(
          "Your account has been created. Please check your email and click the verification link. After verification, log in to continue with your ₦9,000 membership payment."
        );

        alert(
          "Account created successfully. Please check your email and verify your account before continuing to payment."
        );


      } catch (error) {

        console.error(
          "EarnGig registration/payment error:",
          error
        );


        registerButton.disabled =
          false;

        registerButton.textContent =
          "Create Account & Continue to Payment";


        showNotice(
          error?.message ||
          "Something went wrong. Please try again."
        );

      }

    }
  );

</script>

</body>
</html>
