<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seller Dashboard - EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b2b;
      color: #fff;
    }

    header {
      background: #0c1240;
      border-bottom: 1px solid #292f67;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .brand span {
      color: #6d5dfc;
    }

    .header-btn {
      background: transparent;
      border: 1px solid #41487e;
      color: #fff;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 22px 16px 50px;
    }

    .store-header {
      background: #101640;
      border: 1px solid #292f67;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .store-logo {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      object-fit: cover;
      background: #080d30;
      border: 1px solid #343b76;
    }

    .store-info h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .store-info p {
      margin: 3px 0;
      color: #9da5d4;
      font-size: 13px;
    }

    .store-link {
      margin-top: 7px;
      color: #9d91ff;
      font-size: 13px;
      word-break: break-all;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: #111746;
      border: 1px solid #292f67;
      border-radius: 14px;
      padding: 15px;
    }

    .stat-label {
      color: #9098c5;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
    }

    .section {
      background: #0f143b;
      border: 1px solid #292f67;
      border-radius: 17px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .section-header {
      padding: 16px 17px;
      border-bottom: 1px solid #292f67;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-body {
      padding: 17px;
    }

    .fulfillment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .option {
      background: #111746;
      border: 1px solid #343b76;
      border-radius: 13px;
      padding: 15px;
      cursor: pointer;
      transition: .15s;
    }

    .option.selected {
      border-color: #7566ff;
      background: #171d4d;
    }

    .option input {
      width: 18px;
      height: 18px;
      accent-color: #6757f5;
      vertical-align: middle;
      margin-right: 7px;
    }

    .option-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .option-description {
      color: #8f97c4;
      font-size: 12px;
      line-height: 1.5;
    }

    .field {
      margin-top: 13px;
    }

    .field label {
      display: block;
      color: #aeb5d9;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      background: #080d30;
      border: 1px solid #363d78;
      color: #fff;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #6757f5;
    }

    .save-btn {
      margin-top: 16px;
      width: 100%;
      background: #6757f5;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }

    .notice.success {
      display: block;
      background: #123d2d;
      color: #6ee7b7;
    }

    .notice.error {
      display: block;
      background: #421d2a;
      color: #ff9db1;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .product {
      background: #111746;
      border: 1px solid #292f67;
      border-radius: 13px;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #080d30;
    }

    .product-body {
      padding: 12px;
    }

    .product-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .product-price {
      color: #a79dff;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-meta {
      color: #858dbb;
      font-size: 12px;
    }

    .orders {
      display: grid;
      gap: 10px;
    }

    .order {
      background: #111746;
      border: 1px solid #292f67;
      border-radius: 12px;
      padding: 13px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .order-number {
      font-weight: 700;
    }

    .order-status {
      color: #a79dff;
      font-size: 12px;
    }

    .order-info {
      margin-top: 7px;
      color: #9098c5;
      font-size: 12px;
    }

    .order-btn {
      margin-top: 10px;
      background: #202653;
      border: 1px solid #41487e;
      color: #fff;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .empty {
      color: #858dbb;
      text-align: center;
      padding: 25px;
    }

    .loading {
      color: #9da5d4;
      padding: 25px;
      text-align: center;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .fulfillment-options {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }

      .store-header {
        align-items: flex-start;
      }

      .store-logo {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    Earn<span>Gig</span> Seller
  </div>

  <button
    class="header-btn"
    onclick="location.href='dashboard.html'"
  >
    ← Account
  </button>

</header>


<main>

  <div id="pageContent">
    <div class="loading">
      Loading seller dashboard...
    </div>
  </div>

</main>


<script>

  const SUPABASE_URL =
    "https://ytvtdelwefykeqwztcyo.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CLTeqgEB6JSQ7Kqq6rQARw_RV31Ccg3";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let currentUser = null;
  let currentStore = null;


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function money(value) {

    return "₦" + Number(value || 0)
      .toLocaleString("en-NG");
  }


  async function getCurrentUser() {

    const {
      data: {
        user
      },
      error
    } =
      await supabaseClient.auth.getUser();

    if (error || !user) {

      location.href = "login.html";

      return null;
    }

    return user;
  }


  async function loadStore() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("marketplace_stores")
        .select("*")
        .eq("vendor_id", currentUser.id)
        .maybeSingle();


    if (error) {
      throw error;
    }

    if (!data) {

      location.href =
        "vendor-application.html";

      return null;
    }


    if (data.status !== "active") {

      document.getElementById("pageContent")
        .innerHTML = `
          <section class="section">
            <div class="section-body">
              <h2>Store Not Active</h2>
              <p style="color:#9da5d4;">
                Your marketplace store is not active yet.
              </p>
            </div>
          </section>
        `;

      return null;
    }


    currentStore = data;

    return data;
  }


  async function checkSubscription() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("marketplace_store_subscriptions")
        .select("*")
        .eq("store_id", currentStore.id)
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        })
        .limit(1)
        .maybeSingle();


    if (error) {
      throw error;
    }

    return !!data;
  }


  async function loadProducts() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("marketplace_products")
        .select(`
          id,
          title,
          price,
          category,
          stock_quantity,
          status,
          marketplace_product_images (
            image_url,
            is_primary,
            sort_order
          )
        `)
        .eq("store_id", currentStore.id)
        .order("created_at", {
          ascending: false
        });


    if (error) {
      throw error;
    }

    return data || [];
  }


  async function loadOrders() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("marketplace_store_orders")
        .select(`
          id,
          order_number,
          total_amount,
          payment_status,
          order_status,
          fulfillment_method,
          created_at
        `)
        .eq("vendor_id", currentUser.id)
        .order("created_at", {
          ascending: false
        })
        .limit(10);


    if (error) {
      throw error;
    }

    return data || [];
  }


  async function loadStats() {

    const {
      data: orders,
      error: ordersError
    } =
      await supabaseClient
        .from("marketplace_store_orders")
        .select(
          "total_amount, order_status, vendor_credited_at"
        )
        .eq("vendor_id", currentUser.id);


    if (ordersError) {
      throw ordersError;
    }


    let totalSales = 0;
    let pending = 0;
    let available = 0;


    (orders || []).forEach(order => {

      const amount =
        Number(order.total_amount || 0);


      if (
        [
          "paid_pending_fulfillment",
          "sent",
          "dispatched",
          "delivered"
        ].includes(order.order_status)
      ) {
        totalSales += amount;
      }


      if (!order.vendor_credited_at) {
        pending += amount;
      } else {
        available += amount;
      }

    });


    return {
      totalSales,
      pending,
      available
    };
  }


  function productImage(product) {

    const images =
      product.marketplace_product_images || [];


    if (!images.length) {
      return "";
    }


    const sorted =
      [...images].sort((a, b) => {

        if (
          a.is_primary &&
          !b.is_primary
        ) {
          return -1;
        }

        if (
          !a.is_primary &&
          b.is_primary
        ) {
          return 1;
        }

        return (
          Number(a.sort_order || 0) -
          Number(b.sort_order || 0)
        );

      });


    return sorted[0].image_url || "";
  }


  function renderDashboard(
    subscriptionActive,
    products,
    orders,
    stats
  ) {

    const storeLogo =
      currentStore.store_logo_url ||
      "https://via.placeholder.com/100";


    const location =
      currentStore.location_display ||
      [
        currentStore.business_city,
        currentStore.business_lga,
        currentStore.business_state
      ]
      .filter(Boolean)
      .join(", ") ||
      "Location not set";


    const storeUrl =
      `${location.origin}/store.html?store=${
        encodeURIComponent(
          currentStore.store_slug
        )
      }`;


    document.getElementById("pageContent")
      .innerHTML = `

        <!-- STORE HEADER -->

        <section class="store-header">

          <img
            class="store-logo"
            src="${escapeHtml(storeLogo)}"
            alt="Store logo"
          >

          <div class="store-info">

            <h1>
              ${escapeHtml(currentStore.store_name)}
            </h1>

            <p>
              📍 ${escapeHtml(location)}
            </p>

            <p>
              ${
                currentStore.accepts_delivery
                  ? "🚚 Delivery"
                  : ""
              }

              ${
                currentStore.accepts_delivery &&
                currentStore.accepts_pickup
                  ? " &nbsp; "
                  : ""
              }

              ${
                currentStore.accepts_pickup
                  ? "📦 Pickup"
                  : ""
              }
            </p>

            <div class="store-link">
              ${escapeHtml(storeUrl)}
            </div>

          </div>

        </section>


        <!-- STATS -->

        <div class="stats">

          <div class="stat">
            <div class="stat-label">
              Total Sales
            </div>
            <div class="stat-value">
              ${money(stats.totalSales)}
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              Pending Earnings
            </div>
            <div class="stat-value">
              ${money(stats.pending)}
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              Available Earnings
            </div>
            <div class="stat-value">
              ${money(stats.available)}
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              Products
            </div>
            <div class="stat-value">
              ${products.length}
            </div>
          </div>

        </div>


        <!-- FULFILLMENT SETTINGS -->

        <section class="section">

          <div class="section-header">

            <h2>
              Order Fulfillment
            </h2>

          </div>

          <div class="section-body">

            <p style="
              color:#9da5d4;
              font-size:13px;
              line-height:1.5;
              margin-top:0;
            ">
              Choose how customers can receive
              products from your store.
            </p>


            <div class="fulfillment-options">

              <label
                class="option ${
                  currentStore.accepts_delivery
                    ? "selected"
                    : ""
                }"
                id="deliveryOption"
              >

                <div class="option-title">

                  <input
                    type="checkbox"
                    id="acceptsDelivery"
                    ${
                      currentStore.accepts_delivery
                        ? "checked"
                        : ""
                    }
                  >

                  🚚 Delivery
                </div>

                <div class="option-description">
                  Customers can have their orders
                  delivered to them.
                </div>

              </label>


              <label
                class="option ${
                  currentStore.accepts_pickup
                    ? "selected"
                    : ""
                }"
                id="pickupOption"
              >

                <div class="option-title">

                  <input
                    type="checkbox"
                    id="acceptsPickup"
                    ${
                      currentStore.accepts_pickup
                        ? "checked"
                        : ""
                    }
                  >

                  📦 Customer Pickup
                </div>

                <div class="option-description">
                  Customers can collect their
                  orders from your designated
                  pickup location.
                </div>

              </label>

            </div>


            <div
              id="pickupFields"
              style="
                display:${
                  currentStore.accepts_pickup
                    ? "block"
                    : "none"
                };
              "
            >

              <div class="field">

                <label>
                  Pickup Location
                </label>

                <input
                  id="pickupLocation"
                  value="${escapeHtml(
                    currentStore.pickup_location || ""
                  )}"
                  placeholder="Example: Awka Main Market"
                >

              </div>


              <div class="field">

                <label>
                  Pickup Instructions
                </label>

                <textarea
                  id="pickupInstructions"
                  placeholder="Tell customers where and how to collect their order."
                >${escapeHtml(
                  currentStore.pickup_instructions || ""
                )}</textarea>

              </div>

            </div>


            <button
              class="save-btn"
              id="saveFulfillment"
            >
              Save Fulfillment Settings
            </button>

            <div
              class="notice"
              id="fulfillmentNotice"
            ></div>

          </div>

        </section>


        <!-- PRODUCTS -->

        <section class="section">

          <div class="section-header">

            <h2>
              Your Products
            </h2>

            <button
              class="header-btn"
              onclick="location.href='create-listing.html'"
            >
              + Add Product
            </button>

          </div>

          <div class="section-body">

            ${
              products.length

              ? `
                <div class="products">

                  ${products.map(product => {

                    const image =
                      productImage(product);

                    return `
                      <div class="product">

                        ${
                          image
                            ? `
                              <img
                                class="product-image"
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.title)}"
                              >
                            `
                            : `
                              <div
                                class="product-image"
                                style="
                                  display:flex;
                                  align-items:center;
                                  justify-content:center;
                                  color:#858dbb;
                                "
                              >
                                No Image
                              </div>
                            `
                        }

                        <div class="product-body">

                          <div class="product-title">
                            ${escapeHtml(product.title)}
                          </div>

                          <div class="product-price">
                            ${money(product.price)}
                          </div>

                          <div class="product-meta">
                            ${escapeHtml(product.category)}
                            · Stock:
                            ${product.stock_quantity}
                            · ${escapeHtml(product.status)}
                          </div>

                        </div>

                      </div>
                    `;

                  }).join("")}

                </div>
              `

              : `
                <div class="empty">
                  You have not added any products yet.
                </div>
              `
            }

          </div>

        </section>


        <!-- ORDERS -->

        <section class="section">

          <div class="section-header">

            <h2>
              Recent Orders
            </h2>

          </div>

          <div class="section-body">

            ${
              orders.length

              ? `
                <div class="orders">

                  ${orders.map(order => `
                    <div class="order">

                      <div class="order-top">

                        <div class="order-number">
                          ${escapeHtml(order.order_number)}
                        </div>

                        <div class="order-status">
                          ${escapeHtml(
                            order.order_status
                          )}
                        </div>

                      </div>

                      <div class="order-info">
                        ${money(order.total_amount)}
                        ·
                        ${
                          order.fulfillment_method
                            ? escapeHtml(
                                order.fulfillment_method
                              )
                            : "Fulfillment not selected"
                        }
                      </div>

                      <button
                        class="order-btn"
                        onclick="
                          location.href=
                          'vendor-order-detail.html?id=${order.id}'
                        "
                      >
                        View Order
                      </button>

                    </div>
                  `).join("")}

                </div>
              `

              : `
                <div class="empty">
                  No marketplace orders yet.
                </div>
              `
            }

          </div>

        </section>

      `;


    document
      .getElementById("acceptsDelivery")
      .addEventListener(
        "change",
        updateFulfillmentVisuals
      );


    document
      .getElementById("acceptsPickup")
      .addEventListener(
        "change",
        updateFulfillmentVisuals
      );


    document
      .getElementById("saveFulfillment")
      .addEventListener(
        "click",
        saveFulfillment
      );
  }


  function updateFulfillmentVisuals() {

    const delivery =
      document.getElementById(
        "acceptsDelivery"
      );

    const pickup =
      document.getElementById(
        "acceptsPickup"
      );


    document
      .getElementById("deliveryOption")
      .classList.toggle(
        "selected",
        delivery.checked
      );


    document
      .getElementById("pickupOption")
      .classList.toggle(
        "selected",
        pickup.checked
      );


    document
      .getElementById("pickupFields")
      .style.display =
        pickup.checked
          ? "block"
          : "none";
  }


  async function saveFulfillment() {

    const delivery =
      document.getElementById(
        "acceptsDelivery"
      ).checked;

    const pickup =
      document.getElementById(
        "acceptsPickup"
      ).checked;


    const notice =
      document.getElementById(
        "fulfillmentNotice"
      );


    if (!delivery && !pickup) {

      notice.className =
        "notice error";

      notice.textContent =
        "Please select Delivery, Pickup, or both.";

      return;
    }


    const pickupLocation =
      document.getElementById(
        "pickupLocation"
      ).value.trim();


    const pickupInstructions =
      document.getElementById(
        "pickupInstructions"
      ).value.trim();


    if (
      pickup &&
      !pickupLocation
    ) {

      notice.className =
        "notice error";

      notice.textContent =
        "Please provide your pickup location.";

      return;
    }


    const button =
      document.getElementById(
        "saveFulfillment"
      );


    button.disabled = true;
    button.textContent = "Saving...";


    const {
      error
    } = await supabaseClient
      .from("marketplace_stores")
      .update({

        accepts_delivery:
          delivery,

        accepts_pickup:
          pickup,

        pickup_location:
          pickup
            ? pickupLocation
            : null,

        pickup_instructions:
          pickup
            ? pickupInstructions || null
            : null,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentStore.id
      )
      .eq(
        "vendor_id",
        currentUser.id
      );


    button.disabled = false;
    button.textContent =
      "Save Fulfillment Settings";


    if (error) {

      console.error(error);

      notice.className =
        "notice error";

      notice.textContent =
        "Could not save settings: " +
        error.message;

      return;
    }


    currentStore.accepts_delivery =
      delivery;

    currentStore.accepts_pickup =
      pickup;

    currentStore.pickup_location =
      pickup
        ? pickupLocation
        : null;

    currentStore.pickup_instructions =
      pickup
        ? pickupInstructions || null
        : null;


    notice.className =
      "notice success";

    notice.textContent =
      "Fulfillment settings saved successfully.";

  }


  async function init() {

    try {

      currentUser =
        await getCurrentUser();

      if (!currentUser) {
        return;
      }


      const store =
        await loadStore();

      if (!store) {
        return;
      }


      const subscriptionActive =
        await checkSubscription();


      if (!subscriptionActive) {

        location.href =
          "marketplace-subscription.html";

        return;
      }


      const [
        products,
        orders,
        stats
      ] = await Promise.all([
        loadProducts(),
        loadOrders(),
        loadStats()
      ]);


      renderDashboard(
        subscriptionActive,
        products,
        orders,
        stats
      );


    } catch (error) {

      console.error(error);

      document.getElementById("pageContent")
        .innerHTML = `
          <section class="section">
            <div class="section-body">

              <h2>
                Something went wrong
              </h2>

              <p style="color:#ff9db1;">
                ${escapeHtml(error.message)}
              </p>

            </div>
          </section>
        `;
    }

  }


  init();

</script>

</body>
</html>
