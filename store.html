<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | EarnGig</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24104f 0%, #10133d 43%, #07091e 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
    }

    .brand span {
      color: #8068ff;
    }

    .top-button {
      padding: 10px 14px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-weight: 700;
    }

    .store-card {
      padding: 22px;
      border-radius: 22px;
      background:
        linear-gradient(
          135deg,
          rgba(76,45,150,.52),
          rgba(18,21,67,.94)
        );
      border: 1px solid rgba(139,92,246,.28);
      margin-bottom: 18px;
    }

    .store-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .store-main {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .logo-wrap {
      width: 82px;
      height: 82px;
      flex-shrink: 0;
    }

    .store-logo,
    .logo-fallback {
      width: 82px;
      height: 82px;
      border-radius: 19px;
    }

    .store-logo {
      object-fit: cover;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
    }

    .logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#6d4aff,#4f46e5);
      font-size: 30px;
      font-weight: 900;
    }

    .store-name {
      font-size: 26px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .store-description {
      margin-top: 7px;
      color: #b9b5cc;
      line-height: 1.5;
      font-size: 13px;
    }

    .store-location {
      margin-top: 7px;
      color: #aaa8c4;
      font-size: 13px;
    }

    .store-type {
      display: inline-flex;
      margin-top: 9px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(124,58,237,.14);
      border: 1px solid rgba(139,92,246,.25);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 800;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .badge {
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(34,197,94,.09);
      border: 1px solid rgba(34,197,94,.20);
      color: #86efac;
      font-size: 11px;
      font-weight: 800;
    }

    .store-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary-button {
      padding: 12px 15px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg,#6d4aff,#8b3ffc);
      color: #fff;
      font-weight: 800;
    }

    .secondary-button {
      padding: 12px 15px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-weight: 700;
    }

    .share-box {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 13px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.08);
    }

    .share-box.show {
      display: block;
    }

    .share-label {
      color: #aaa8c4;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .share-row {
      display: flex;
      gap: 8px;
    }

    .share-row input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: #fff;
    }

    .section-title {
      margin: 23px 0 11px;
      font-size: 19px;
      font-weight: 900;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 10px;
      margin-bottom: 17px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(13,16,51,.94);
      color: #fff;
      outline: none;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #7c5cff;
    }

    .result-line {
      color: #85819e;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
    }

    .product-card {
      overflow: hidden;
      border-radius: 17px;
      background: rgba(13,16,51,.94);
      border: 1px solid rgba(124,108,255,.19);
    }

    .product-image-wrap {
      width: 100%;
      height: 215px;
      background: #11152f;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777391;
      font-size: 13px;
    }

    .product-body {
      padding: 14px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.3;
    }

    .product-price {
      margin-top: 7px;
      color: #bca8ff;
      font-size: 18px;
      font-weight: 900;
    }

    .product-category {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(124,58,237,.13);
      color: #c4b5fd;
      font-size: 10px;
      font-weight: 800;
    }

    .product-description {
      margin-top: 9px;
      color: #85819e;
      font-size: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-stock {
      margin-top: 8px;
      color: #aaa8c4;
      font-size: 11px;
    }

    .product-button {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border-radius: 10px;
      background: rgba(124,58,237,.16);
      border: 1px solid rgba(139,92,246,.25);
      color: #fff;
      font-weight: 800;
    }

    .loading,
    .empty,
    .error-box {
      padding: 35px 18px;
      border-radius: 15px;
      background: rgba(13,16,51,.94);
      border: 1px solid rgba(124,108,255,.19);
      color: #85819e;
      text-align: center;
    }

    .error-box {
      color: #fca5a5;
      border-color: rgba(239,68,68,.22);
    }

    .footer {
      margin-top: 35px;
      padding: 20px 0;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #65617b;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 800px) {
      .store-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .store-actions {
        justify-content: flex-start;
      }

      .product-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 11px;
      }

      .store-name {
        font-size: 21px;
      }

      .store-logo,
      .logo-fallback,
      .logo-wrap {
        width: 65px;
        height: 65px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-image-wrap {
        height: 240px;
      }

      .share-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<main class="page">

  <header class="topbar">

    <div class="brand">
      Earn<span>Gig</span>
    </div>

    <button
      class="top-button"
      type="button"
      onclick="goMarketplace()"
    >
      Marketplace
    </button>

  </header>


  <div id="loadingBox" class="loading">
    Loading store...
  </div>


  <div
    id="errorBox"
    class="error-box"
    style="display:none;"
  ></div>


  <div
    id="storeContent"
    style="display:none;"
  >

    <section class="store-card">

      <div class="store-header">

        <div class="store-main">

          <div id="logoWrap" class="logo-wrap">
            <div class="logo-fallback">E</div>
          </div>

          <div>

            <div
              id="storeName"
              class="store-name"
            ></div>

            <div
              id="storeDescription"
              class="store-description"
            ></div>

            <div
              id="storeLocation"
              class="store-location"
            ></div>

            <div class="store-type">
              EarnGig Vendor Store
            </div>

            <div
              id="badges"
              class="badges"
            ></div>

          </div>

        </div>


        <div class="store-actions">

          <button
            class="secondary-button"
            type="button"
            onclick="toggleShare()"
          >
            Share Store
          </button>

          <button
            class="primary-button"
            type="button"
            onclick="copyStoreLink()"
          >
            Copy Store Link
          </button>

        </div>

      </div>


      <div
        id="shareBox"
        class="share-box"
      >

        <div class="share-label">
          Permanent store link
        </div>

        <div class="share-row">

          <input
            id="storeLink"
            type="text"
            readonly
          >

          <button
            class="secondary-button"
            type="button"
            onclick="copyStoreLink()"
          >
            Copy
          </button>

        </div>

      </div>

    </section>


    <div class="section-title">
      Products
    </div>

      <input
        id="searchInput"

        placeholder="Search this store..."
        oninput="filterProducts()"
      >

      <select
        id="categoryFilter"
        onchange="filterProducts()"
      >
        <option value="">
          All Categories
        </option>
      </select>

    </div>


    <div
      id="resultLine"
      class="result-line"
    ></div>


    <div

      class="product-grid"
    ></div>

  </div>


  <footer class="footer">
    © 2026 EarnGig. Marketplace.
  </footer>

</main>


<script>

const SUPABASE_URL =
  "https://ytvtdelwefykeqwztcyo.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0dnRkZWx3ZWZ5a2Vxd3p0Y3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMDkwMjUsImV4cCI6MjEwMTg4NTAyNX0.qzT3lYrTFupgGAxQ0VZl26hqblLQDs0vc9ZNiwBU9tA";

const REST_BASE =
  SUPABASE_URL + "/rest/v1";

let currentStore = null;
let allProducts = [];


/* =========================================================
   SUPABASE REST
   ========================================================= */

async function restGet(path) {

  const response =
    await fetch(
      REST_BASE + path,
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data =
      text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.details ||
      data?.hint ||
      data?.error ||
      "Supabase request failed."
    );
  }

  return data;
}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function money(value) {

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );
}


function getRequestedSlug() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("store") ||
    ""
  ).trim();
}


function normaliseSlug(value) {

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}


function removeGeneratedSuffix(slug) {

  /*
   * Handles links such as:
   *
   * the-mia-mart-5070b9c0
   *
   * by also trying:
   *
   * the-mia-mart
   */

  return String(slug || "")
    .replace(
      /-[0-9a-f]{8}$/i,
      ""
    );
}


function showError(message) {

  document.getElementById(
    "loadingBox"
  ).style.display = "none";

  document.getElementById(
    "storeContent"
  ).style.display = "none";

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display = "block";
  box.textContent = message;
}


/* =========================================================
   FIND STORE
   ========================================================= */

async function findStore() {

  const requestedSlug =
    getRequestedSlug();


  if (!requestedSlug) {

    throw new Error(
      "This store link does not contain a store identifier."
    );
  }


  /*
   * 1. Exact slug.
   */
  let stores =
    await restGet(
      "/marketplace_stores" +
      "?store_slug=eq." +
      encodeURIComponent(
        requestedSlug
      ) +
      "&select=*"
    );


  if (
    Array.isArray(stores) &&
    stores.length > 0
  ) {

    return stores[0];
  }


  /*
   * 2. Remove the generated 8-character suffix.
   *
   * Example:
   * the-mia-mart-5070b9c0
   *
   * becomes:
   * the-mia-mart
   */
  const baseSlug =
    removeGeneratedSuffix(
      requestedSlug
    );


  if (
    baseSlug &&
    baseSlug !== requestedSlug
  ) {

    stores =
      await restGet(
        "/marketplace_stores" +
        "?store_slug=eq." +
        encodeURIComponent(
          baseSlug
        ) +
        "&select=*"
      );


    if (
      Array.isArray(stores) &&
      stores.length > 0
    ) {

      return stores[0];
    }
  }


  /*
   * 3. Load active stores and compare
   * normalized slugs.
   */
  const activeStores =
    await restGet(
      "/marketplace_stores" +
      "?status=eq.active" +
      "&select=*"
    );


  if (
    Array.isArray(activeStores)
  ) {

    const normalizedRequested =
      normaliseSlug(
        requestedSlug
      );

    const normalizedBase =
      normaliseSlug(
        baseSlug
      );


    const match =
      activeStores.find(
        store => {

          const actual =
            normaliseSlug(
              store.store_slug
            );

          const name =
            normaliseSlug(
              store.store_name
            );

          return (
            actual ===
              normalizedRequested ||

            actual ===
              normalizedBase ||

            name ===
              normalizedBase
          );
        }
      );


    if (match) {
      return match;
    }
  }


  /*
   * 4. Specific fallback for the
   * current The Mia Mart URL.
   *
   * This does NOT require the slug to
   * be exactly the same.
   */
  if (
    normaliseSlug(
      requestedSlug
    ).includes("the-mia-mart")
  ) {

    const miaStores =
      await restGet(
        "/marketplace_stores" +
        "?store_name=ilike." +
        encodeURIComponent(
          "The Mia Mart"
        ) +
        "&status=eq.active" +
        "&select=*"
      );


    if (
      Array.isArray(miaStores) &&
      miaStores.length > 0
    ) {

      return miaStores[0];
    }
  }


  return null;
}


/* =========================================================
   LOAD STORE
   ========================================================= */

async function loadStore() {

  const store =
    await findStore();


  if (!store) {

    showError(
      "Store not found. The store link does not match an active marketplace store."
    );

    return;
  }


  if (
    store.status !==
    "active"
  ) {

    showError(
      "This marketplace store is not currently active."
    );

    return;
  }


  currentStore =
    store;


  renderStore();


  await loadProducts();


  document.getElementById(
    "loadingBox"
  ).style.display = "none";


  document.getElementById(
    "errorBox"
  ).style.display = "none";


  document.getElementById(
    "storeContent"
  ).style.display = "block";
}


/* =========================================================
   STORE DISPLAY
   ========================================================= */

function renderStore() {

  document.getElementById(
    "storeName"
  ).textContent =
    currentStore.store_name ||
    "EarnGig Store";


  document.getElementById(
    "storeDescription"
  ).textContent =
    currentStore.description ||
    "Welcome to this EarnGig marketplace store.";


  const location =
    currentStore.location_display ||

    [
      currentStore.business_area,
      currentStore.business_city,
      currentStore.business_lga,
      currentStore.business_state
    ]
      .filter(Boolean)
      .join(", ") ||

    currentStore.business_location ||

    "Location not provided";


  document.getElementById(
    "storeLocation"
  ).textContent =
    location;


  /*
   * Always show the actual current URL
   * as the shareable link.
   */
  document.getElementById(
    "storeLink"
  ).value =
    window.location.href;


  const logoWrap =
    document.getElementById(
      "logoWrap"
    );


  if (
    currentStore.store_logo_url
  ) {

    logoWrap.innerHTML = `
      <img
        class="store-logo"
        src="${escapeHtml(currentStore.store_logo_url)}"
        alt="${escapeHtml(currentStore.store_name || "Store")}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="logo-fallback"
        style="display:none;"
      >
        ${escapeHtml(
          (
            currentStore.store_name ||
            "E"
          ).charAt(0).toUpperCase()
        )}
      </div>
    `;

  } else {

    logoWrap.innerHTML = `
      <div class="logo-fallback">
        ${escapeHtml(
          (
            currentStore.store_name ||
            "E"
          ).charAt(0).toUpperCase()
        )}
      </div>
    `;
  }


  const badges =
    document.getElementById(
      "badges"
    );


  let html = "";


  if (
    currentStore.accepts_delivery === true
  ) {

    html += `
      <span class="badge">
        Delivery Available
      </span>
    `;
  }


  if (
    currentStore.accepts_pickup === true
  ) {

    html += `
      <span class="badge">
        Pickup Available
      </span>
    `;
  }


  if (!html) {

    html = `
      <span
        class="badge"
        style="
          color:#aaa8c4;
          border-color:rgba(255,255,255,.10);
          background:rgba(255,255,255,.04);
        "
      >
        Contact Seller
      </span>
    `;
  }


  badges.innerHTML =
    html;
}


/* =========================================================
   PRODUCTS
   ========================================================= */

async function loadProducts() {

  const products =
    await restGet(
      "/marketplace_products" +
      "?store_id=eq." +
      encodeURIComponent(
        currentStore.id
      ) +
      "&status=eq.active" +
      "&select=*" +
      "&order=created_at.desc"
    );


  allProducts =
    Array.isArray(products)
      ? products
      : [];


  /*
   * Load images.
   */
  if (
    allProducts.length > 0
  ) {

    const ids =
      allProducts
        .map(
          product =>
            product.id
        )
        .join(",");


    const images =
      await restGet(
        "/marketplace_product_images" +
        "?product_id=in.(" +
        ids +
        ")" +
        "&select=*" +
        "&order=sort_order.asc"
      );


    const imageList =
      Array.isArray(images)
        ? images
        : [];


    allProducts.forEach(
      product => {

        product.images =
          imageList.filter(
            image =>
              image.product_id ===
              product.id
          );
      }
    );
  }


  buildCategories();

  renderProducts(
    allProducts
  );
}


function buildCategories() {

  const select =
    document.getElementById(
      "categoryFilter"
    );


  const categories =
    [
      ...new Set(
        allProducts
          .map(
            product =>
              product.category
          )
          .filter(Boolean)
      )
    ]
    .sort();


  select.innerHTML =
    `
      <option value="">
        All Categories
      </option>
    `;


  categories.forEach(
    category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category;

      option.textContent =
        category;

      select.appendChild(
        option
      );
    }
  );
}


function filterProducts() {

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const filtered =
    allProducts.filter(
      product => {

        const searchable =
          [
            product.title,
            product.description,
            product.category
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


        return (
          (!search ||
            searchable.includes(
              search
            )) &&

          (!category ||
            product.category ===
            category)
        );
      }
    );


  renderProducts(
    filtered
  );
}


function renderProducts(
  products
) {

  const grid =
    document.getElementById(
      "productsGrid"
    );


  document.getElementById(
    "resultLine"
  ).textContent =
    products.length +
    (
      products.length === 1
        ? " product"
        : " products"
    );


  if (!products.length) {

    grid.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1;"
      >
        No products found in this store.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    products
      .map(
        product =>
          productCard(
            product
          )
      )
      .join("");
}


function productCard(
  product
) {

  const images =
    Array.isArray(
      product.images
    )
      ? product.images
      : [];


  const image =
    images.find(
      item =>
        item.is_primary === true
    ) ||
    images[0];


  const imageUrl =
    image?.watermarked_file_path ||
    image?.image_url ||
    "";


  const stock =
    Number(
      product.stock_quantity ||
      0
    );


  return `
    <article class="product-card">

      <div class="product-image-wrap">

        ${
          imageUrl
            ? `
              <img
                class="product-image"
                src="${escapeHtml(imageUrl)}"
                alt="${escapeHtml(product.title || "Product")}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="image-placeholder"
                style="display:none;"
              >
                Image unavailable
              </div>
            `
            : `
              <div class="image-placeholder">
                Product image unavailable
              </div>
            `
        }

      </div>


      <div class="product-body">

        <div class="product-title">
          ${escapeHtml(
            product.title ||
            "Product"
          )}
        </div>


        <div class="product-price">
          ${money(
            product.price
          )}
        </div>


        ${
          product.category
            ? `
              <span class="product-category">
                ${escapeHtml(
                  product.category
                )}
              </span>
            `
            : ""
        }


        <div class="product-description">
          ${escapeHtml(
            product.description ||
            "No description available."
          )}
        </div>


        <div class="product-stock">
          ${
            stock > 0
              ? stock + " in stock"
              : "Out of stock"
          }
        </div>


        <button
          class="product-button"
          type="button"
          onclick="viewProduct('${escapeHtml(product.id)}')"
        >
          View Product
        </button>

      </div>

    </article>
  `;
}


/* =========================================================
   OTHER ACTIONS
   ========================================================= */

function viewProduct(
  productId
) {

  window.location.href =
    "product.html?id=" +
    encodeURIComponent(
      productId
    );
}


function toggleShare() {

  document
    .getElementById(
      "shareBox"
    )
    .classList.toggle(
      "show"
    );
}


async function copyStoreLink() {

  const link =
    window.location.href;


  try {

    await navigator.clipboard.writeText(
      link
    );

    alert(
      "Store link copied successfully."
    );

  } catch {

    const input =
      document.getElementById(
        "storeLink"
      );

    input.focus();
    input.select();

    document.execCommand(
      "copy"
    );

    alert(
      "Store link copied."
    );
  }
}


function goMarketplace() {

  window.location.href =
    "marketplace.html";
}


/* =========================================================
   START
   ========================================================= */

loadStore()
  .catch(
    error => {

      console.error(
        "Store error:",
        error
      );

      showError(
        error.message ||
        "Unable to load this store."
      );
    }
  );

</script>

</body>
</html>
