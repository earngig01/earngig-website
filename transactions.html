<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transactions | EarnGig</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    .page-back {
      display: inline-block;
      margin-bottom: 20px;
    }

    .transaction-list {
      margin-top: 24px;
    }

    .transaction-item {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      padding: 17px;

      margin-bottom: 10px;

      border:
        1px solid rgba(139, 92, 246, 0.15);

      border-radius: 15px;

      background:
        rgba(255,255,255,0.025);
    }

    .transaction-info {
      min-width: 0;
    }

    .transaction-info strong {
      display: block;

      font-size: 14px;

      line-height: 1.4;
    }

    .transaction-info small {
      display: block;

      margin-top: 5px;

      font-size: 11px;

      opacity: 0.6;
    }

    .transaction-amount {
      flex-shrink: 0;

      font-size: 15px;

      font-weight: 800;
    }

    .transaction-credit {
      color: #86efac;
    }

    .transaction-debit {
      color: #fca5a5;
    }

    .loading-state {
      padding: 30px;

      text-align: center;

      opacity: 0.7;
    }

    @media (max-width: 600px) {

      .transaction-item {
        padding: 14px;
        gap: 12px;
      }

      .transaction-info strong {
        max-width: 210px;
      }

      .transaction-amount {
        font-size: 14px;
      }

    }

  </style>

</head>


<body>

<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >

      <span class="logo-mark">
        E
      </span>

      Earn<span>Gig</span>

    </a>


    <nav>

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="membership.html">
        Membership
      </a>

    </nav>


    <a
      class="btn outline"
      href="profile.html"
    >
      My Profile
    </a>

  </div>

</header>



<main class="dashboard-page">

  <div class="container">


    <a
      href="dashboard.html"
      class="text-link page-back"
    >
      ← Back to Dashboard
    </a>


    <div class="dashboard-heading">

      <div>

        <span class="eyebrow">
          WALLET
        </span>

        <h1>
          All transactions
        </h1>

        <p>
          View your complete EarnGig wallet transaction history.
        </p>

      </div>

    </div>



    <section class="dashboard-section">

      <div
        id="transaction-list"
        class="transaction-list"
      >

        <div class="loading-state">
          Loading transactions...
        </div>

      </div>

    </section>


  </div>

</main>



<footer>

  <div class="container copy">

    © 2026 EarnGig.
    All rights reserved.

  </div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const NON_EARNING_TYPES = new Set([

  "advert_payment",
  "advert_payment_with_wallet",
  "ad_payment",
  "task_payment",
  "task_refund",
  "withdrawal",
  "withdraw",
  "withdrawal_fee",
  "debit",
  "payment",
  "membership_payment",
  "membership_fee",
  "listing_fee",
  "novel_listing_fee",
  "refund",
  "fee",
  "charge"

]);



function formatNaira(
  amount
) {

  return "₦" +
    Number(
      amount || 0
    ).toLocaleString(
      "en-NG"
    );

}



function getTransactionType(
  transaction
) {

  return String(
    transaction?.type || ""
  )
    .trim()
    .toLowerCase();

}



function isWithdrawal(
  transaction
) {

  const type =
    getTransactionType(
      transaction
    );

  return (
    type === "withdrawal" ||
    type === "withdraw" ||
    type === "withdrawal_fee" ||
    type.includes("withdraw")
  );

}



function isPaymentOrDebit(
  transaction
) {

  const type =
    getTransactionType(
      transaction
    );


  if (
    isWithdrawal(transaction)
  ) {

    return true;

  }


  if (
    NON_EARNING_TYPES.has(type)
  ) {

    return true;

  }


  return (
    type.includes("payment") ||
    type.includes("fee") ||
    type.includes("charge") ||
    type === "debit"
  );

}



async function loadTransactions() {

  const list =
    document.getElementById(
      "transaction-list"
    );


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient
      .auth
      .getUser();


  if (
    userError ||
    !user
  ) {

    window.location.href =
      "login.html";

    return;

  }


  const {
    data: transactions,
    error
  } =
    await supabaseClient
      .from("transactions")
      .select(`
        id,
        type,
        amount,
        status,
        description,
        reference,
        created_at
      `)
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );

    list.innerHTML = `
      <div class="loading-state">

        <h3>
          Unable to load transactions
        </h3>

        <p>
          Please try again later.
        </p>

      </div>
    `;

    return;

  }


  if (
    !transactions ||
    transactions.length === 0
  ) {

    list.innerHTML = `
      <div class="loading-state">

        <div class="empty-icon">
          ₦
        </div>

        <h3>
          No transactions yet
        </h3>

        <p>
          Your wallet activity will appear here.
        </p>

      </div>
    `;

    return;

  }


  list.innerHTML =
    transactions
      .map(
        transaction => {

          const numericAmount =
            Number(
              transaction.amount || 0
            );


          const amount =
            Math.abs(
              numericAmount
            );


          const debit =
            numericAmount < 0 ||
            isPaymentOrDebit(
              transaction
            );


          const date =
            transaction.created_at
              ? new Date(
                  transaction.created_at
                ).toLocaleString(
                  "en-NG",
                  {
                    timeZone:
                      "Africa/Lagos",
                    year:
                      "numeric",
                    month:
                      "short",
                    day:
                      "numeric",
                    hour:
                      "2-digit",
                    minute:
                      "2-digit",
                    second:
                      "2-digit"
                  }
                )
              : "";


          return `
            <article class="transaction-item">

              <div class="transaction-info">

                <strong>
                  ${
                    transaction.description ||
                    transaction.type ||
                    "Wallet transaction"
                  }
                </strong>

                <small>
                  ${date}
                </small>

                <small>
                  Type:
                  ${
                    transaction.type ||
                    "Transaction"
                  }
                </small>

                <small>
                  Status:
                  ${
                    transaction.status ||
                    "completed"
                  }
                </small>

              </div>


              <div
                class="transaction-amount ${
                  debit
                    ? "transaction-debit"
                    : "transaction-credit"
                }"
              >

                ${
                  debit
                    ? "−"
                    : "+"
                }${formatNaira(amount)}

              </div>

            </article>
          `;

        }
      )
      .join("");

}



loadTransactions();

</script>


</body>
</html>
