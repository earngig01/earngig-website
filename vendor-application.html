<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vendor Application | EarnGig</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #24104f 0%,
          #10133d 45%,
          #07091e 100%
        );

      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #6d5dfc,
          #4f46e5
        );

      font-size: 22px;
      font-weight: 900;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
    }

    .brand span {
      color: #7568ff;
    }

    .account-btn {
      padding: 11px 15px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,0.14);

      background:
        rgba(255,255,255,0.04);

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;
    }

    .card {
      background:
        rgba(12,16,52,0.95);

      border:
        1px solid
        rgba(124,108,255,0.24);

      border-radius: 24px;

      padding: 32px 22px;

      text-align: center;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.35);
    }

    .status-icon {
      width: 82px;
      height: 82px;

      margin: 0 auto 20px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(34,197,94,0.12);

      border:
        1px solid
        rgba(34,197,94,0.30);

      color: #86efac;

      font-size: 42px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;

      font-size: 28px;
    }

    .description {
      max-width: 570px;

      margin: 0 auto;

      color: #aaa8c4;

      font-size: 15px;

      line-height: 1.7;
    }

    .store-card {
      margin-top: 25px;

      padding: 19px;

      border-radius: 17px;

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid
        rgba(255,255,255,0.08);

      text-align: left;
    }

    .store-label {
      color: #777391;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }

    .store-name {
      margin-top: 7px;

      font-size: 20px;
      font-weight: 900;
    }

    .store-location {
      margin-top: 6px;

      color: #aaa8c4;

      font-size: 13px;
    }

    .active-badge {
      display: inline-flex;

      align-items: center;
      gap: 7px;

      margin-top: 14px;

      padding: 8px 12px;

      border-radius: 999px;

      background:
        rgba(34,197,94,0.10);

      border:
        1px solid
        rgba(34,197,94,0.25);

      color: #86efac;

      font-size: 12px;

      font-weight: 800;
    }

    .active-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #4ade80;
    }

    .payment-confirmed {
      margin-top: 15px;

      padding: 14px;

      border-radius: 13px;

      background:
        rgba(124,92,246,0.08);

      border:
        1px solid
        rgba(124,92,246,0.20);

      color: #c4b5fd;

      font-size: 13px;

      line-height: 1.5;
    }

    .button {
      width: 100%;

      margin-top: 22px;

      padding: 16px;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #6d4aff,
          #8b3ffc
        );

      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;
    }

    .secondary-button {
      margin-top: 10px;

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid
        rgba(255,255,255,0.12);
    }

    .loading {
      color: #aaa8c4;

      font-size: 14px;

      line-height: 1.6;
    }

    .spinner {
      display: inline-block;

      width: 16px;
      height: 16px;

      margin-right: 7px;

      border:
        2px solid
        rgba(255,255,255,0.25);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      vertical-align: -3px;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;

      margin-top: 18px;

      padding: 14px;

      border-radius: 13px;

      background:
        rgba(239,68,68,0.08);

      border:
        1px solid
        rgba(239,68,68,0.25);

      color: #fca5a5;

      font-size: 13px;

      line-height: 1.5;

      word-break: break-word;
    }

    @media (max-width: 500px) {

      .page {
        padding: 14px 12px 30px;
      }

      .card {
        padding: 27px 17px;
      }

      h1 {
        font-size: 24px;
      }

      .brand {
        font-size: 18px;
      }

      .account-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

    }
  </style>
</head>

<body>

<main class="page">

  <div class="topbar">

    <div class="brand-wrap">

      <div class="brand-icon">
        E
      </div>

      <div class="brand">
        Earn<span>Gig</span>
      </div>

    </div>

    <button
      class="account-btn"
      type="button"
      onclick="goToAccount()"
    >
      My Account
    </button>

  </div>


  <section class="card">

    <div
      id="statusIcon"
      class="status-icon"
    >
      <span id="statusIconText">✓</span>
    </div>


    <h1 id="pageTitle">
      Checking Store Status
    </h1>


    <p
      id="pageDescription"
      class="description"
    >
      <span class="loading">
        <span class="spinner"></span>
        Checking your marketplace store...
      </span>
    </p>


    <div
      id="storeCard"
      class="store-card"
      style="display:none;"
    >

      <div class="store-label">
        Your Marketplace Store
      </div>

      <div
        id="storeName"
        class="store-name"
      >
        —
      </div>

      <div
        id="storeLocation"
        class="store-location"
      >
        —
      </div>

      <div class="active-badge">

        <span class="active-dot"></span>

        <span>
          Store Active
        </span>

      </div>

    </div>


    <div
      id="paymentConfirmed"
      class="payment-confirmed"
      style="display:none;"
    >
      ✓ Your ₦2,500 vendor subscription has been
      received and confirmed. Your store is now
      active on EarnGig Marketplace.
    </div>


    <button
      id="primaryButton"
      class="button"
      type="button"
      style="display:none;"
      onclick="openStore()"
    >
      Open Vendor Store
    </button>


    <button
      id="secondaryButton"
      class="button secondary-button"
      type="button"
      onclick="goToMarketplace()"
    >
      Back to Marketplace
    </button>


    <div
      id="errorBox"
      class="error"
    ></div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://ytvtdelwefykeqwztcyo.supabase.co";


const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0dnRkZWx3ZWZ5a2Vxd3p0Y3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMDkwMjUsImV4cCI6MjEwMTg4NTAyNX0.qzT3lYrTFupgGAxQ0VZl26hqblLQDs0vc9ZNiwBU9tA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


let currentUser = null;
let currentStore = null;


function goToMarketplace() {

  window.location.href =
    "marketplace.html";

}


function goToAccount() {

  window.location.href =
    "account.html";

}


function getStoreLocation(
  store
) {

  return (
    store.location_display ||

    [
      store.business_area,
      store.business_city,
      store.business_lga,
      store.business_state
    ]
      .filter(Boolean)
      .join(", ")
  ) ||
  "Store location not provided";

}


function showError(
  message
) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.style.display =
    "block";

}


function showActiveStore() {

  document.getElementById(
    "pageTitle"
  ).textContent =
    "Store Activated";


  document.getElementById(
    "pageDescription"
  ).textContent =
    "Your vendor application and ₦2,500 subscription have been successfully processed. Your marketplace store is now active.";


  document.getElementById(
    "storeCard"
  ).style.display =
    "block";


  document.getElementById(
    "storeName"
  ).textContent =
    currentStore.store_name ||
    "Your Marketplace Store";


  document.getElementById(
    "storeLocation"
  ).textContent =
    getStoreLocation(
      currentStore
    );


  document.getElementById(
    "paymentConfirmed"
  ).style.display =
    "block";


  document.getElementById(
    "primaryButton"
  ).style.display =
    "block";


  document.getElementById(
    "primaryButton"
  ).textContent =
    "Open Vendor Store";


  document.getElementById(
    "statusIconText"
  ).textContent =
    "✓";

}


function showPendingPayment() {

  document.getElementById(
    "pageTitle"
  ).textContent =
    "Application Approved";


  document.getElementById(
    "pageDescription"
  ).textContent =
    "Your vendor application has been approved. Complete your ₦2,500 monthly vendor subscription to activate your marketplace store.";


  document.getElementById(
    "storeCard"
  ).style.display =
    "block";


  document.getElementById(
    "storeName"
  ).textContent =
    currentStore.store_name ||
    "Your Marketplace Store";


  document.getElementById(
    "storeLocation"
  ).textContent =
    getStoreLocation(
      currentStore
    );


  document.getElementById(
    "primaryButton"
  ).style.display =
    "block";


  document.getElementById(
    "primaryButton"
  ).textContent =
    "Continue to Subscription";


  document.getElementById(
    "primaryButton"
  ).onclick =
    function() {

      window.location.href =
        "vendor-subscription.html";

    };

}


function showOtherStatus() {

  document.getElementById(
    "pageTitle"
  ).textContent =
    "Marketplace Store Status";


  document.getElementById(
    "pageDescription"
  ).textContent =
    "Your marketplace store is currently being processed.";


  document.getElementById(
    "storeCard"
  ).style.display =
    "block";


  document.getElementById(
    "storeName"
  ).textContent =
    currentStore.store_name ||
    "Your Marketplace Store";


  document.getElementById(
    "storeLocation"
  ).textContent =
    getStoreLocation(
      currentStore
    );


  document.querySelector(
    ".active-badge"
  ).innerHTML =
    '<span class="active-dot"></span><span>' +
    (
      currentStore.status ||
      "Pending"
    ) +
    "</span>";

}


function openStore() {

  if (
    currentStore &&
    currentStore.store_slug
  ) {

    window.location.href =
      "store.html?store=" +
      encodeURIComponent(
        currentStore.store_slug
      );

    return;

  }


  window.location.href =
    "vendor-dashboard.html";

}


async function loadStoreStatus() {

  try {

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {

      throw new Error(
        "Session error: " +
        sessionError.message
      );

    }


    if (
      !sessionData ||
      !sessionData.session ||
      !sessionData.session.user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      sessionData.session.user;


    /*
     * Use the same direct REST approach that
     * we already confirmed works for this
     * Supabase project.
     */

    const accessToken =
      sessionData.session.access_token;


    const storeUrl =
      SUPABASE_URL +
      "/rest/v1/marketplace_stores" +
      "?select=" +
      encodeURIComponent(
        "id,vendor_id,store_name,store_slug,status,business_state,business_lga,business_city,business_area,location_display,created_at"
      ) +
      "&vendor_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&order=created_at.desc" +
      "&limit=1";


    const response =
      await fetch(
        storeUrl,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json"
          }
        }
      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    } catch {

      data =
        null;

    }


    if (!response.ok) {

      throw new Error(
        "Store lookup failed: HTTP " +
        response.status +
        " - " +
        (
          data?.message ||
          data?.error ||
          responseText ||
          "Unknown error."
        )
      );

    }


    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      throw new Error(
        "No marketplace store was found for your account."
      );

    }


    currentStore =
      data[0];


    /*
     * THIS IS THE IMPORTANT PART.
     *
     * If the database says active,
     * the page acknowledges the payment
     * and removes the payment request.
     */

    if (
      currentStore.status ===
      "active"
    ) {

      showActiveStore();

      return;

    }


    if (
      currentStore.status ===
      "pending_payment"
    ) {

      showPendingPayment();

      return;

    }


    showOtherStatus();


  } catch (error) {

    console.error(
      "Application status error:",
      error
    );


    document.getElementById(
      "pageTitle"
    ).textContent =
    "Unable to Check Store";


    document.getElementById(
      "pageDescription"
    ).textContent =
      "We could not retrieve your marketplace store status right now.";


    showError(
      error?.message ||
      "Could not load your marketplace store."
    );

  }

}


loadStoreStatus();

</script>

</body>
</html>
